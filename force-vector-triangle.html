    const canvas = $('scene'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
    const norm = a => ((a % 360) + 360) % 360;
    const clean = v => (Math.abs(v) < 0.05 ? 0 : v);
    // 3 significant figures, as the lecturer copy gives them (6.34 N, 4.70 N, 56.8°); a whole number stays whole
    // (50 N, 0 N). The nudge rounds a binary half up (toPrecision rounds 4.705 down); 100 and over print no exponent.
    const f3 = v => {
      const x = clean(v);
      if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x)).replace('-', '−');
      const t = (x * (1 + 1e-12)).toPrecision(3);
      return (Math.abs(x) >= 100 ? String(+t) : t).replace('-', '−');
    };
    const sg = v => (clean(v) > 0 ? '+' : '') + f3(v);      // with its sign, as the sign convention asks
    const plain = v => String(+(+v).toFixed(1)).replace('-', '−'); // a typed value as typed: 10, 14.1
    const LAB = { P: '<i>P</i>', Q: '<i>Q</i>', F: '<i>F</i>', F1: '<i>F</i><sub>1</sub>', F2: '<i>F</i><sub>2</sub>', F3: '<i>F</i><sub>3</sub>' };
    const COL = { P: '#2563eb', Q: '#16a34a', F: '#1d4ed8', F1: '#2563eb', F2: '#16a34a', F3: '#d97706', R: '#dc2626', X: '#ea580c', Y: '#7c3aed' };
    const SF = 'Σ<i>F</i>', FX = '<i>F</i><sub><i>x</i></sub>', FY = '<i>F</i><sub><i>y</i></sub>', RX = '<i>R</i><sub><i>x</i></sub>', RY = '<i>R</i><sub><i>y</i></sub>';
    const sub = (k, s) => LAB[k].replace(/<sub>(\d)<\/sub>/, `<sub>$1<i>${s}</i></sub>`).replace(/^<i>([A-Z])<\/i>$/, `<i>$1</i><sub><i>${s}</i></sub>`); // F1 -> F1x, P -> Px

    /* ---------------- scenarios (every number from the notes or Tutorial 3) ---------------- */
    // a force is [key, magnitude in N, direction in degrees anticlockwise from +x, the axis its angle is given from]
    const PRESETS = {
      one: { tab: 1, kind: 'single', name: 'One force drawn to scale', npb: 5, forces: [['F', 10, 0]],
        q: 'Notes p. 3-8: a force is drawn as an arrow to scale. Scale: 1 box represents 5 N. The notes draw 10 N to the right, 15 N upward and 14.1 N at 45° with respect to the +<i>x</i>-axis. Drag the arrowhead to draw each of them.' },
      objA: { tab: 1, kind: 'line', name: 'Object A: 5 N and 5 N', npb: 1, forces: [['F1', 5, 0], ['F2', 5, 0]],
        q: 'Example 1 (notes p. 3-11): What is the resultant force on objects A, B and C? Object A: 5 N to the right and 5 N to the right.' },
      objB: { tab: 1, kind: 'line', name: 'Object B: 10 N and 5 N', npb: 1, forces: [['F1', 10, 0], ['F2', 5, 180]],
        q: 'Example 1 (notes p. 3-11): What is the resultant force on objects A, B and C? Object B: 10 N to the right and 5 N to the left.' },
      objC: { tab: 1, kind: 'line', name: 'Object C: 5 N each way', npb: 1, forces: [['F1', 5, 0], ['F2', 5, 180]],
        q: 'Example 1 (notes p. 3-11): What is the resultant force on objects A, B and C? Object C: 5 N to the right and 5 N to the left.' },
      ex5: { tab: 2, kind: 'triangle', name: '30 N and 40 N, 90° apart', npb: 5, forces: [['P', 30, 0], ['Q', 40, 90]],
        q: 'Example 5 (notes p. 3-25): Two forces of magnitude 30 N and 40 N act on an object. The angle between the two forces is 90°. Find the resultant force by scale drawing.' },
      ex6: { tab: 2, kind: 'triangle', name: '30 N and 40 N, 30° apart', npb: 5, forces: [['P', 30, 0], ['Q', 40, 30]],
        q: 'Example 6 (notes p. 3-26): A 30 N force and a 40 N force act on a particle. The angle between the two forces is 30°. Find, by scale drawing, the magnitude and direction of the resultant force.' },
      a2a: { tab: 2, kind: 'triangle', name: '15 N and 20 N, 90° apart', npb: 5, forces: [['P', 15, 180], ['Q', 20, 270]],
        q: 'Tutorial 3, A2(a): Find, by scale drawing, the magnitude and direction of the resultant force. A 15 N force acts to the left and a 20 N force acts downwards, 90° apart.' },
      a2b: { tab: 2, kind: 'triangle', name: '15 N and 20 N, 150° apart', npb: 5, forces: [['P', 15, 0], ['Q', 20, 150]],
        q: 'Tutorial 3, A2(b): Find, by scale drawing, the magnitude and direction of the resultant force. A 15 N force acts to the right and a 20 N force acts 150° from it.' },
      ex2: { tab: 2, kind: 'triangle', name: '50 N and 70 N', npb: 10, forces: [['P', 50, 0], ['Q', 70, 60]],
        q: 'Example 2 (notes p. 3-12): A 50 N and a 70 N force act on a particle. What is the largest and the smallest resultant force on the particle? Change the angle from <i>P</i> to <i>Q</i> and watch Σ<i>F</i>.' },
      ex7: { tab: 3, kind: 'resolve', name: '5 N, 20° above the +x-axis', npb: 1, forces: [['F', 5, 20, 'x']],
        q: 'Example 7 (notes p. 3-29): A force <i>F</i> is 20° above the +<i>x</i>-axis and has a magnitude of 5 N. Resolve <i>F</i> into its <i>x</i>-component and <i>y</i>-component, i.e. calculate ' + FX + ' and ' + FY + '.' },
      ex8: { tab: 3, kind: 'resolve', name: '8 N, 60° below the +x-axis', npb: 1, forces: [['F', 8, 300, 'x']],
        q: 'Example 8 (notes p. 3-30): Calculate the <i>x</i>- and <i>y</i>-components of the 8 N force. It points 60° below the +<i>x</i>-axis (30° from the −<i>y</i>-axis).' },
      e1a: { tab: 3, kind: 'resolve', name: '15 N, 40° from the +y-axis', npb: 2, forces: [['F', 15, 50, 'y']],
        q: 'Exercise 1 (notes p. 3-31): Find the <i>x</i>- and <i>y</i>-components in terms of the given force and angle with the appropriate sign convention. This force: 15 N, 40° to the right of the +<i>y</i>-axis.' },
      e1b: { tab: 3, kind: 'resolve', name: '8 N, 45° above the −x-axis', npb: 1, forces: [['F', 8, 135, 'x']],
        q: 'Exercise 1 (notes p. 3-31): Find the <i>x</i>- and <i>y</i>-components in terms of the given force and angle with the appropriate sign convention. This force: 8 N, 45° above the −<i>x</i>-axis.' },
      e1c: { tab: 3, kind: 'resolve', name: '10 N, 20° below the −x-axis', npb: 2, forces: [['F', 10, 200, 'x']],
        q: 'Exercise 1 (notes p. 3-31): Find the <i>x</i>- and <i>y</i>-components in terms of the given force and angle with the appropriate sign convention. This force: 10 N, 20° below the −<i>x</i>-axis.' },
      e1d: { tab: 3, kind: 'resolve', name: '13 N, 70° below the +x-axis', npb: 2, forces: [['F', 13, 290, 'x']],
        q: 'Exercise 1 (notes p. 3-31): Find the <i>x</i>- and <i>y</i>-components in terms of the given force and angle with the appropriate sign convention. This force: 13 N, 70° below the +<i>x</i>-axis.' },
      ex9: { tab: 4, kind: 'components', name: 'Two forces: 20 N and 25 N', npb: 5, forces: [['F1', 20, 100, 'x'], ['F2', 25, 270, 'y']],
        q: 'Example 9 (notes p. 3-33): Two forces act on an object as shown in the diagram. Find, by the component method, their resultant force. ' + LAB.F1 + ' = 20 N at 80° above the −<i>x</i>-axis; ' + LAB.F2 + ' = 25 N straight down.' },
      ex10: { tab: 4, kind: 'components', name: 'Three ropes: 25 N, 16 N, 20 N', npb: 5, forces: [['F1', 25, 0, 'x'], ['F2', 16, 270, 'y'], ['F3', 20, 200, 'x']],
        q: 'Example 10 (notes p. 3-35): Three forces act on a point as shown in the diagram. Draw the forces acting on the point and calculate their resultant force. The 25 N rope pulls to the right, the 16 N rope pulls straight down, and the 20 N rope pulls at 70° to the 16 N rope (20° below the −<i>x</i>-axis).' },
      c1a: { tab: 4, kind: 'components', name: 'Three forces: 32 N, 25 N, 48 N', npb: 10, forces: [['F1', 32, 0, 'x'], ['F2', 25, 210, 'x'], ['F3', 48, 220, 'y']],
        q: 'Tutorial 3, C1(a): Find, by resolution of forces method, the magnitude and direction of the resultant of the three forces as shown. 32 N along the +<i>x</i>-axis, 25 N at 30° below the −<i>x</i>-axis, 48 N at 50° from the −<i>y</i>-axis.' },
      ex6c: { tab: 4, kind: 'components', name: '30 N and 40 N, 30° apart', npb: 5, forces: [['F1', 30, 0, 'x'], ['F2', 40, 30, 'x']],
        q: 'Example 6 again (notes p. 3-26), this time by the component method: 30 N along the +<i>x</i>-axis and 40 N at 30° above it. Compare the answer with your scale drawing on step 2.' },
      custom: { name: 'Your own forces' }
    };

    /* ---------------- the state: the forces on screen, the step, the view ---------------- */
    let S = { scen: 'one', kind: 'single', forces: [], step: 1, npb: 5 };
    const STEPS = { single: 3, line: 4, triangle: 4, resolve: 4, components: 6 };
    const mkForce = ([k, m, a, ref]) => ({ k, m, a: norm(a), ref: ref || 'x' });
    function loadScenario(id) {
      const P = PRESETS[id];
      S.scen = id;
      if (id !== 'custom') { S.kind = P.kind; S.forces = P.forces.map(mkForce); S.npb = P.npb; S.base = id; }
      S.step = freeMode ? STEPS[S.kind] : 1;
      $('showOther').checked = false;
      if (id !== 'custom') { $('question').style.minHeight = ''; $('question').innerHTML = P.q; }
      else $('question').innerHTML = 'Your own forces. Choose a scenario from the menu to go back to an example from the notes.';
      view = null;
    }
    const vec = f => ({ x: f.m * Math.cos(rad(f.a)), y: f.m * Math.sin(rad(f.a)) });
    // line forces are signed: + right, − left
    const signed = f => (Math.cos(rad(f.a)) < 0 ? -f.m : f.m);
    function resultant() {
      let x = 0, y = 0;
      for (const f of S.forces) { const v = vec(f); x += v.x; y += v.y; }
      if (Math.abs(x) < 1e-9) x = 0; if (Math.abs(y) < 1e-9) y = 0;
      return { x, y, m: Math.hypot(x, y), a: norm(deg(Math.atan2(y, x))) };
    }

    // a direction in the words the notes use: "20° below the −x-axis", "along the +y-axis"
    function dirWords(x, y) {
      x = clean(x); y = clean(y);
      if (!x && !y) return 'no direction';
      if (!y) return x > 0 ? 'along the +<i>x</i>-axis (to the right)' : 'along the −<i>x</i>-axis (to the left)';
      if (!x) return y > 0 ? 'along the +<i>y</i>-axis (upward)' : 'along the −<i>y</i>-axis (downward)';
      const al = deg(Math.atan2(Math.abs(y), Math.abs(x)));
      return `${f3(al)}° ${y > 0 ? 'above' : 'below'} the ${x > 0 ? '+' : '−'}<i>x</i>-axis`;
    }
    // the angle a force's diagram gives: measured from the x half-axis or the y half-axis it lies nearest
    function givenOf(f) {
      const a = norm(f.a), c = Math.cos(rad(a)), s = Math.sin(rad(a));
      const axis = f.ref === 'y' ? (s >= -1e-9 ? 90 : 270) : (c >= -1e-9 ? 0 : 180);
      let d = norm(a - axis); if (d > 180) d = 360 - d;
      const name = { 0: '+<i>x</i>', 90: '+<i>y</i>', 180: '−<i>x</i>', 270: '−<i>y</i>' }[axis];
      const side = f.ref === 'y' ? (c > 1e-9 ? 'to the right of' : 'to the left of') : (s > 1e-9 ? 'above' : 'below');
      return { axis, ang: d, onAxis: Math.abs(a % 90) < 1e-9, text: d < 1e-9 ? `along the ${name}-axis` : `${plain(d)}° ${side} the ${name}-axis` };
    }
    // one component worked out as on paper: "Fx = −10 cos 20° = −9.40 N"
    function compWork(f, which) {
      const v = vec(f), val = which === 'x' ? v.x : v.y, G = givenOf(f);
      const lab = which === 'x' ? sub(f.k, 'x') : sub(f.k, 'y');
      if (G.onAxis) return `${lab} = ${clean(val) ? sg(val) : '0'} N`;
      const trig = (f.ref === 'y') === (which === 'x') ? 'sin' : 'cos';
      const s = clean(val) < 0 ? '−' : '+';
      return `${lab} = ${s}${plain(f.m)} ${trig} ${plain(G.ang)}° = ${sg(val)} N`;
    }

    /* ---------------- the view: fit every point of the drawing, 1 box = a whole number of newtons ---------------- */
    let view = null, dragging = null;
    const LADDER = [1, 2, 5, 10, 20, 50, 100];
    function points() {
      const R = resultant(), pts = [{ x: 0, y: 0 }];
      if (S.kind === 'triangle') { const P = vec(S.forces[0]), Q = vec(S.forces[1]); pts.push(P, Q, { x: P.x + Q.x, y: P.y + Q.y }); }
      else for (const f of S.forces) { const v = vec(f); pts.push(v, { x: v.x, y: 0 }, { x: 0, y: v.y }); }
      if (S.kind === 'components') pts.push({ x: R.x, y: 0 }, R);
      return pts;
    }
    function fit(W, H) {
      if (S.kind === 'line') {
        // forces on a line: the object, its forces from its edges, then the sum row below
        const v = S.forces.map(signed), xs = [0, ...v, v[0], v[0] + v[1]];
        let lo = Math.min(...xs), hi = Math.max(...xs);
        const half = 22, mx = 46;
        let npb = S.npb, px = 30;
        for (const n of LADDER.filter(n => n >= S.npb)) {
          npb = n; const span = (hi - lo) / n;
          px = Math.min(30, (W - 2 * mx - 2 * half) / Math.max(span, 1));
          if (px >= 12) break;
        }
        const s = px / npb;
        return { s, npb, box: px, ox: Math.round(W / 2 - ((lo + hi) / 2) * s), oy: Math.round(H * 0.3), half };
      }
      const pts = points();
      const lo = { x: Math.min(...pts.map(p => p.x)), y: Math.min(...pts.map(p => p.y)) };
      const hi = { x: Math.max(...pts.map(p => p.x)), y: Math.max(...pts.map(p => p.y)) };
      const mx = W < 500 ? 36 : 60, my = 34;
      let npb = S.npb, px = 30;
      for (const n of LADDER.filter(n => n >= S.npb)) {
        npb = n;
        const sx = Math.max((hi.x - lo.x) / n, 4), sy = Math.max((hi.y - lo.y) / n, 3);
        px = Math.min(56, (W - 2 * mx) / sx, (H - 2 * my) / sy);
        if (px >= 12) break;
      }
      const s = px / npb;
      return { s, npb, box: px, ox: Math.round(W / 2 - ((lo.x + hi.x) / 2) * s), oy: Math.round(H / 2 + ((lo.y + hi.y) / 2) * s) };
    }
    function setup() {
      const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      const cw = Math.round(r.width * dpr), ch = Math.round(r.height * dpr);
      if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
      const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = r.width, H = r.height;
      // the scale holds still while a finger drags, then refits
      if (!dragging || !view || view.W !== W || view.H !== H) view = Object.assign(fit(W, H), { W, H });
      // A canvas measured at no size (hidden on tab 5) gives a zero or negative box, and the grid loop never ended:
      // the page stopped drawing and the renderer crashed (2026-10-24). Floor the box; the grid is capped as well.
      if (!(view.box >= 4) || !Number.isFinite(view.s)) { view.box = Math.max(4, view.box || 0); if (!Number.isFinite(view.s) || view.s <= 0) view.s = view.box / view.npb; }
      return { ctx, W, H };
    }
    const toPx = (x, y) => ({ x: view.ox + x * view.s, y: view.oy - y * view.s });

    /* ---------------- drawing helpers ---------------- */
    // Canvas text with <i>, <sub> and <sup> runs, so symbols of physical quantities are italic, as in the notes.
    function richText(ctx, s, x, y, measureOnly) {
      const base = ctx.font, m = base.match(/([\d.]+)px/), size = m ? +m[1] : 12;
      const runs = []; let it = false, sb = 0;
      for (const tok of String(s).split(/(<\/?(?:i|sub|sup)>)/)) {
        if (tok === '<i>') it = true; else if (tok === '</i>') it = false;
        else if (tok === '<sub>') sb = 1; else if (tok === '<sup>') sb = -1;
        else if (tok === '</sub>' || tok === '</sup>') sb = 0;
        else if (tok) {
          let f = sb ? base.replace(/[\d.]+px/, (size * 0.75).toFixed(1) + 'px') : base;
          if (it) f = 'italic ' + f;
          ctx.font = f; runs.push({ t: tok, f, sb, w: ctx.measureText(tok).width });
        }
      }
      ctx.font = base;
      const w = runs.reduce((a, r) => a + r.w, 0);
      if (measureOnly) return w;
      const align = ctx.textAlign;
      let cx = align === 'center' ? x - w / 2 : (align === 'right' || align === 'end') ? x - w : x;
      ctx.textAlign = 'left';
      for (const r of runs) { ctx.font = r.f; ctx.fillText(r.t, cx, y + (r.sb === 1 ? size * 0.3 : r.sb === -1 ? -size * 0.4 : 0)); cx += r.w; }
      ctx.textAlign = align; ctx.font = base;
      return w;
    }
    function arrow(ctx, a, b, color, lw = 4, dash = null) {
      const ang = Math.atan2(b.y - a.y, b.x - a.x), len = Math.hypot(b.x - a.x, b.y - a.y);
      if (len < 2) return;
      const head = Math.min(14, len * 0.45);
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x - Math.cos(ang) * head * 0.8, b.y - Math.sin(ang) * head * 0.8); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - head * Math.cos(ang - 0.42), b.y - head * Math.sin(ang - 0.42));
      ctx.lineTo(b.x - head * Math.cos(ang + 0.42), b.y - head * Math.sin(ang + 0.42));
      ctx.closePath(); ctx.fill();
    }
    function dashed(ctx, a, b, color) {
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
    }
    // a label on a white card; every label is kept whole on the canvas and steps aside from labels already drawn
    let labels = [], pending = [];
    const hits = (a, b) => a.x < b.x + b.w + 4 && b.x < a.x + a.w + 4 && a.y < b.y + b.h + 2 && b.y < a.y + a.h + 2;
    function card(ctx, text, x, y, color, align = 'center', size = 13) {
      ctx.font = `bold ${size}px Arial`; ctx.textBaseline = 'middle';
      const tw = richText(ctx, text, 0, 0, true);
      let x0 = align === 'left' ? x : align === 'right' ? x - tw : x - tw / 2;
      x0 = Math.max(4, Math.min(view.W - tw - 4, x0));
      const clampY = v => Math.max(11, Math.min(view.H - 11, v));
      y = clampY(y);
      for (const dy of [0, -20, 20, -40, 40, -60, 60]) {
        const r = { x: x0, y: clampY(y + dy) - 9, w: tw, h: 18 };
        if (!labels.some(l => hits(l, r))) { y = clampY(y + dy); break; }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fillRect(x0 - 3, y - 9, tw + 6, 18);
      ctx.fillStyle = color; ctx.textAlign = 'left'; richText(ctx, text, x0, y); ctx.textBaseline = 'alphabetic';
      labels.push({ text, x: x0, y: y - 9, w: tw, h: 18 });
    }
    // a label beside the middle of an arrow, pushed off it to one side
    function tag(ctx, text, a, b, color, side = 1) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const nx = -(b.y - a.y) / L * side, ny = (b.x - a.x) / L * side;
      ctx.font = 'bold 13px Arial'; const tw = richText(ctx, text, 0, 0, true);
      card(ctx, text, mx + nx * (14 + tw * 0.5 * Math.abs(nx)), my + ny * 16, color);
    }
    // an angle mark from direction a0 to a1 (degrees anticlockwise from +x), labelled
    function arc(ctx, c, r, a0, a1, text, color) {
      let d = a1 - a0; if (Math.abs(d) < 0.5) return;
      ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(c.x, c.y, r, -rad(a0), -rad(a1), d > 0); ctx.stroke();
      // the angle's label is placed last, after the arrows' labels, so it is the one that steps aside
      const m = rad((a0 + a1) / 2);
      pending.push(() => card(ctx, text, c.x + Math.cos(m) * (r + 16), c.y - Math.sin(m) * (r + 16), color, 'center', 12));
    }
    function grid(ctx, W, H, axes = true) {
      const { ox, oy, box } = view;
      ctx.strokeStyle = '#eef2f7'; ctx.lineWidth = 1;
      for (let x = ((ox % box) + box) % box, n = 0; x < W && n < 400; x += box, n++) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = ((oy % box) + box) % box, n = 0; y < H && n < 400; y += box, n++) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      if (!axes) { ctx.fillStyle = '#334155'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.fillText(`1 box = ${view.npb} N`, 6, H - 8); return; }
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
      ctx.fillStyle = '#64748b'; ctx.font = '12px Arial'; ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'right'; richText(ctx, '+<i>x</i>', W - 6, oy - 6);
      ctx.textAlign = 'left'; richText(ctx, '+<i>y</i>', ox + 6, 14);
      ctx.fillStyle = '#334155'; ctx.font = 'bold 12px Arial'; ctx.fillText(`1 box = ${view.npb} N`, 6, H - 8);
    }

    /* ---------------- drawing, one function per kind of scene ---------------- */
    let handles = [];
    function draw() {
      const box = canvas.getBoundingClientRect();
      if (box.width < 20 || box.height < 20) return; // hidden (the Challenge tab): nothing to draw
      const { ctx, W, H } = setup();
      ctx.clearRect(0, 0, W, H); labels = []; handles = []; pending = [];
      if (S.kind === 'line') { grid(ctx, W, H, false); drawLine(ctx, W, H); }
      else { grid(ctx, W, H); ({ single: drawSingle, triangle: drawTriangle, resolve: drawResolve, components: drawComponents })[S.kind](ctx); }
      pending.forEach(f => f());
      ctx.fillStyle = '#0f172a';
      if (S.kind !== 'line') { const O = toPx(0, 0); ctx.beginPath(); ctx.arc(O.x, O.y, 4, 0, Math.PI * 2); ctx.fill(); }
      window.sceneMap = { handles: handles.map(h => ({ k: h.k, x: h.x, y: h.y })), labels, W, H };
    }
    function drawSingle(ctx) {
      const f = S.forces[0], O = toPx(0, 0), v = vec(f), T = toPx(v.x, v.y);

        else {
          const al = deg(Math.atan2(Math.abs(R.y), Math.abs(R.x)));
          h += `<div class="eq">tan <i>θ</i> = ${frac('|' + RY + '|', '|' + RX + '|')} = ${frac(f3(Math.abs(R.y)), f3(Math.abs(R.x)))}, so <i>θ</i> = <b>${f3(al)}°</b></div>`;
          h += `<div class="eq">${RX} is ${R.x > 0 ? 'positive (right)' : 'negative (left)'} and ${RY} is ${R.y > 0 ? 'positive (up)' : 'negative (down)'}, so <i>R</i> points <b>${dirWords(R.x, R.y)}</b>.</div>`;
        }
      }
      return h + '</div>';
    }
    function update() { draw(); readouts(); syncInputs(); }

    /* ---------------- steps and the scenario menu ---------------- */
    function setStep(n) { S.step = Math.max(1, Math.min(STEPS[S.kind], n)); feat = {}; hl = {}; syncFeatButtons(); $('featNote').textContent = ''; showOtherBox(); update(); }
    $('prevStep').addEventListener('click', () => setStep(S.step - 1));
    $('nextStep').addEventListener('click', () => setStep(S.step + 1));
    // Reset: back to step 1 of the scenario last chosen from the menu, with its own forces
    $('resetBtn').addEventListener('click', () => { const id = S.base || TABS[currentTab].presets[0]; presetEl.value = id; chooseScenario(id); });
    presetEl.addEventListener('change', () => chooseScenario(presetEl.value));
    $('showOther').addEventListener('change', update);
    function showOtherBox() { $('otherWrap').hidden = !(S.kind === 'triangle' && S.step >= 3); }
    function chooseScenario(id) {
      const kindBefore = S.kind;
      loadScenario(id);
      $('scene').classList.toggle('short', S.kind === 'line');
      if (S.kind !== kindBefore || !$('readout').children.length) buildCards();
      forceInputs(); feat = {}; hl = {}; syncFeatButtons(); $('featNote').textContent = '';
      showOtherBox();
      update(); // at once: a step line or scale left stale for a frame is wrong for whatever reads it next
    }

    /* ---------------- dragging the arrowheads ---------------- */
    function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function pick(p) {
      let best = null, bd = 24;
      for (const h of handles) { const d = Math.hypot(p.x - h.x, p.y - h.y); if (d < bd) { bd = d; best = h.k; } }
      return best;
    }
    canvas.addEventListener('pointerdown', e => {
      const k = pick(pos(e)); if (k === null) return;
      dragging = { k }; canvas.setPointerCapture(e.pointerId); e.preventDefault();
    });
    canvas.addEventListener('pointermove', e => {
      const p = pos(e);
      if (!dragging) { canvas.style.cursor = pick(p) !== null ? 'grab' : 'default'; return; }
      canvas.style.cursor = 'grabbing';
      // the pointer, kept on the canvas, in newtons
      const q = { x: Math.max(4, Math.min(view.W - 4, p.x)), y: Math.max(4, Math.min(view.H - 4, p.y)) };
      const k = dragging.k, f = S.forces[k];
      if (S.kind === 'line') {
        const dx = q.x - view.ox, out = Math.max(0, Math.abs(dx) - view.half) / view.s;
        f.m = Math.round(out * 2) / 2; f.a = dx < 0 ? 180 : 0;
      } else {
        let wx = (q.x - view.ox) / view.s, wy = (view.oy - q.y) / view.s;
        if (S.kind === 'triangle' && k === 1 && S.step >= 2) { const P = vec(S.forces[0]); wx -= P.x; wy -= P.y; }
        f.m = Math.min(200, Math.round(Math.hypot(wx, wy) * 2) / 2);
        if (f.m > 0) f.a = norm(Math.round(deg(Math.atan2(wy, wx))));
        f.ref = 'x';
      }
      toCustom(); update();
    });
    const endDrag = () => { if (dragging) { dragging = null; update(); } };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---------------- the tabs ---------------- */
    const TABS = {
      1: { strip: 'Answer Predict first. Then press Next step to build the answer one step at a time, or drag an arrowhead to change a force.',
        presets: ['one', 'objA', 'objB', 'objC'], hint: 'Drag an arrowhead to change the force. On a line, drag it past the object to turn it round.',
        key: [['#2563eb', 'Force 1'], ['#16a34a', 'Force 2'], ['#dc2626', 'Resultant ΣF']],
        notes: ['A force is a vector quantity: it has magnitude and direction (notes p. 3-2).', 'The length of the arrow shows the magnitude; the arrow points in the direction of the force (p. 3-8).', 'A force to the right or upward is positive; to the left or downward is negative (p. 3-10).'] },
      2: { strip: 'Answer Predict first. Then press Next step to add the two forces by the vector triangle method, one step at a time.',
        presets: ['ex5', 'ex6', 'a2a', 'a2b', 'ex2'], hint: 'Drag the arrowheads of P (blue) and Q (green), or type the values.',
        key: [['#2563eb', 'P'], ['#16a34a', 'Q'], ['#dc2626', 'Resultant ΣF']],
        notes: ['Vector triangle method: the tail of <i>Q</i> is placed at the tip of <i>P</i>. The resultant force Σ<i>F</i> joins the tail of <i>P</i> to the tip of <i>Q</i> (p. 3-24).', 'You get the same answer if you place the tail of <i>P</i> at the tip of <i>Q</i>.', 'The direction of the resultant force is between that of the two forces, and its magnitude is not the algebraic sum (p. 3-22).'] },
      3: { strip: 'Answer Predict first. Then press Next step to resolve the force into its two components, one step at a time.',
        presets: ['ex7', 'ex8', 'e1a', 'e1b', 'e1c', 'e1d'], hint: 'Drag the arrowhead to move the force round: watch the signs of the components change.',
        key: [['#1d4ed8', 'Force F'], ['#ea580c', 'Fx'], ['#7c3aed', 'Fy']],
        notes: ['Resolving a force into two perpendicular components is the reverse of adding two perpendicular forces (p. 3-28).', 'With <i>θ</i> measured from the <i>x</i>-axis: ' + FX + ' = <i>F</i> cos <i>θ</i> and ' + FY + ' = <i>F</i> sin <i>θ</i> (p. 3-27).', 'Then give each component its sign: right and up are positive.'] },
      4: { strip: 'Answer Predict first. Then press Next step to follow the six steps of the component method (notes p. 3-32).',
        presets: ['ex9', 'ex10', 'c1a', 'ex6c'], hint: 'Drag any arrowhead, or type the values: the table and the working follow.',
        key: [['#2563eb', 'F1'], ['#16a34a', 'F2'], ['#d97706', 'F3'], ['#dc2626', 'Resultant R']],
        notes: ['The vector triangle method can be very tedious when there are several forces to add; the component method adds any number (p. 3-27).', 'Angles in the direction column are measured anticlockwise from the +<i>x</i>-axis.'] },
      5: { strip: 'Answer every question, then read the summary.', key: [] }
    };

    const PREDICT = {
      1: { q: 'Example 1 (notes p. 3-11): object B has a 10 N force to the right and a 5 N force to the left. What is the resultant force on it?',
        opts: ['15 N to the right', '5 N to the right', '5 N to the left', '0 N'], ans: 1,
        why: 'Right is positive, left is negative: (+10) + (−5) = +5 N, so 5 N to the right. Choose Object B and press Next step to see the forces added along the line.' },
      2: { q: 'Example 5 (notes p. 3-25): a 30 N force and a 40 N force act on an object, 90° apart. What is the resultant force?',
        opts: ['70 N', '50 N', '10 N', '35 N'], ans: 1,
        why: 'The tail of the 40 N force goes at the tip of the 30 N force; the resultant closes a right-angled triangle: √(30² + 40²) = 50 N. It is not 30 + 40 = 70 N: the forces do not point the same way. Press Next step to check.' },
      3: { q: 'Example 8 (notes p. 3-30): the 8 N force points 60° below the +<i>x</i>-axis. What is its <i>y</i>-component ' + FY + '?',
        opts: ['+6.93 N', '−6.93 N', '+4 N', '−4 N'], ans: 1,
        why: FY + ' = −8 sin 60° = −6.93 N. Measured from the <i>x</i>-axis, the <i>y</i>-component uses sin; it is negative because the force points down. Choose the 8 N scenario and press Next step to check.' },
      4: { q: 'Example 9 (notes p. 3-33): ' + LAB.F1 + ' = 20 N at 80° above the −<i>x</i>-axis and ' + LAB.F2 + ' = 25 N straight down. Which way does their resultant point?',
        opts: ['Right and up', 'Left and up', 'Left and down', 'Right and down'], ans: 2,
        why: RX + ' = −20 cos 80° + 0 = −3.47 N (left) and ' + RY + ' = +20 sin 80° − 25 = −5.30 N (down): the 25 N downward pull beats the 19.7 N upward part of ' + LAB.F1 + '. So <i>R</i> points left and down.' }
    };

    const FEATS = {
      1: [['scale', 'Length shows the magnitude'], ['sign', 'Right and up are +'], ['line', 'Forces on a line: add with signs']],
      2: [['tail', 'Tail of Q at the tip of P'], ['other', 'Either order: same ΣF'], ['notsum', 'ΣF is not P + Q'], ['between', 'ΣF lies between P and Q']],
      3: [['cos', 'Fx = F cos θ'], ['sin', 'Fy = F sin θ'], ['signs', 'Signs from the direction'], ['yaxis', 'Angle from the y-axis']],
      4: [['table', 'The table'], ['pyth', 'R by Pythagoras'], ['tan', 'Direction from tan θ']]
    };
    const PROMPTS = {
      1: ['How many boxes long is a 14.1 N arrow, at 1 box = 5 N?', 'Why does a force need a direction as well as a magnitude?', 'Object C has two forces on it. Why is the resultant zero?'],
      2: ['What happens to Σ<i>F</i> as the angle between <i>P</i> and <i>Q</i> grows from 0° to 180°?', 'Why does placing <i>P</i> at the tip of <i>Q</i> give the same Σ<i>F</i>?', 'When is Σ<i>F</i> exactly <i>P</i> + <i>Q</i>?'],
      3: ['When do you use sin for the <i>x</i>-component?', 'Drag the force once round the origin. When is ' + FX + ' negative?', 'What are the components of a force that points straight down?'],
      4: ['Why is the component method easier than a scale drawing for three forces?', 'How do the signs of ' + RX + ' and ' + RY + ' tell you where <i>R</i> points?', 'Compare the component answer for Example 6 with the scale drawing on step 2.'],
      5: ['Which question did most of the class get wrong, and why?', 'Pick one wrong option: what mistake would lead a student to choose it?']
    };

    let feat = {}, predictPick = null;
    function syncFeatButtons() { document.querySelectorAll('#feats .feat').forEach(b => b.classList.toggle('on', !!feat[b.dataset.f])); }
    // a key feature shows itself on the drawing: it picks the step (and, if needed, a scenario) that shows it
    // First the feature picks its scenario (only if the one on screen can't show it), step and highlights;
    // the drawing is updated; then the note is written from what is now on screen.
    function tapFeat(id) {
      const on = !feat[id];
      const want = (kind, scen, ok = () => true) => {
        if (S.kind === kind && ok()) return;
        presetEl.value = scen; loadScenario(scen);
        $('scene').classList.toggle('short', S.kind === 'line'); buildCards(); forceInputs();
      };
      const fromX = () => S.forces[0].ref === 'x';
      hl = {};
      if (on) {
        const set = {
          scale: () => { want('single', 'one'); S.step = 2; hl = { rLen: true, rMag: true }; },
          sign: () => { want('line', 'objB'); S.step = 2; hl = { rF1: true, rF2: true }; },
          line: () => { want('line', 'objB'); S.step = 4; hl = { rSum: true }; },
          tail: () => { want('triangle', 'ex5'); S.step = 2; },
          other: () => { want('triangle', 'ex5'); S.step = 4; $('showOther').checked = true; hl = { rSum: true }; },
          notsum: () => { want('triangle', 'ex5'); S.step = 4; hl = { rSum: true }; },
          between: () => { want('triangle', 'ex5'); S.step = 4; hl = { rDir: true }; },
          cos: () => { want('resolve', 'ex7', fromX); S.step = 4; hl = { rFx: true }; },
          sin: () => { want('resolve', 'ex7', fromX); S.step = 4; hl = { rFy: true }; },
          signs: () => { want('resolve', 'e1c'); S.step = 4; hl = { rFx: true, rFy: true }; },
          yaxis: () => { want('resolve', 'e1a', () => !fromX()); S.step = 4; hl = { rFx: true, rFy: true }; },
          table: () => { want('components', 'ex9'); S.step = 2; },
          pyth: () => { want('components', 'ex9'); S.step = 5; hl = { rR: true }; },
          tan: () => { want('components', 'ex9'); S.step = 6; hl = { rDir: true }; }
        };
        set[id]();
      }
      feat = on ? { [id]: true } : {};
      syncFeatButtons(); showOtherBox(); update();
      $('featNote').innerHTML = on ? featNote(id) : '';
    }
    function featNote(id) {
      const R = resultant(), f = S.forces[0], v = vec(f);
      switch (id) {
        case 'scale': return `This arrow is ${f3(f.m / view.npb)} boxes long, and 1 box = ${view.npb} N, so <i>F</i> = ${f3(f.m / view.npb)} × ${view.npb} = ${f3(f.m)} N. The length of the arrow indicates the magnitude of the force (notes p. 3-8).`;
        case 'sign': return 'A force acting to the right or upward is positive; a force acting to the left or downward is negative (notes p. 3-10). The magnitude itself is always positive: the sign only gives the direction.';
        case 'line': { const s = S.forces.map(signed); return `Along one line, add the forces with their signs: Σ<i>F</i> = (${sg(s[0])}) + (${sg(s[1])}) = ${sg(s[0] + s[1])} N. The resultant force has the same effect on the object as all the forces acting together (notes p. 3-7).`; }
        case 'tail': return 'In the vector triangle method, the tail of <i>Q</i> is placed at the tip of <i>P</i> (notes p. 3-24). <i>Q</i> keeps its length and its direction: it has only moved (its old place is the faint dashed arrow).';
        case 'other': return 'The dashed arrows add them the other way round: the tail of <i>P</i> at the tip of <i>Q</i>. They end at the same point, so Σ<i>F</i> is the same (notes p. 3-24).';
        case 'notsum': { const [P, Q] = S.forces;
          if (Math.abs(R.m - (P.m + Q.m)) < 0.05) return `Here <i>P</i> and <i>Q</i> point the same way, so Σ<i>F</i> = <i>P</i> + <i>Q</i> = ${f3(R.m)} N: the only case where the resultant is the algebraic sum. Change the angle from <i>P</i> to <i>Q</i> to see it fall.`;
          return `<i>P</i> + <i>Q</i> = ${f3(P.m + Q.m)} N, but Σ<i>F</i> = ${f3(R.m)} N. The magnitude of the resultant force is not the algebraic sum: it depends on the angle between the forces (notes p. 3-22). Example 2: 50 N and 70 N give at most 120 N (same direction) and at least 20 N (opposite directions).`; }
        case 'between': return 'Σ<i>F</i> points between <i>P</i> and <i>Q</i>, nearer the larger force (notes p. 3-22: the direction of the resultant force is between that of ' + LAB.F1 + ' and ' + LAB.F2 + ').';
        case 'cos': return `With <i>θ</i> measured from the <i>x</i>-axis, ${FX} = <i>F</i> cos <i>θ</i>: here ${compWork(f, 'x')}. The <i>x</i>-component lies along the side next to the angle.`;
        case 'sin': return `With <i>θ</i> measured from the <i>x</i>-axis, ${FY} = <i>F</i> sin <i>θ</i>: here ${compWork(f, 'y')}. The <i>y</i>-component lies along the side opposite the angle.`;
        case 'signs': return `This force points ${clean(v.x) < 0 ? 'left' : 'right'} and ${clean(v.y) < 0 ? 'down' : 'up'}: ${compWork(f, 'x')} and ${compWork(f, 'y')}. Work out each size with cos or sin, then give it the sign from the direction: right and up +, left and down −.`;
        case 'yaxis': return `This angle is measured from the <i>y</i>-axis, so the roles swap: ${compWork(f, 'x')} and ${compWork(f, 'y')}. The component along the side next to the angle uses cos; the one opposite it uses sin.`;
        case 'table': return 'Steps 1 and 2 of the component method: a table with a row for each force, and each force broken into ' + FX + ' and ' + FY + ' with its sign (notes p. 3-32).';
        case 'pyth': return `${RX} and ${RY} are at right angles, so <i>R</i> = √(${RX}² + ${RY}²) = √(${num(R.x)}² + ${num(R.y)}²) = ${f3(R.m)} N (Pythagoras’ theorem, notes p. 3-32).`;
        case 'tan': return `tan <i>θ</i> = ${RY} ÷ ${RX} gives the angle with the horizontal. Use the sizes (${f3(Math.abs(R.y))} ÷ ${f3(Math.abs(R.x))}), then read the direction from the signs: ${RX} ${R.x < 0 ? 'negative, left' : 'positive, right'}; ${RY} ${R.y < 0 ? 'negative, down' : 'positive, up'}. So <i>R</i> points ${dirWords(R.x, R.y)}.`;
      }
      return '';
    }

    function renderPredict(tab) {
      const P = PREDICT[tab], box = $('predictBox');
      predictPick = null;
      if (!P) { box.hidden = true; return; }
      box.hidden = false; box.classList.remove('done');
      $('predictQ').innerHTML = P.q;
      $('predictFb').innerHTML = '';
      const opts = $('predictOpts');
      opts.innerHTML = '';
      P.opts.forEach((o, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.innerHTML = o;
        b.addEventListener('click', () => {
          if (opts.dataset.done) return;
          predictPick = i; opts.querySelectorAll('.opt').forEach((x, j) => x.classList.toggle('picked', j === i));
        });
        opts.appendChild(b);
      });
      delete opts.dataset.done;
      $('predictCheck').textContent = 'Check my answer';
    }
    $('predictCheck').addEventListener('click', () => {
      const P = PREDICT[currentTab], opts = $('predictOpts'), fb = $('predictFb');
      if (!P) return;
      if (opts.dataset.done) { renderPredict(currentTab); return; }
      if (predictPick === null) { fb.innerHTML = '<span class="verdict no">Pick an answer first.</span>'; return; }
      opts.dataset.done = '1';
      const ok = predictPick === P.ans;
      opts.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === P.ans) x.classList.add('right'); else if (j === predictPick) x.classList.add('wrong'); });
      // the options fold away: the result line names the pick (and the right answer), then the explanation
      $('predictBox').classList.add('done');
      fb.innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> Your prediction: ${P.opts[predictPick]}.`
        + (ok ? '' : ` The answer: <b>${P.opts[P.ans]}</b>.`) + ` <span class="why">${P.why}</span>`;
      $('predictCheck').textContent = 'Try again';
    });

    // symbols in a plain label made italic in one pass: Fx, Fy, a single P, Q, R, F, x, y, and θ
    const italic = s => s.replace(/\bF([xy])\b|\b([PQRFxy])\b|θ/g, (m, c, l) => c ? `<i>F</i><sub><i>${c}</i></sub>` : l ? `<i>${l}</i>` : '<i>θ</i>');
    function renderFeats(tab) {
      const list = FEATS[tab] || [], el = $('feats');
      $('featBox').hidden = !list.length;
      el.innerHTML = '';
      list.forEach(([id, label]) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'feat'; b.dataset.f = id;
        b.innerHTML = italic(label);
        b.addEventListener('click', () => tapFeat(id));
        el.appendChild(b);
      });
      $('featNote').textContent = '';
      syncFeatButtons();
    }
    function renderKey(tab) {
      // the label sits in its own span: as direct children of the inline-flex entry, <i> and <sub> would each
      // become a flex item (a gap after Σ, a subscript that does not drop)
      $('ckey').innerHTML = (TABS[tab].key || []).map(([c, label]) => `<span><b style="background:${c}"></b><span>${italic(label).replace(/F([123])/, '<i>F</i><sub>$1</sub>')}</span></span>`).join('');
    }
    function fillPresets(list) {
      presetEl.innerHTML = '';
      [...list, 'custom'].forEach(id => { const o = document.createElement('option'); o.value = id; o.textContent = PRESETS[id].name; presetEl.appendChild(o); });
      presetEl.value = list[0];
    }

    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('#tabs .tab').forEach(b => { const on = +b.dataset.tab === tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
      $('stepLabel').textContent = `Step ${tab} of 5`;
      document.querySelectorAll('#stepBar i').forEach((i, n) => i.classList.toggle('on', n < tab));
      $('strip').innerHTML = TABS[tab].strip;
      renderKey(tab);
      $('pageSim').hidden = tab === 5;
      $('page5').hidden = tab !== 5;
      if (tab <= 4) {
        const T = TABS[tab];
        $('sceneHint').textContent = T.hint;
        $('notes').innerHTML = '<ul>' + T.notes.map(n => `<li>${n}</li>`).join('') + '</ul>';
        fillPresets(T.presets);
        S.kind = null; chooseScenario(T.presets[0]);
      }
      if (tab === 5) renderQuiz();
      renderPredict(tab);
      renderFeats(tab);
      $('tPrompts').innerHTML = PROMPTS[tab].map(p => `<li>${p}</li>`).join('');
    }
    document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => showTab(+b.dataset.tab)));

    /* ---------------- Tab 5: Challenge ---------------- */
    // every answer recomputed and matched to the notes or Tutorial 3's answer key
    // A question whose parts share one situation is one screen: the situation once, then its parts
    const QUIZ = [
      { src: 'Example 1, notes p. 3-11', stem: 'Object B has a 10 N force to the right and a 5 N force to the left. Object C has a 5 N force to the right and a 5 N force to the left.', parts: [
        { q: 'What is the resultant force on object B?', opts: ['15 N to the right', '5 N to the right', '5 N to the left', '0 N'], ans: 1,
          why: 'Right is positive: (+10) + (−5) = +5 N, so 5 N to the right.' },
        { q: 'What is the resultant force on object C?', opts: ['10 N to the right', '5 N to the right', '0 N', '10 N to the left'], ans: 2,
          why: '(+5) + (−5) = 0 N: the two forces are balanced.' }] },
      { src: 'Example 2, notes p. 3-12', stem: 'A 50 N and a 70 N force act on a particle.', parts: [
        { q: 'What is the largest resultant force on the particle?', opts: ['70 N', '86.0 N', '120 N', '3500 N'], ans: 2,
          why: 'Largest when both point the same way: 50 + 70 = 120 N. (86.0 N is the resultant when they are 90° apart.)' },
        { q: 'What is the smallest resultant force on the particle?', opts: ['0 N', '20 N', '50 N', '35 N'], ans: 1,
          why: 'Smallest when they point in opposite directions: 70 − 50 = 20 N, in the direction of the 70 N force.' }] },
      { src: 'Tutorial 3, A1', stem: 'Find the resultant force for each object, with right as positive. Object (a): 30 N and 40 N, both to the right. Object (b): 40 N and 30 N to the left, 50 N to the right.', parts: [
        { lab: '(a)', q: 'The resultant force on object (a):', opts: ['+10 N', '+70 N', '−70 N', '+50 N'], ans: 1, why: '(+30) + (+40) = +70 N.' },
        { lab: '(b)', q: 'The resultant force on object (b):', opts: ['−20 N', '+20 N', '−120 N', '+120 N'], ans: 0, why: '(−40) + (−30) + (+50) = −20 N: 20 N to the left.' }] },
      { src: 'Notes p. 3-21 and 3-22', stem: 'Two forces ' + LAB.F1 + ' and ' + LAB.F2 + ' pull on an object with an angle <i>θ</i> between them.', parts: [
        { q: 'Which way does the resultant force point?', opts: ['Along the larger force', 'Along the smaller force', 'Between the two forces', 'Opposite to the larger force'], ans: 2,

    ];
    const QUIZ_MARKS = QUIZ.reduce((n, Q) => n + Q.parts.length, 0);
    const partLabel = (Q, k) => Q.parts[k].lab ? Q.parts[k].lab + ' ' : Q.parts.length > 1 ? `(${'abcdefgh'[k]}) ` : '';
    let quiz = { i: 0, score: 0, picks: [], done: false, missed: [] };
    function resetQuiz() { quiz = { i: 0, score: 0, picks: [], done: false, missed: [] }; renderQuiz(); }
    function renderQuiz() {
      const el = $('quiz'), N = QUIZ.length;
      if (quiz.i >= N) {
        const list = quiz.missed.length
          ? `<p>Go back over these:</p><ul>${quiz.missed.map(([n, k]) => { const Q = QUIZ[n];
              return `<li>Question ${n + 1}${partLabel(Q, k).trim()} (${Q.src}): ${(Q.stem ? Q.stem + ' ' : '') + Q.parts[k].q}</li>`; }).join('')}</ul>`
          : '<p>Every answer right. Well done.</p>';
        el.innerHTML = `<div class="quiz-top"><span>Summary</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div><div class="quiz-bar"><i style="width:100%"></i></div>
          <div class="quiz-sum"><div class="quiz-q">You scored ${quiz.score} out of ${QUIZ_MARKS}.</div>${list}</div>
          <div class="row-btns"><button type="button" id="qAgain">Try the quiz again</button></div>`;
        $('qAgain').addEventListener('click', resetQuiz);
        return;
      }
      const Q = QUIZ[quiz.i], many = Q.parts.length > 1;
      quiz.picks = Q.parts.map(() => null);
      el.innerHTML = `<div class="quiz-top"><span>Question ${quiz.i + 1} of ${N}</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div>
        <div class="quiz-bar"><i style="width:${(quiz.i / N) * 100}%"></i></div>
        ${Q.stem ? `<div class="quiz-q" id="qStem">${Q.stem}</div>` : ''}<div class="quiz-src">${Q.src}${many ? ` · ${Q.parts.length} parts, answer them all` : ''}</div>
        ${Q.parts.map((P, k) => `<div class="qpart" data-k="${k}">
          <div class="${Q.stem ? 'qpart-q' : 'quiz-q'}">${partLabel(Q, k)}${P.q}</div>
          <div class="opts">${P.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
          <div class="feedback"></div></div>`).join('')}
        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;
          quiz.picks[k] = +b.dataset.j; part.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b));
        }));
      });
      $('qReset').addEventListener('click', resetQuiz);
      $('qSubmit').addEventListener('click', () => {
        const fb = $('qFb');
        if (quiz.done) { quiz.i++; quiz.done = false; renderQuiz(); return; }
        const left = quiz.picks.map((p, k) => p === null ? partLabel(Q, k).trim() || `part ${k + 1}` : null).filter(x => x !== null);
        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }
        quiz.done = true; fb.innerHTML = '';
        el.querySelectorAll('.qpart').forEach(part => {
          const k = +part.dataset.k, P = Q.parts[k], ok = quiz.picks[k] === P.ans;
          if (ok) quiz.score++; else quiz.missed.push([quiz.i, k]);
          part.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === P.ans) x.classList.add('right'); else if (j === quiz.picks[k]) x.classList.add('wrong'); });
          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${P.why}</span>`;
        });
        el.querySelector('.quiz-top span:last-child').textContent = `Score: ${quiz.score} of ${QUIZ_MARKS}`;
        $('qSubmit').textContent = quiz.i + 1 < N ? 'Next question' : 'See the summary';
      });
    }

    /* ---------------- Teacher mode ---------------- */
    // Only the teacher link (this page's address + ?teacher) shows the button; students and the
    // Brightspace embed use the plain address. Not a lock: the panel only changes this screen.
    const teacher = $('teacher');
    if (new URLSearchParams(location.search).has('teacher')) $('teacherBtn').hidden = false;
    $('teacherBtn').addEventListener('click', () => { teacher.hidden = !teacher.hidden; });
    $('tClose').addEventListener('click', () => { teacher.hidden = true; });
    $('tExplain').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-explain');
      e.target.textContent = on ? 'Show explanations' : 'Hide explanations'; e.target.classList.toggle('on', on);
    });
    $('tAnswers').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-answers');
      e.target.textContent = on ? 'Show answer labels' : 'Hide answer labels'; e.target.classList.toggle('on', on);
    });
    // free exploration: every step shown at once, no Predict first
    $('tFree').addEventListener('click', e => {
      freeMode = !freeMode; document.body.classList.toggle('free-mode', freeMode);
      e.target.textContent = freeMode ? 'Back to the guided steps' : 'Switch to free exploration'; e.target.classList.toggle('on', freeMode);
      showTab(currentTab);
    });
    const fullBtn = $('tFull');
    if (!document.fullscreenEnabled) fullBtn.hidden = true;
    fullBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
    $('tReset').addEventListener('click', () => { resetQuiz(); showTab(1); });

    window.addEventListener('resize', () => { if (currentTab <= 4) { view = null; update(); } });
    showTab(1);
  </script>
  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),
    // and a touch the page grabbed for a drag (its own setPointerCapture call) keeps the page still.
    // (hasPointerCapture can't tell: a touch is always captured implicitly.)
    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
