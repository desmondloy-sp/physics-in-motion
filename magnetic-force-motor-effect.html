  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;
    const COL = { wire: '#ea580c', cur: '#9a3412', field: '#16a34a', fieldLine: 'rgba(22,163,74,0.85)', F: '#dc2626', N: '#dc2626', S: '#2563eb', grip: '#7c3aed', skin: '#f2c9a0', iron: '#9ca3af' };
    const DEG = Math.PI / 180;
    const minus = s => String(s).replace(/-/g, '−');

    /* ---------------- numbers ---------------- */
    // sf significant figures; an exact whole number stays whole (3 T, 5 N, 0 N); very small or large values as a × 10^n
    function num(v, sf = 3) {
      if (!isFinite(v)) return '—';
      if (Math.abs(v) < 1e-12) return '0';
      if (Math.abs(v - Math.round(v)) < 1e-9 && Math.abs(v) < 1e4) return minus(String(Math.round(v)));
      const a = Math.abs(v);
      if (a < 1e-2 || a >= 1e4) {
        let e = Math.floor(Math.log10(a) + 1e-12), m = (v / 10 ** e) * (1 + 1e-12);
        let ms = m.toPrecision(sf); if (Math.abs(+ms) >= 10) { e++; ms = (m / 10).toPrecision(sf); }
        return `${minus(ms)} × 10<sup>${minus(e)}</sup>`;
      }

    /* ---------------- the model ----------------
       Every field on this page comes from straight line currents seen end-on (• out of the page, × into it), the field the
       notes draw for a straight wire (pp. 8-14 to 8-16): circles centred on the wire, closer together near it. The coil and
       the solenoid are drawn cut through the middle, so each turn crosses the page twice: once • and once ×.
       Page coordinates: x to the right, y UP the page, z out of the page towards you. */
    function wireField(x, y, wires) {
      let bx = 0, by = 0;
      for (const w of wires) { if (!w.s) continue; const dx = x - w.x, dy = y - w.y, r2 = dx * dx + dy * dy + 1e-6; bx += w.s * (-dy) / r2; by += w.s * dx / r2; }
      return { bx, by };
    }
    // the field lines are the lines along which this stays the same (so equal steps in it between two lines = equal flux)
    function stream(x, y, wires) { let a = 0; for (const w of wires) if (w.s) a -= w.s * Math.log(Math.hypot(x - w.x, y - w.y) + 1e-9); return a; }
    const cross = (a, b) => ({ x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x });
    function dirName(v) {
      const m = Math.max(Math.abs(v.x), Math.abs(v.y), Math.abs(v.z));
      if (m < 1e-9) return 'none';
      if (Math.abs(v.z) === m) return v.z > 0 ? 'out of the page' : 'into the page';
      if (Math.abs(v.x) === m) return v.x > 0 ? 'to the right' : 'to the left';
      return v.y > 0 ? 'up the page' : 'down the page';
    }
    function dirWords(bx, by) {   // a direction on the page (y up) in words
      const a = Math.atan2(by, bx) / DEG, n = ((a % 360) + 360) % 360;
      return ['to the right', 'up and to the right', 'up the page', 'up and to the left', 'to the left', 'down and to the left', 'down the page', 'down and to the right'][Math.round(n / 45) % 8];
    }

    // a straight wire end-on: circles at radii in a fixed ratio, so they are closer together near the wire (p. 8-14)
    const RINGS = [1.6, 2.4, 3.6, 5.4, 8.1, 12.1];
    const CM = 0.5;   // 1 page unit = 0.5 cm
    // the turns of the coil (p. 8-18) and of the solenoids (p. 8-19); front = +1: the current runs UP the front of each turn
    function turnXs(P) { const n = P.turns; return Array.from({ length: n }, (_, i) => (n === 1 ? P.x0 : P.x0 - P.len / 2 + P.len * i / (n - 1))); }
    function wiresOf(id, Pp = P, t = sim.t) {
      switch (id) {
        case 'grip': case 'out': case 'in': return [{ x: 0, y: 0, s: Pp.s }];
        case 'coil': case 'sol': case 'b1': {
          const on = id !== 'b1' || t > 0, out = [];
          // current up the front of a turn: it goes into the page at the top of the turn and comes out at the bottom
          for (const x of turnXs(Pp)) out.push({ x, y: Pp.d, s: on ? -Pp.front : 0 }, { x, y: -Pp.d, s: on ? Pp.front : 0 });
          return out;
        }
      }
      return [];
    }
    // field lines through the inside of a coil or solenoid: seeded at equal steps of `stream` across the middle, traced
    // until each one comes back round to where it started (a closed loop) or leaves the drawing
    function seedYs(wires, n, x, ya, yb) {
      const f = y => stream(x, y, wires), a0 = f(ya), a1 = f(yb), ys = [];
      for (let k = 0; k < n; k++) {
        const tgt = a0 + (a1 - a0) * (k + 0.5) / n; let lo = ya, hi = yb;
        for (let j = 0; j < 60; j++) { const m = (lo + hi) / 2; if ((f(m) - tgt) * (a1 - a0) < 0) lo = m; else hi = m; }
        ys.push((lo + hi) / 2);
      }
      return ys;
    }
    function trace(x, y, wires, wb, h = 0.12, maxN = 5000) {
      const dir = (px, py) => { const b = wireField(px, py, wires), m = Math.hypot(b.bx, b.by) || 1e-12; return { x: b.bx / m, y: b.by / m }; };
      const mg = 2;
      function run(sg) {
        const pts = [{ x, y }]; let px = x, py = y, best = 1e9;
        for (let i = 0; i < maxN; i++) {
          const a = dir(px, py), b = dir(px + sg * a.x * h / 2, py + sg * a.y * h / 2), c = dir(px + sg * b.x * h / 2, py + sg * b.y * h / 2), d = dir(px + sg * c.x * h, py + sg * c.y * h);
          px += sg * h * (a.x + 2 * b.x + 2 * c.x + d.x) / 6; py += sg * h * (a.y + 2 * b.y + 2 * c.y + d.y) / 6;
          pts.push({ x: px, y: py });
          const dd = Math.hypot(px - x, py - y);
          if (i > 30 && dd < 2.5 * h) { if (dd > best) { pts.push({ x, y }); return { pts, closed: true }; } best = dd; }
          if (px < wb.x0 - mg || px > wb.x1 + mg || py < wb.y0 - mg || py > wb.y1 + mg) return { pts, closed: false };
        }
        return { pts, closed: false };
      }
      const f = run(1); if (f.closed) return [{ pts: f.pts, closed: true, fwd: true }];
      const b = run(-1); return [{ pts: f.pts, closed: false, fwd: true }, { pts: b.pts, closed: false, fwd: false }];
    }

    // a needle that turns from one direction to another and settles (Oersted, Tutorial B1): an underdamped swing, and exactly

    const SW = 2 * Math.PI / 1.4, SC = 1.7;

    const oerTarget = () => -P.s * P.deflect;
    function oerAngle(t) { const T = runEnd(); return t >= T - 1e-9 ? oerTarget() : settle(0, oerTarget(), t); }

    function b1Target() { const b = wireField(P.compass[0], P.compass[1], wiresOf('b1', P, 1)); return Math.atan2(b.by, b.bx) / DEG; }
    function b1Angle(t) { let tg = b1Target(); while (tg - P.needle0 > 180) tg -= 360; while (tg - P.needle0 < -180) tg += 360; return t >= runEnd() - 1e-9 ? tg : settle(P.needle0, tg, t); }

    function richText(ctx, s, x, y, measureOnly) {

      for (let d = 0; d <= 180; d += 2) { const x = gx0 + (gx1 - gx0) * d / 180, y = gy0 - (gy0 - gy1) * Math.sin(d * DEG); d ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();

    // a given value as the question writes it (B3: 0.390 T, 5.00 A, 2.80 m); your own values to 2 decimal places
    const gv = k => (S.scen === 'b3' ? { B: '0.390', I: '5.00', L: '2.80' }[k] : P[k].toFixed(2));

    // tab 4: Tutorial C1, a wire holding up a 500 g mass
    function drawC1(ctx, box, opt) {

      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx(-2), sy(T), 3, 0, Math.PI * 2); ctx.arc(sx(0.2), sy(T), 3, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(sx(-2), sy(T)); ctx.lineTo(sx(0.2), sy(T)); ctx.stroke();

    // tab 4: Tutorial C2, a rectangle of wire in a field pointing up the page
    function drawC2(ctx, box, opt) {

    /* ---------------- dragging ---------------- */
    let drag = null;
    function pos(e) { const r = canvas.getBoundingClientRect(); return { px: e.clientX - r.left, py: e.clientY - r.top }; }
    function pick(p) {
      const id = S.scen;
      if (compass && ['out', 'in', 'coil', 'sol'].includes(id)) { const w = toWorldPt(p.px, p.py); if (Math.hypot(w.x - compass.x, w.y - compass.y) < Math.max(1.6, 20 / VIEW.k)) return 'compass'; }
      if (probe && id === 'plane') { const w = toWorldPt(p.px, p.py); if (Math.hypot(w.x - probe.x, w.y - probe.y) < Math.max(1.6, 20 / VIEW.k)) return 'probe'; }
      if ((id === 'b3' || id === 'own') && geomTurn) { const g = geomTurn; if (Math.hypot(p.px - g.p2.x, p.py - g.p2.y) < 26 || Math.hypot(p.px - g.p1.x, p.py - g.p1.y) < 26) return 'wire'; }
      return null;
    }
    canvas.addEventListener('pointerdown', e => {
      const p = pos(e), id = S.scen;
      if (id === 'ex2') { const r = canvas.getBoundingClientRect(), cx = r.width / 2, cy = r.height / 2; if (Math.hypot(p.px - cx, p.py - cy) < 30) { P.s = -P.s; clearFeatNoteOnly(); update(); } return; }

    });

        a = Math.round(a); if (a < 0) a += 180; if (a > 180) a -= 180;   // a wire is a line: 0° to 180°

      }

      else { if (Math.abs(q.x) < 0.9) q.x = q.x < 0 ? -0.9 : 0.9; probe.x = q.x; probe.y = q.y; }

    });
    const endDrag = () => { drag = null; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---------------- experimental controls ---------------- */
    function buildInputs() {

    /* ---------------- readouts ---------------- */
    function card(t, v, key) { return `<div class="readout-card${hl[key] ? ' hl' : ''}"><div class="title">${t}</div><div class="value">${v}</div></div>`; }

      const stepsList = (all) => `<ol class="steps-list">${steps().map((s, i) => `<li class="${i < S.step ? 'lit' : ''}">${i < S.step ? s.h : '…'}</li>`).join('')}</ol>`;
      if (id === 'oer') {
        const on = sim.t > 0, a = oerAngle(sim.t), end = sim.t >= runEnd() - 1e-9;
        out.push(card('Current in the wire', on ? `flowing ${P.s > 0 ? 'north' : 'south'}` : 'none (switch open)', 'cur'), card('Compass needle (N end)', `points ${oerWords(a)}`, 'ndl'), card('Time', `${sim.t.toFixed(2)} s`, 't'));
        words = !on ? 'Press Start to close the switch: a current flows in the wire above the compass.' : end ? `The needle has come to rest ${oerWords(a)}: the current in the wire deflected it. Reverse the current and it turns the other way.` : 'The needle swings round …';
      } else if (id === 'grip') {

        out.push(card('Current (the thumb)', q(S.step >= 2, o ? 'out of the page' : 'into the page'), 'cur'), card('Field (the curled fingers)', q(S.step >= 3, o ? 'anticlockwise' : 'clockwise'), 'fld'), card('Field lines', q(S.step >= 4, 'circles centred on the wire'), 'lines'));
        work = stepsList();
      } else if (id === 'out' || id === 'in') {
        const b = wireField(compass.x, compass.y, wiresOf(id)), r = Math.hypot(compass.x, compass.y) * CM;

        words = `Thumb ${P.s > 0 ? 'out of' : 'into'} the page, fingers curl ${P.s > 0 ? 'anticlockwise' : 'clockwise'}. Drag the compass round the wire: its needle always lies along the circle through it.`;
      } else if (id === 'plane') {

        words = s ? `On the right of the wire the field points ${s > 0 ? 'into' : 'out of'} the page, on the left ${s > 0 ? 'out of' : 'into'} it: the circles of field pass through the page at the two sides of the wire.` : 'With no current there is no magnetic field.';
      } else if (id === 'coil' || id === 'sol' || id === 'b1') {

          words = id === 'coil' ? 'Every field line through the middle of the coil runs round outside it from one face to the other, like a short bar magnet.' : 'Inside, the lines are straight, parallel and close together: a strong, uniform field. Outside, the lines are like those of a bar magnet.';

        work = stepsList();

        out.push(card('Current <i>I</i>', on ? (P.s > 0 ? 'up' : 'down') : '0', 'cur'), card('Force on the wire', on ? dirName(Fv) : 'none', 'f'), card('Wire', !on ? 'straight' : `bent ${dirName(Fv)}`, 'w'));
        words = !on ? 'With no current, there is no force: the wire hangs straight. Press Start to switch the current on.' : sim.t >= 1.2 ? `Fleming’s left-hand rule: First finger into the page, seCond finger ${P.s > 0 ? 'up' : 'down'}, so the thuMb points ${dirName(Fv).replace('to the ', '')}: the wire bends ${dirName(Fv)}.` : '';
      } else if (id === 'ex2') {
        const Fv = cross({ x: 0, y: 0, z: P.s }, { x: P.fieldRight, y: 0, z: 0 });
        out.push(card('Field', P.fieldRight > 0 ? 'to the right' : 'to the left', 'b'), card('Current', P.s > 0 ? 'out of the page' : 'into the page', 'cur'), card('Force on the wire', show.force ? dirName(Fv) : 'hidden: predict it', 'f'));
        words = show.force ? `First finger ${P.fieldRight > 0 ? 'to the right' : 'to the left'}, seCond finger ${P.s > 0 ? 'out of' : 'into'} the page: the thuMb points ${dirName(Fv).replace('the page', 'the page')}.` : 'Use Fleming’s left-hand rule, then tick Show the force to check.';

    // the options are written with the right one first; turn each part's list round by a fixed amount

    // a quiz figure, drawn by the same code as the simulation, in the state the question describes (no answers on it)
    function drawFig(cv, id) {
      for (const k in __pim) __pim[k] = [];

      const keep = { P, S: { ...S }, show, sim: { ...sim }, compass, probe };
      P = JSON.parse(JSON.stringify(PRESETS[id])); P.id = id; S.scen = id; S.step = 0; sim.t = 0; sim.running = false;
      show = { lines: true, force: false, reveal: false, compasses: false }; compass = null; probe = null;

      }
      const Q = QUIZ[quiz.i], many = Q.parts.length > 1;
      quiz.picks = Q.parts.map(() => null);
      el.innerHTML = `<div class="quiz-top"><span>Question ${quiz.i + 1} of ${N}</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div>
        <div class="quiz-bar"><i style="width:${(quiz.i / N) * 100}%"></i></div>
        ${Q.stem ? `<div class="quiz-q" id="qStem">${Q.stem}</div>` : ''}${Q.fig ? '<canvas class="qfig" id="qFig"></canvas>' : ''}<div class="quiz-src">${Q.src}${many ? ` · ${Q.parts.length} parts, answer them all` : ''}</div>

        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      if (Q.fig) drawFig($('qFig'), Q.fig);
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;

      $('qSubmit').addEventListener('click', () => {

        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }

  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),
    // and a touch the page grabbed for a drag (its own setPointerCapture call) keeps the page still.
    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
