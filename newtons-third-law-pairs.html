  <aside class="teacher" id="teacher" hidden aria-label="Teacher mode">
    <h2>Teacher mode</h2>

  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const G = 10; // g = 10 m s^-2, as the notes and Tutorial 3 take it
    const clean = v => (Math.abs(v) < 1e-9 ? 0 : v);
    // 3 significant figures, as the lecturer's copy gives them (6.67 m s^-2); exact whole numbers stay whole (20 N);
    // an exact value keeps its own figures (0.8, 2.4); a 1e-12 nudge so a binary half rounds up; a true minus sign
    const f3 = v => {
      const x = clean(v);
      if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x)).replace('-', '−');
      const t = (x * (1 + 1e-12)).toPrecision(3);
      if (Math.abs(+t - x) < 1e-9 || Math.abs(x) >= 100) return String(+t).replace('-', '−');
      return t.replace('-', '−');
    };
    const plain = v => String(+(+v).toFixed(2)).replace('-', '−'); // a typed value as typed: 1.5, 30
    const tx = t => (Math.round(t * 100) / 100).toFixed(2);      // a time on the clock: 0.40 s
    const kg = m => (m < 100 && Math.abs(m * 10 - Math.round(m * 10)) < 1e-9 ? m.toFixed(1) : plain(m)); // B7 writes 3.0 kg
    const MS2 = 'm s<sup>−2</sup>', MS1 = 'm s<sup>−1</sup>';
    const COL = { act: '#dc2626', re: '#2563eb', N: '#16a34a', W: '#ea580c', P: '#dc2626', AB: '#7c3aed', BA: '#ea580c', a: '#0891b2', v: '#15803d', f1: '#dc2626', f2: '#2563eb' };
    const FADE = '#94a3b8';

    /* ---------------- scenarios (every number from the notes, the lecturer's copy or Tutorial 3) ---------------- */
    const PRESETS = {
      // tab 1: the two examples on notes p. 3-43, then Exercise 4 (p. 3-44)
      wall: { tab: 1, name: 'Man pushes a wall', kind: 'wall', F: 100,
        q: 'Notes p. 3-43: Man pushes Wall (Action). Which force is the reaction, and which object does it act on? (The 100 N push is a value for this page; the notes give no number.)' },
      rocket: { tab: 1, name: 'Rocket and its exhaust gases', kind: 'rocket',
        q: 'Notes p. 3-43: Rocket produces downward forces on exhaust gases (Action). Which force is the reaction, and which way does it point?' },
      puck: { tab: 1, name: 'Puck at rest on the ice', kind: 'puck',
        q: 'Exercise 4 (notes p. 3-44): Consider a puck that is at rest on a horizontal icy surface as shown below. The two forces acting on the puck are the upward normal force by the ice on the puck, and the downward weight which is the attraction force by Earth on the puck. Are these two forces an action-reaction pair? Explain.' },

      // tab 2: two blocks pushed together. front = the block that is pushed by the other one
      b7: { tab: 2, name: '30 N push on A, B in front', P: 30, mA: 1.5, mB: 3, front: 'B',
        q: 'Tutorial 3, B7: Two masses A and B are accelerated together along a frictionless horizontal surface by a 30 N force as shown. The mass of A is 1.5 kg and the mass of B is 3.0 kg. (a) Draw the free-body diagram of each mass. (b) What is the acceleration of the two masses? (c) What is the magnitude of the force exerted by B on A?' },
      swap: { tab: 2, name: 'The same blocks, pushed on B', P: 30, mA: 1.5, mB: 3, front: 'A',
        q: 'The masses of Tutorial 3 B7 again, but now the 30 N force pushes B, and B pushes A. Is the force between the blocks still 20 N?' },

      // tab 3: two skaters push apart for 0.4 s (values chosen for this page: the notes have no skater example)
      s6040: { tab: 3, name: '60 kg and 40 kg', mA: 60, mB: 40, F: 120,
        q: 'Skaters A (60 kg) and B (40 kg) stand on frictionless ice and push each other apart with a force of 120 N for 0.4 s. (These values are chosen for this page; the notes have no skater example.) Press Start.' },
      s5050: { tab: 3, name: 'Equal masses, 50 kg each', mA: 50, mB: 50, F: 120,
        q: 'Two skaters of the same mass, 50 kg each, push each other apart with a force of 120 N for 0.4 s. Predict their speeds, then press Start.' },
      s8020: { tab: 3, name: '80 kg and 20 kg', mA: 80, mB: 20, F: 120,
        q: 'An 80 kg skater A and a 20 kg skater B push each other apart with a force of 120 N for 0.4 s. Who ends up faster, and how many times faster?' }
    };
    const CUSTOM_NAME = { 2: 'Your own blocks', 3: 'Your own skaters' };

    /* ---------------- the state ---------------- */
    let S = { scen: 'wall', base: 'wall', step: 1, custom: false };
    let P1 = {}, P2 = {}, P3 = {};
    const sim = { t: 0, running: false, last: null };
    const STEPS = { 1: 4, 2: 5 };
    let hl = {}, feat = {}, sel = null;

    function loadScenario(id) {
      const P = PRESETS[id];
      S.scen = id; S.custom = id === 'custom';
      if (!S.custom) {
        S.base = id;
        if (P.tab === 1) P1 = { kind: P.kind, F: P.F || 0 };
        if (P.tab === 2) P2 = { P: P.P, mA: P.mA, mB: P.mB, front: P.front };
        if (P.tab === 3) P3 = { mA: P.mA, mB: P.mB, F: P.F };
        $('question').innerHTML = P.q;
      } else $('question').innerHTML = 'Your own values. Choose a scenario from the menu to go back to the example.';
      S.step = freeMode ? (STEPS[currentTab] || 1) : 1;
      sel = null;
      sim.t = 0; sim.running = false; sim.last = null;
    }

    /* ---------------- tab 2: two blocks pushed together ---------------- */
    // the pushed block gets P; it pushes the front block, which pushes back (the action-reaction pair)
    function solve2() {
      const { P, mA, mB, front } = P2, M = mA + mB, a = P / M;
      const pushed = front === 'B' ? 'A' : 'B', mP = pushed === 'A' ? mA : mB, mF = front === 'A' ? mA : mB;
      return { a, C: mF * a, pushed, front, mP, mF, M };
    }
    const T2END = 2;

    /* ---------------- tab 3: two skaters ---------------- */
    const TP = 0.4, T3END = 3, X0 = 0.25; // they push for 0.4 s; each starts 0.25 m from the middle
    function skaters(t) {
      const { mA, mB, F } = P3, aA = F / mA, aB = F / mB, tc = Math.min(t, TP);
      const vA = aA * tc, vB = aB * tc;
      const xA = X0 + 0.5 * aA * tc * tc + aA * TP * Math.max(0, t - TP), xB = X0 + 0.5 * aB * tc * tc + aB * TP * Math.max(0, t - TP);
      // the force acts only while the hands touch (0 < t < 0.4 s); A moves left, B moves right
      return { aA, aB, vA: -vA, vB, xA: -xA, xB, touching: t > 1e-9 && t < TP - 1e-9 };
    }

    /* ---------------- the clock (tabs 2 and 3) ---------------- */
    function runEnd() { return currentTab === 2 ? T2END : currentTab === 3 ? T3END : 0; }
    function frame(ts) {
      if (!sim.running) return;
      if (sim.last === null) sim.last = ts;
      // a first rAF timestamp can be earlier than the one stored: never step backwards
      const dt = Math.max(0, Math.min(0.05, (ts - sim.last) / 1000)); sim.last = ts;
      const end = runEnd();
      sim.t = Math.min(end, sim.t + dt);
      if (sim.t >= end - 1e-9) { sim.t = end; sim.running = false; }
      update();
      if (sim.running) requestAnimationFrame(frame);
    }
    function start() {
      if (sim.t >= runEnd() - 1e-9) sim.t = 0;
      sim.running = true; sim.last = null; update(); requestAnimationFrame(frame);
    }
    function setTime(t) { sim.running = false; sim.last = null; sim.t = Math.max(0, Math.min(runEnd(), t)); update(); }
    function resetRun() { sim.running = false; sim.last = null; sim.t = 0; update(); }
    function keyMoments() {
      const m = currentTab === 2 ? [0, 0.5, 1, 1.5, 2] : currentTab === 3 ? [0, 0.2, TP, 1, 2, 3] : [0];
      return m.filter(x => x <= runEnd() + 1e-9);
    }
    $('startBtn').addEventListener('click', start);
    $('pauseBtn').addEventListener('click', () => {
      if (sim.running) { sim.running = false; sim.last = null; update(); }
      else if (sim.t > 0 && sim.t < runEnd()) start();
    });
    $('resetBtn').addEventListener('click', resetRun);
    $('nextMoment').addEventListener('click', () => { const n = keyMoments().find(m => m > sim.t + 1e-6); if (n !== undefined) setTime(n); });
    $('prevMoment').addEventListener('click', () => { const p = keyMoments().filter(m => m < sim.t - 1e-6).pop(); if (p !== undefined) setTime(p); });

    /* ---------------- drawing helpers ---------------- */
    // what the canvas drew, for the checks: every label's box and every arrow, with the pane they belong to
    window.__pim = { labels: [], arrows: [], panes: [], lit: [], hits: [] };
    function setup(cv) {
      const r = cv.getBoundingClientRect();
      if (r.width < 20 || r.height < 20) return null; // hidden: never draw at no size
      const dpr = window.devicePixelRatio || 1, cw = Math.round(r.width * dpr), ch = Math.round(r.height * dpr);
      if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
      const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, r.width, r.height);
      return { ctx, W: r.width, H: r.height };
    }
    // Canvas text with <i>, <sub> and <sup> runs, so symbols of physical quantities are italic, as in the notes.
    // Honours ctx.textAlign; returns the width. measureOnly = true draws nothing.
    function richText(ctx, s, x, y, measureOnly) {
      const base = ctx.font, m = base.match(/([\d.]+)px/), size = m ? +m[1] : 12;
      const runs = []; let it = false, sub = 0;
      for (const tok of String(s).split(/(<\/?(?:i|sub|sup)>)/)) {
        if (tok === '<i>') it = true; else if (tok === '</i>') it = false;
        else if (tok === '<sub>') sub = 1; else if (tok === '<sup>') sub = -1;
        else if (tok === '</sub>' || tok === '</sup>') sub = 0;
        else if (tok) {
          let f = sub ? base.replace(/[\d.]+px/, (size * 0.75).toFixed(1) + 'px') : base;
          if (it) f = 'italic ' + f;
          ctx.font = f; runs.push({ t: tok, f, sub, w: ctx.measureText(tok).width });
        }
      }
      ctx.font = base;
      const w = runs.reduce((a, r) => a + r.w, 0);
      if (measureOnly) return w;
      const align = ctx.textAlign;
      let cx = align === 'center' ? x - w / 2 : (align === 'right' || align === 'end') ? x - w : x;
      ctx.textAlign = 'left';
      for (const r of runs) { ctx.font = r.f; ctx.fillText(r.t, cx, y + (r.sub === 1 ? size * 0.3 : r.sub === -1 ? -size * 0.4 : 0)); cx += r.w; }
      ctx.textAlign = align; ctx.font = base;
      return w;
    }
    let PANE = '', CW = 1e9; // the pane name for the checks; the canvas width a label must stay inside
    function arrow(ctx, x1, y1, x2, y2, color, lw = 3.5, head = 11, dash = null) {
      const len = Math.hypot(x2 - x1, y2 - y1); if (len < 1.5) return;
      __pim.arrows.push({ pane: PANE, x1, y1, x2, y2 });
      const a = Math.atan2(y2 - y1, x2 - x1), hd = Math.min(head, len * 0.6);
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hd * 0.8, y2 - Math.sin(a) * hd * 0.8); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - hd * Math.cos(a - 0.45), y2 - hd * Math.sin(a - 0.45)); ctx.lineTo(x2 - hd * Math.cos(a + 0.45), y2 - hd * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
    }
    // a label on a white card; align 'left' | 'center' | 'right'; returns its box
    function label(ctx, html, x, y, color, align = 'center', size = 12) {
      ctx.font = `bold ${size}px Arial`; ctx.textAlign = align; ctx.textBaseline = 'middle';
      const w = richText(ctx, html, 0, 0, true);
      // never off the canvas: a label near an edge slides back inside it
      const x0 = Math.max(4, Math.min(CW - w - 4, align === 'center' ? x - w / 2 : align === 'right' ? x - w : x));
      const box = { pane: PANE, text: html.replace(/<[^>]+>/g, ''), x: x0 - 3, y: y - size * 0.8, w: w + 6, h: size * 1.6 };
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.fillStyle = color; ctx.textAlign = 'left'; richText(ctx, html, x0, y); ctx.textBaseline = 'alphabetic';
      __pim.labels.push(box);
      return box;
    }
    function dot(ctx, x, y, r = 5, color = '#0f172a') { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    function floorLine(ctx, x0, x1, y) {
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
      for (let x = x0 + 4; x < x1; x += 12) { ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x - 7, y + 10); ctx.stroke(); }
    }
    // a force: an arrow from a to b, and its label lines (each a separate card, one under the other)
    function drawForce(ctx, id, f, color, opts = {}) {
      ctx.globalAlpha = opts.alpha === undefined ? 1 : opts.alpha;
      arrow(ctx, f.a[0], f.a[1], f.b[0], f.b[1], color, opts.lw || 3.5, 11, opts.dash || null);
      const size = f.size || 12;
      // one card per line, each 1.6 × the font tall: lines 1.6 × size + 1 apart never overlap
      (opts.lines || f.lines).forEach((t, i) => label(ctx, t, f.lx, f.ly + i * (size * 1.6 + 1), color, f.align, size));
      ctx.globalAlpha = 1;
      __pim.hits.push({ id, a: f.a, b: f.b });
    }
    // the shortest distance from a point to an arrow, for taps
    function distTo(p, a, b) {
      const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1;
      const u = Math.max(0, Math.min(1, ((p.x - a[0]) * dx + (p.y - a[1]) * dy) / L2));
      return Math.hypot(p.x - (a[0] + u * dx), p.y - (a[1] + u * dy));
    }

    /* ---------------- the scenes (each returns its forces, with where they are drawn) ---------------- */
    // pair: the partner of each force; on: the object it acts on; kind: contact or gravitational (notes p. 3-3)
    const FORCES = {
      wall: { act: { name: 'Man pushes wall', on: 'the wall', kind: 'contact', pair: 're' }, re: { name: 'Wall pushes man', on: 'the man', kind: 'contact', pair: 'act' } },
      rocket: { act: { name: 'Rocket pushes exhaust gases down', on: 'the exhaust gases', kind: 'contact', pair: 're' }, re: { name: 'Exhaust gases push rocket up', on: 'the rocket', kind: 'contact', pair: 'act' } },
      puck: { N: { name: 'Ice pushes puck up (<i>N</i>)', on: 'the puck', kind: 'contact', pair: 'N2' }, W: { name: 'Earth pulls puck down (<i>W</i>)', on: 'the puck', kind: 'gravitational', pair: 'W2' },
        N2: { name: 'Puck pushes ice down', on: 'the ice', kind: 'contact', pair: 'N' }, W2: { name: 'Puck pulls Earth up', on: 'the Earth', kind: 'gravitational', pair: 'W' } }
    };
    const PUSH_MAX = 300; // the man's push, N
    function wallK(W) { return (W < 560 ? W * 0.3 : Math.min(200, W * 0.25)) / PUSH_MAX; }
    function sceneWall(ctx, W, H, F, show = {}) {
      const narrow = W < 560, s = narrow ? 1 : 1.25, gy = H - 50;
      const wx = narrow ? W * 0.5 : W * 0.55, ww = narrow ? 30 : 50, top = 26;
      floorLine(ctx, 10, W - 10, gy);
      // the wall: bricks
      ctx.fillStyle = '#e7e5e4'; ctx.fillRect(wx, top, ww, gy - top);
      ctx.strokeStyle = '#a8a29e'; ctx.lineWidth = 1;
      for (let y = top, row = 0; y < gy; y += 16, row++) {
        ctx.beginPath(); ctx.moveTo(wx, y); ctx.lineTo(wx + ww, y); ctx.stroke();
        for (let x = wx + (row % 2 ? ww / 2 : 0); x < wx + ww; x += ww) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, Math.min(gy, y + 16)); ctx.stroke(); }
      }
      ctx.strokeStyle = '#78716c'; ctx.lineWidth = 1.5; ctx.strokeRect(wx, top, ww, gy - top);
      // the man, leaning in with straight arms, hands flat on the wall
      const hy = gy - 112 * s;
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
      const hip = [wx - 82 * s, gy - 60 * s], sh = [wx - 40 * s, hy];
      ctx.beginPath(); ctx.moveTo(wx - 126 * s, gy - 2); ctx.lineTo(hip[0], hip[1]); ctx.lineTo(wx - 64 * s, gy - 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(sh[0], sh[1]); ctx.stroke();
      ctx.lineWidth = 5 * s; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(wx - 3, hy); ctx.stroke();
      ctx.lineCap = 'butt';
      dot(ctx, wx - 36 * s, hy - 22 * s, 13 * s, '#334155');
      label(ctx, 'Man', wx - 95 * s, gy + 20, '#334155', 'center', 12);
      label(ctx, 'Wall', wx + ww / 2, gy + 20, '#57534e', 'center', 12);
      // both forces start where the hands touch the wall: the action on the wall, the reaction on the man
      const k = wallK(W), L = 16 + F * k, sz = narrow ? 11 : 12;
      const v = show.vals ? ` = ${f3(F)} N` : '';
      return {
        act: { a: [wx, hy - 10], b: [wx + L, hy - 10], lines: [`Man pushes wall${v}`, '(action, on the wall)'], lx: wx + 6, ly: hy - 82, align: 'left', size: sz },
        re: { a: [wx, hy + 10], b: [wx - L, hy + 10], lines: [`Wall pushes man${v}`, '(reaction, on the man)'], lx: wx - 8, ly: hy - 82, align: 'right', size: sz },
        handle: { x: wx + L, y: hy - 10, wx, k }
      };
    }
    function sceneRocket(ctx, W, H) {
      const narrow = W < 560, cx = narrow ? W * 0.27 : W * 0.38, yN = H * 0.52, top = 24, bw = 36;
      // exhaust gases under the nozzle
      ctx.fillStyle = '#e2e8f0';
      [[0, 26, 18], [-16, 44, 16], [16, 46, 16], [-6, 66, 20], [14, 72, 15], [-22, 82, 14], [4, 92, 18], [24, 98, 13], [-14, 106, 16]].forEach(([dx, dy, r]) => {
        if (yN + dy + r < H - 4) { ctx.beginPath(); ctx.arc(cx + dx, yN + dy, r, 0, Math.PI * 2); ctx.fill(); }
      });
      // the rocket: nose, body, fins, nozzle
      ctx.fillStyle = '#fde68a'; ctx.strokeStyle = '#b45309'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, top); ctx.quadraticCurveTo(cx + bw / 2 + 4, top + 34, cx + bw / 2, top + 50); ctx.lineTo(cx - bw / 2, top + 50); ctx.quadraticCurveTo(cx - bw / 2 - 4, top + 34, cx, top); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillRect(cx - bw / 2, top + 50, bw, yN - top - 62); ctx.strokeRect(cx - bw / 2, top + 50, bw, yN - top - 62);
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath(); ctx.moveTo(cx - bw / 2, yN - 46); ctx.lineTo(cx - bw / 2 - 16, yN - 8); ctx.lineTo(cx - bw / 2, yN - 14); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + bw / 2, yN - 46); ctx.lineTo(cx + bw / 2 + 16, yN - 8); ctx.lineTo(cx + bw / 2, yN - 14); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(cx - 10, yN - 12); ctx.lineTo(cx + 10, yN - 12); ctx.lineTo(cx + 14, yN); ctx.lineTo(cx - 14, yN); ctx.closePath(); ctx.fill();
      label(ctx, 'Rocket', cx - bw / 2 - 22, top + 70, '#92400e', 'right', 12);
      label(ctx, 'Exhaust gases', cx - 30, yN + 104, '#475569', 'right', 12);
      const sz = narrow ? 11 : 12;
      return {
        re: { a: [cx, yN - 2], b: [cx, yN - 74], lines: ['Exhaust gases push rocket up', '(reaction, on the rocket)'], lx: cx + 28, ly: yN - 58, align: 'left', size: sz },
        act: { a: [cx, yN + 2], b: [cx, yN + 74], lines: ['Rocket pushes exhaust gases down', '(action, on the gases)'], lx: cx + 34, ly: yN + 40, align: 'left', size: sz }
      };
    }
    function scenePuck(ctx, W, H) {
      // the wide layout puts "puck pulls Earth up" right of the W label: it needs about 760 px
      const narrow = W < 760, iceY = H * 0.55, cx = W / 2;
      ctx.fillStyle = '#bae6fd'; ctx.fillRect(0, iceY, W, 40);
      ctx.fillStyle = '#a3e635'; ctx.fillRect(0, H - 26, W, 26);
      label(ctx, 'Ice', narrow ? W - 22 : 26, iceY + 22, '#0c4a6e', 'center', 12);
      label(ctx, 'The Earth (below)', narrow ? W - 64 : 70, H - 13, '#365314', 'center', 11);
      ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.ellipse(cx, iceY - 10, 40, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(cx - 40, iceY - 21, 80, 11);
      ctx.beginPath(); ctx.ellipse(cx, iceY - 21, 40, 11, 0, 0, Math.PI * 2); ctx.fillStyle = '#374151'; ctx.fill();
      label(ctx, 'Puck', cx, iceY - 44, '#111827', 'center', 12);
      // on a phone the four arrows spread across the width and each label takes two short lines
      const xN = narrow ? W * 0.31 : cx - 70, xW = narrow ? W * 0.69 : cx + 70, xN2 = narrow ? W * 0.10 : cx - 150, xW2 = narrow ? W * 0.90 : cx + 260;
      const sz = narrow ? 11 : 12;
      return {
        N: { a: [xN, iceY - 16], b: [xN, iceY - 96], lines: narrow ? ['<i>N</i>: ice pushes', 'puck up'] : ['<i>N</i>: ice pushes puck up'], lx: xN - 10, ly: iceY - (narrow ? 70 : 62), align: 'right', size: sz },
        W: { a: [xW, iceY - 16], b: [xW, iceY + 64], lines: narrow ? ['<i>W</i>: Earth pulls', 'puck down'] : ['<i>W</i>: Earth pulls puck down'], lx: xW + 10, ly: iceY + (narrow ? 50 : 52), align: 'left', size: sz },
        N2: { a: [xN2, iceY + 2], b: [xN2, iceY + 72], lines: narrow ? ['puck pushes', 'ice down'] : ['puck pushes ice down'], lx: narrow ? xN2 + 10 : xN2 - 10, ly: iceY + (narrow ? 50 : 56), align: narrow ? 'left' : 'right', size: sz },
        W2: { a: [xW2, H - 26], b: [xW2, H - 106], lines: narrow ? ['puck pulls', 'Earth up'] : ['puck pulls Earth up'], lx: narrow ? xW2 - 10 : xW2 + 10, ly: H - (narrow ? 70 : 66), align: narrow ? 'right' : 'left', size: sz }

    }
    // two blocks on a frictionless floor (tab 2, and two cards on tab 4). d / dmax: how far along the run they are
    const P2MAX = 60;
    function blocksK(W) { return (W < 560 ? 70 : Math.min(130, W * 0.14)) / P2MAX; }
    function sceneBlocks(ctx, W, H, Q, d, dmax, vals) {
      const narrow = W < 560, gy = H - 70, bh = 56, sz = narrow ? 11 : 12;
      const pushed = Q.front === 'B' ? 'A' : 'B', front = Q.front;
      const mOf = n => (n === 'A' ? Q.mA : Q.mB);
      const wOf = m => (narrow ? 38 : 50) + Math.min(60, m * (narrow ? 6 : 9));
      const wP = wOf(mOf(pushed)), wF = wOf(mOf(front)), k = blocksK(W);
      const startC = 16 + 12 + P2MAX * k + wP + 4, endC = Math.max(startC, W - 16 - wF);

      label(ctx, 'Frictionless surface', 14, gy + 18, '#64748b', 'left', 11);
      label(ctx, 'W and N cancel on each block (not drawn)', 14, gy + 38, '#64748b', 'left', 11);

        roundRect(ctx, x, gy - bh, w, bh, 5, fill, '#1e293b');
        ctx.fillStyle = '#0f172a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'bold 15px Arial'; ctx.fillText(name, x + w / 2, gy - bh / 2 - 9);
        ctx.font = '12px Arial'; ctx.fillText(`${kg(m)} kg`, x + w / 2, gy - bh / 2 + 10); ctx.textBaseline = 'alphabetic';
      };
      box(cX - wP, wP, pushed, mOf(pushed), pushed === 'A' ? '#bfdbfe' : '#bbf7d0');
      box(cX, wF, front, mOf(front), front === 'A' ? '#bfdbfe' : '#bbf7d0');
      // the contact force, to the same scale as the push P
      const sol = { a: Q.P / (Q.mA + Q.mB) }; sol.C = mOf(front) * sol.a;
      const Lp = 12 + Q.P * k, Lc = 12 + sol.C * k, cy = gy - bh / 2, yF = gy - bh - 18, yB = gy - bh - 56;
      const nm = (by, on) => `<i>F</i><sub>${by} on ${on}</sub>`;
      const vOn = (v, x) => (v ? ` = ${f3(x)} N` : ' = ?');
      ctx.strokeStyle = 'rgba(15,23,42,0.35)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cX, yB - 6); ctx.lineTo(cX, gy - bh); ctx.stroke(); ctx.setLineDash([]);
      return {
        P: { a: [cX - wP - 6 - Lp, cy], b: [cX - wP - 4, cy], lines: [`<i>P</i> = ${f3(Q.P)} N`], lx: cX - wP - 5 - Lp / 2, ly: cy - 18, align: 'center', size: sz },
        // the front block is pushed forwards by the pushed block; the pushed block is pushed back by the front one
        onFront: { a: [cX, yF], b: [cX + Lc, yF], lines: [nm(pushed, front) + vOn(vals.onFront, sol.C)], lx: cX + 4, ly: yF - 15, align: 'left', size: sz },
        onPushed: { a: [cX, yB], b: [cX - Lc, yB], lines: [nm(front, pushed) + vOn(vals.onPushed, sol.C)], lx: cX - 4, ly: yB - 15, align: 'right', size: sz },
        handle: { x: cX - wP - 6 - Lp, y: cy, xEnd: cX - wP - 6, k },
        cX, gy, bh

    }
    // Tutorial 3 B5: a 20 kg object hung from the ceiling by a light string
    function sceneHang(ctx, W, H) {
      const narrow = W < 560, cx = narrow ? W * 0.32 : W * 0.4, oy = H * 0.34, bw = 60, bh = 48, sz = narrow ? 11 : 12;
      ctx.fillStyle = '#94a3b8'; ctx.fillRect(cx - 80, 12, 160, 8);
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; for (let x = cx - 76; x < cx + 80; x += 10) { ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x + 6, 4); ctx.stroke(); }
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, 20); ctx.lineTo(cx, oy); ctx.stroke();
      roundRect(ctx, cx - bw / 2, oy, bw, bh, 4, '#fde68a', '#92400e');
      ctx.fillStyle = '#78350f'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('20 kg', cx, oy + bh / 2); ctx.textBaseline = 'alphabetic';
      return {
        T: { a: [cx + 16, oy], b: [cx + 16, oy - 66], lines: narrow ? ['<i>T</i> = 200 N:', 'string pulls object up'] : ['<i>T</i> = 200 N: string pulls the object up'], lx: cx + 26, ly: oy - 52, align: 'left', size: sz },
        Wt: { a: [cx, oy + bh], b: [cx, oy + bh + 66], lines: narrow ? ['<i>W</i> = 200 N:', 'Earth pulls object down'] : ['<i>W</i> = 200 N: Earth pulls the object down'], lx: cx + 12, ly: oy + bh + 34, align: 'left', size: sz }
      };
    }
    // Tutorial 3 A3: a 2.0 kg box pushed at a constant velocity of 1.0 m/s
    function sceneBox(ctx, W, H) {
      const narrow = W < 560, gy = H * 0.62, bs = 64, bx = W / 2 - bs / 2, sz = narrow ? 11 : 12;
      floorLine(ctx, 10, W - 10, gy);
      label(ctx, 'Rough surface', W - 60, gy + 46, '#64748b', 'center', 11);
      roundRect(ctx, bx, gy - bs, bs, bs, 4, '#fde68a', '#92400e');
      ctx.fillStyle = '#78350f'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('2.0 kg', bx + bs / 2, gy - bs / 2); ctx.textBaseline = 'alphabetic';
      arrow(ctx, bx + 6, gy - bs - 24, bx + bs + 30, gy - bs - 24, COL.v, 3, 9);
      // on a phone there is no room beside the arrow: the label goes above it
      if (narrow) label(ctx, `<i>v</i> = 1.0 ${MS1}, constant`, bx + bs / 2, gy - bs - 46, COL.v, 'center', 11);
      else label(ctx, `<i>v</i> = 1.0 ${MS1}, constant`, bx + bs + 36, gy - bs - 24, COL.v, 'left', 11);
      return {
        push: { a: [bx - 90, gy - bs / 2], b: [bx - 3, gy - bs / 2], lines: ['push = 30 N'], lx: bx - 48, ly: gy - bs / 2 - 18, align: 'center', size: sz },
        fric: { a: [bx + bs / 2, gy - 4], b: [bx + bs / 2 - 90, gy - 4], lines: ['friction = 30 N'], lx: bx + bs / 2 - 46, ly: gy + 20, align: 'center', size: sz }
      };
    }
    // Example 12: a car crashes into a brick wall
    function sceneCar(ctx, W, H) {
      const narrow = W < 560, gy = H * 0.66, wx = narrow ? W * 0.56 : W * 0.6, ww = narrow ? 26 : 40, cl = narrow ? 120 : 150, ch = 40, sz = narrow ? 11 : 12;
      floorLine(ctx, 10, W - 10, gy);
      ctx.fillStyle = '#fca5a5'; ctx.fillRect(wx, 30, ww, gy - 30);
      ctx.strokeStyle = '#b91c1c'; ctx.lineWidth = 1;
      for (let y = 30, row = 0; y < gy; y += 14, row++) { ctx.beginPath(); ctx.moveTo(wx, y); ctx.lineTo(wx + ww, y); ctx.stroke(); }
      ctx.strokeRect(wx, 30, ww, gy - 30);
      // the car, its front touching the wall
      const cx0 = wx - cl, cy0 = gy - ch - 10;
      roundRect(ctx, cx0, cy0, cl, ch, 8, '#93c5fd', '#1e3a8a');
      roundRect(ctx, cx0 + cl * 0.22, cy0 - 22, cl * 0.5, 24, 6, '#bfdbfe', '#1e3a8a');
      dot(ctx, cx0 + 26, gy - 10, 10, '#1e293b'); dot(ctx, wx - 28, gy - 10, 10, '#1e293b');
      ctx.fillStyle = '#1e3a8a'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('1000 kg', cx0 + cl / 2, cy0 + 11); // above the wall's push, which crosses the car ctx.textBaseline = 'alphabetic';
      label(ctx, 'Brick wall', wx + ww / 2, 16, '#991b1b', 'center', 11);
      const hy = cy0 + ch / 2;
      return {
        wc: { a: [wx, hy + 8], b: [wx - 84, hy + 8], lines: ['wall pushes car', '40 kN (on the car)'], lx: wx - 8, ly: cy0 - 66, align: 'right', size: sz },
        cw: { a: [wx, hy - 8], b: [wx + 84, hy - 8], lines: ['car pushes wall', '40 kN (on the wall)'], lx: wx + ww + 6, ly: cy0 - 66, align: 'left', size: sz }
      };
    }

    /* ---------------- drawing: one function per tab ---------------- */
    let handle = null;
    function draw() {
      __pim = window.__pim = { labels: [], arrows: [], panes: [], lit: [], hits: [] };
      const c = setup(canvas); if (!c) return;
      const { ctx, W, H } = c;
      CW = W; PANE = 'scene'; __pim.panes.push({ name: 'scene', x: 0, y: 0, w: W, h: H });
      handle = null;
      if (currentTab === 1) drawSpot(ctx, W, H);
      else if (currentTab === 2) drawTwo(ctx, W, H);
      else if (currentTab === 3) drawSkaters(ctx, W, H);
      else if (currentTab === 4) drawCard(ctx, W, H);
    }

    /* tab 1: which force is the partner of which */
    // the forces each step shows; the pair colours: action red and reaction blue, or (puck) one colour per pair
    const SHOW1 = { wall: [[], ['act'], ['act', 're'], ['act', 're']], rocket: [[], ['act'], ['act', 're'], ['act', 're']],
      puck: [['N', 'W'], ['N', 'W', 'W2'], ['N', 'W', 'W2', 'N2'], ['N', 'W', 'W2', 'N2']] };
    function colour1(kind, id) { return kind === 'puck' ? (id[0] === 'N' ? COL.N : COL.W) : (id === 'act' ? COL.act : COL.re); }
    function lit1() {
      if (!sel) return [];
      return [sel, FORCES[P1.kind][sel].pair];
    }
    function drawSpot(ctx, W, H) {
      const kind = P1.kind, step = S.step, narrow = W < 560;
      const f = kind === 'wall' ? sceneWall(ctx, W, H, P1.F, { vals: true }) : kind === 'rocket' ? sceneRocket(ctx, W, H) : scenePuck(ctx, W, H);
      const show = SHOW1[kind][step - 1], lit = lit1().filter(id => show.includes(id));
      __pim.lit = lit;
      show.forEach(id => {
        const faded = lit.length && !lit.includes(id);
        drawForce(ctx, id, f[id], faded ? FADE : colour1(kind, id), { alpha: faded ? 0.35 : 1, lw: lit.includes(id) ? 5 : 3.5 });
      });
      if (kind === 'wall' && step >= 2) handle = f.handle;
      // the last step: the three rules, or (puck) the answer to Exercise 4
      if (step >= 4) {
        const lines = kind === 'puck' ? ['<i>N</i> and <i>W</i>: not an action–reaction pair', 'Same object (the puck); different kinds of force']
          : ['Equal in size and opposite in direction', 'On different objects; the same kind (contact)'];
        lines.forEach((t, i) => label(ctx, t, narrow ? W / 2 : W - 12, 16 + i * 21, '#0f172a', narrow ? 'center' : 'right', narrow ? 11 : 12));
      }
    }

    /* tab 2: two blocks */
    function drawTwo(ctx, W, H) {
      const sol = solve2(), d = 0.5 * sol.a * sim.t * sim.t, dmax = 0.5 * sol.a * T2END * T2END;
      const st = S.step, vals = { onPushed: st >= 3, onFront: st >= 4 };
      const f = sceneBlocks(ctx, W, H, P2, d, dmax, vals);
      drawForce(ctx, 'P', f.P, COL.P);
      drawForce(ctx, 'onFront', f.onFront, COL.AB);
      drawForce(ctx, 'onPushed', f.onPushed, COL.BA);
      handle = sim.t === 0 && !sim.running ? f.handle : null;
      ctx.fillStyle = '#334155'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
      richText(ctx, `<i>t</i> = ${tx(sim.t)} s     <i>v</i> = ${f3(sol.a * sim.t)} ${MS1}`, 10, 18);
      // the acceleration of both blocks, top right
      const aTxt = st >= 2 ? `<i>a</i> = ${f3(sol.a)} ${MS2}` : '<i>a</i> = ?';
      arrow(ctx, W - 150, 40, W - 104, 40, COL.a, 3, 9); label(ctx, aTxt, W - 98, 40, COL.a, 'left');
      if (st >= 5) {
        const fr = sol.front, mF = sol.mF;
        label(ctx, `Check, block ${fr}: ${f3(sol.C)} N = ${kg(mF)} × ${f3(sol.a)} ✓`, 10, 62, '#15803d', 'left', W < 560 ? 11 : 12);
      }
    }

    /* tab 3: skaters */
    function drawSkaters(ctx, W, H) {
      const st = skaters(sim.t), end = skaters(T3END), gy = H - 64, cx = W / 2, narrow = W < 560;
      const size = m => 24 + Math.sqrt(m) * 3.2, hA = size(P3.mA) * 0.35 + 2, hB = size(P3.mB) * 0.35 + 2;
      // they start with their hands touching; a scale that keeps both in the picture for the whole run
      const dmax = Math.max(Math.abs(end.xA), Math.abs(end.xB)) - X0, pxPerM = (W / 2 - 60 - Math.max(hA, hB)) / Math.max(dmax, 0.1);
      ctx.fillStyle = '#e0f2fe'; ctx.fillRect(0, gy, W, H - gy);
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();

        ctx.strokeStyle = '#334155'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - sz * 0.45, gy - 3); ctx.lineTo(x + sz * 0.45, gy - 3); ctx.stroke();
        ctx.fillStyle = 'white'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.fillText(name, x, gy - sz * 1.25);

    /* tab 4: one card */
    function drawCard(ctx, W, H) {
      const C = CARDS[game.i];
      let f;
      if (C.scene === 'wall') f = sceneWall(ctx, W, H, 100, { vals: false });
      else if (C.scene === 'rocket') f = sceneRocket(ctx, W, H);
      else if (C.scene === 'puck') f = scenePuck(ctx, W, H);
      else if (C.scene === 'blocks') f = sceneBlocks(ctx, W, H, { P: 30, mA: 1.5, mB: 3, front: 'B' }, 0, 1, { onPushed: true, onFront: true });
      else if (C.scene === 'hang') f = sceneHang(ctx, W, H);
      else if (C.scene === 'box') f = sceneBox(ctx, W, H);

      });
    }

    /* ---------------- the inputs ---------------- */
    const INPUTS = {
      1: () => P1.kind === 'wall' ? [['F', 'Push of the man on the wall (N)', P1.F, 0, 10]] : [],
      2: () => [['P', 'Push <i>P</i> (N)', P2.P, 0, 1], ['mA', 'Mass of A (kg)', P2.mA, 0.5, 0.5], ['mB', 'Mass of B (kg)', P2.mB, 0.5, 0.5]],
      3: () => [['mA', 'Mass of A (kg)', P3.mA, 10, 5], ['mB', 'Mass of B (kg)', P3.mB, 10, 5], ['F', 'Push between the hands (N)', P3.F, 0, 10]],
      4: () => []

    function buildInputs() {
      const list = INPUTS[currentTab](), el = $('inputs');
      $('expWrap').hidden = currentTab === 4;
      el.innerHTML = list.length ? list.map(([k, lab, v, min, step]) => `<div class="control-group label-row"><label for="in_${k}">${lab}</label>
        <input id="in_${k}" type="number" data-k="${k}" min="${min}" step="${step}" value="${plain(v)}" /></div>`).join('')
        : '<div class="none">Nothing to change here: tap a force arrow to find its partner.</div>';
      el.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => readInput(inp)));
    }
    function syncInputs() {

    }
    function readInput(inp) {
      const k = inp.dataset.k, raw = parseFloat(inp.value);

      const min = parseFloat(inp.min) || 0, v = Math.max(min, raw);
      // the man's push is not from the notes: changing it keeps the scenario
      if (currentTab === 1) P1.F = Math.min(PUSH_MAX, v);
      else if (currentTab === 2) { P2[k] = k === 'P' ? Math.min(P2MAX, v) : Math.min(20, v); toCustom(); resetRun(); }
      else if (currentTab === 3) { P3[k] = k === 'F' ? Math.min(400, v) : Math.min(150, v); toCustom(); resetRun(); }
      update();
    }
    function toCustom() {
      if (S.custom) return;
      S.custom = true; S.scen = 'custom'; presetEl.value = 'custom';
      // the question box keeps its height: nothing above the canvas may move while a finger drags
      const q = $('question'); q.style.minHeight = q.offsetHeight + 'px';
      q.innerHTML = 'Your own values. Choose a scenario from the menu to go back to the example.';
      clearFeat();
    }

    /* ---------------- taps and drags ---------------- */
    let dragging = false;
    function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    const nearHandle = p => handle && Math.hypot(p.x - handle.x, p.y - handle.y) < 22;
    canvas.addEventListener('pointerdown', e => {
      const p = pos(e);
      // a box still focused after typing is never refreshed (syncInputs skips it): let go of it first
      if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
      if ((currentTab === 1 || currentTab === 2) && nearHandle(p)) { dragging = true; canvas.setPointerCapture(e.pointerId); e.preventDefault(); return; }
      if (currentTab === 1) {
        // a tap on a force lights it and its partner; a tap on empty space clears the choice
        const hit = __pim.hits.map(h => ({ id: h.id, d: distTo(p, h.a, h.b) })).filter(h => h.d < 16).sort((a, b) => a.d - b.d)[0];

      }
    });
    canvas.addEventListener('pointermove', e => {
      const p = pos(e);
      if (!dragging) {
        const overForce = currentTab === 1 && __pim.hits.some(h => distTo(p, h.a, h.b) < 16);
        canvas.style.cursor = nearHandle(p) ? 'ew-resize' : overForce ? 'pointer' : 'default'; return;
      }
      if (currentTab === 1) P1.F = Math.round(Math.max(0, Math.min(PUSH_MAX, (p.x - handle.wx - 16) / handle.k)) / 10) * 10;
      else { P2.P = Math.round(Math.max(0, Math.min(P2MAX, (handle.xEnd - p.x - 12) / handle.k))); toCustom(); }
      update();
    });
    const endDrag = () => { if (dragging) { dragging = false; update(); } };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---------------- readouts, words and working ---------------- */
    function cards(list) {
      const el = $('readout');
      el.className = 'readout' + (list.length === 4 ? ' n4' : list.length === 6 ? ' n6' : '');

    }
