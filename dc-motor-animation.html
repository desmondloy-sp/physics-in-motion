  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;
    const COL = { coil: '#b45309', coilOff: '#a8a29e', cur: '#ea580c', field: '#16a34a', fieldLine: 'rgba(22,163,74,0.8)', F: '#dc2626', N: '#dc2626', S: '#2563eb',
      X: '#d97706', Y: '#0d9488', brush: '#1f2937', d: '#7c3aed', turn: '#7c3aed', hl: 'rgba(250,204,21,0.6)' };
    const DEG = Math.PI / 180;
    const minus = s => String(s).replace(/-/g, '−');

    /* ---------------- numbers ---------------- */
    // sf significant figures; an exact whole number stays whole; very small or large values as a × 10^n
    function num(v, sf = 3) {
      if (!isFinite(v)) return '—';
      if (Math.abs(v) < 1e-12) return '0';
      if (Math.abs(v - Math.round(v)) < 1e-9 && Math.abs(v) < 1e4) return minus(String(Math.round(v)));
      const a = Math.abs(v);
      if (a < 1e-2 || a >= 1e4) {

        case 'max': return `Horizontal: d is half the coil’s width (2.0 cm), the largest it can be, so the turning effect is the biggest: ${num(Math.abs(turning(motorOf(), Math.PI).total))} N m.`;
        case 'zero': return 'Vertical: both forces act along lines through the axle, so d = 0 and there is no turning effect.';
        case 'back': return 'Turned 135°, past the vertical: AB is still pushed down and CD up, but now they turn the coil clockwise, back towards the vertical.';
        case 'b': return '(b) The coil is vertical: neither X nor Y is in contact with P or Q, so the current is cut off (notes p. 8-33).';
        case 'c': return '(c) Just past the vertical, half-ring Y touches P and X touches Q: X and Y have exchanged places and the current in the coil is reversed (p. 8-33).';
        case 'inertia': return `At (b) there is no current and no turning effect, but the coil is still turning (${turnsPerSecond(Math.abs(coilNow()[1])).toFixed(2)} turns per second) because of its inertia.`;
        case 'same': return 'After two revolutions the current has reversed four times, once every half-revolution, and the coil has turned anticlockwise the whole time.';
        case 'rock': return 'With complete rings the current never reverses: the coil rocks to and fro about the vertical and comes to rest there.';
        case 'I': case 'N': case 'A': case 'Bf': return `Doubling it doubles the biggest turning effect (${num(maxTurning(motorA()))} → ${num(maxTurning(motorB()))} N m), and motor B ends up turning ${ratioNow()} times as fast (notes p. 8-29).`;
        case 'rev': return 'Motor B with its current reversed: the same turning effect and the same speed, but it turns clockwise. Reversing the current reverses the forces; it does not make them bigger.';

    // the options are written with the right one first; turn each part's list round by a fixed amount
    { let pc = 0; QUIZ.forEach(Q => Q.parts.forEach(Pt => { const n = Pt.opts.length, r = (pc++ * 5 + 1) % n;

      P = keep.P; Object.assign(S, keep.S); show = keep.show; Object.assign(sim, keep.sim); psiLive = keep.psiLive; TR = keep.TR; TRB = keep.TRB; KM = keep.KM; RUN_END = keep.RUN_END;

    let quiz = { i: 0, score: 0, picks: [], done: false, missed: [] };

      if (view() === 'race') { const [pA, oA] = coilNow(TR), [pB, oB] = coilNow(TRB); st.race = { maxA: maxTurning(motorA()), maxB: maxTurning(motorB()), omA: oA, omB: oB, psiA: pA / DEG, psiB: pB / DEG }; }
      if (id === 'find') st.game = { ...game };

    };
    window.__pimSetTime = setTime;
    window.addEventListener('resize', () => { if (currentTab <= 4) update(); else if (QUIZ[quiz.i] && QUIZ[quiz.i].fig && $('qFig')) drawFig($('qFig'), QUIZ[quiz.i].fig); });

  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),

    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
