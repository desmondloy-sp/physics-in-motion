  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), graphCv = $('graph'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const EC = 1.60e-19;   // the size of the charge on an electron, C (lecturer's copy, Example 1, p. 7-5)
    const clean = v => (Math.abs(v) < 1e-300 ? 0 : v);
    // 3 significant figures, as the lecturer's copy gives them; exact whole numbers stay whole; an exact value keeps
    // its own figures; a 1e-12 nudge so a binary half rounds up; a true minus sign
    const f3 = v => {
      const x = clean(v);
      if (Math.abs(x - Math.round(x)) < 1e-9 * Math.max(1, Math.abs(x))) return String(Math.round(x)).replace('-', '−');
      const t = (x * (1 + 1e-12)).toPrecision(3);
      if (Math.abs(+t - x) < 1e-12 * Math.max(1, Math.abs(x)) || Math.abs(x) >= 100) return String(+t).replace('-', '−');
      return t.replace('-', '−');
    };
    const ex = e => `10<sup>${String(e).replace('-', '−')}</sup>`;
    // a number in 3 significant figures; very large or very small ones as a × 10^n, like the notes
    function num(v, sf = 3) {
      const x = clean(v); if (x === 0) return '0';
      const a = Math.abs(x); let e = Math.floor(Math.log10(a) + 1e-12);
      if (e >= -2 && e <= 3) return sf === 3 ? f3(x) : (x * (1 + 1e-12)).toPrecision(sf).replace('-', '−');
      let m = (a / Math.pow(10, e) * (1 + 1e-12)).toPrecision(sf);
      if (+m >= 10) { e++; m = (a / Math.pow(10, e) * (1 + 1e-12)).toPrecision(sf); }
      if (e === 0) return (x < 0 ? '−' : '') + m;
      return `${x < 0 ? '−' : ''}${m} × ${ex(e)}`;
    }
    const plain = v => String(+(+v).toFixed(4)).replace('-', '−');
    // a value in an input box: big and small ones in calculator form (1.5e6)
    const inTxt = v => { const a = Math.abs(v); return a !== 0 && (a >= 1e5 || a < 1e-3) ? (+(+v).toPrecision(6)).toExponential().replace('e+', 'e') : String(+(+v).toPrecision(6)); };
    const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
    const rt = s => `<span class="root"><i class="rs">&radic;</i><span>${s}</span></span>`;
    const ECtxt = `1.60 × ${ex(-19)}`;
    const A_ = v => `${num(v)} A`, V_ = v => `${num(v)} V`, O_ = v => `${num(v)} Ω`, C_ = v => `${num(v)} C`, J_ = v => `${num(v)} J`;
    const mA_ = v => (v > 0 && v < 0.01 ? `${f3(v * 1e3)} mA` : A_(v));  // a small current as the question gives it (1.6 mA)
    const COL = { e: '#facc15', eD: '#a16207', conv: '#dc2626', wire: '#334155', amm: '#0891b2', volt: '#7c3aed', energy: '#16a34a', res: '#dc2626', lamp: '#d97706', wireTest: '#b45309' };
    const areaOfD = d => Math.PI * d * d / 4;     // cross-sectional area of a round wire, A = πd²/4 = π(d/2)²

    /* ---------------- scenarios (every number from the notes, the lecturer's copy or Tutorial 7) ---------------- */
    // tab 1: findI (Q passes in t: find I) or findQ (I for t: find Q); closed: the switch
    // tab 2: emf (energy given to Q coulombs by a battery of emf E); W (find the work done, W = QV); V (find V = W/Q)
    // tab 3: exp (take readings, resistor or lamp); calc (V = IR: find V, I or R)
    // tab 4: R = ρL/A, find R, ρ, L or d; cut (a wire cut into equal pieces)
    // tab 5: the metre-rule rig (a wire of resistivity rho and diameter d)
    const RHO6 = 3.6 * areaOfD(0.64e-3) / 0.985;  // Example 6's wire: 3.6 Ω at 98.5 cm, 0.64 mm across
    const PRESETS = {
      oneA: { tab: 1, kind: 'findQ', name: '1 A for 5 s', I: 1, Iu: 1, t: 5, closed: true, txt: { I: '1', t: '5' },
        q: 'Notes p. 7-4: Electric current is defined as the quantity of charge passing a given point in one second, <i>I</i> = <i>Q</i>/<i>t</i>. One ampere is one coulomb per second: 1 A = 1 C s<sup>−1</sup>. (Values chosen for this page: 1 A for 5 s.)' },
      ex1: { tab: 1, kind: 'findI', name: '3.0 C passes in 4.0 s', Q: 3, t: 4, closed: true, txt: { Q: '3.0', t: '4.0' },
        q: 'Example 1 (notes p. 7-5): A charge of 3.0 C flows past a point in 4.0 s. Calculate the current and the number of electrons passing that point each second.' },
      a1: { tab: 1, kind: 'findI', name: '30 C passes in 5 s', Q: 30, t: 5, closed: true, txt: { Q: '30', t: '5' },
        q: 'Tutorial 7, A1: A charge of 30 C flow through a point in 5 s. What is the current?' },
      a2: { tab: 1, kind: 'findQ', name: 'A current of 1.6 mA', I: 1.6e-3, Iu: 1e-3, t: 60, t2: 30, closed: true, txt: { I: '1.6', t: '60' },
        q: 'Tutorial 7, A2: The current in a wire is 1.6 mA. For any point along the wire, (a) how much charge passes through in 1 minute? (b) how many electrons pass through every 30 s?' },
      open: { tab: 1, kind: 'findQ', name: 'The switch is open', I: 0.75, Iu: 1, t: 4, closed: false, txt: { I: '0.75', t: '4' },
        q: 'Notes p. 7-9: When the switch is closed, current flows through the circuit: a closed (or complete) circuit. When the switch is opened, no current flows through the circuit. This is called an open circuit. (Tick “Switch closed” to close it.)' },

      emf3: { tab: 2, kind: 'emf', name: 'A battery of emf 3 V', E: 3, Q: 1, comp: 'lamp', txt: { E: '3', Q: '1' },
        q: 'Notes p. 7-10: The electromotive force (emf) is the electrical energy given to each coulomb of charge as it passes through the battery or the generator. For example, a battery of emf 3 V gives 3 J of electrical energy to 1 C of charge passing through it.' },
      pd10: { tab: 2, kind: 'W', name: '10 V across a resistor', V: 10, Q: 1, comp: 'resistor', txt: { V: '10', Q: '1' },
        q: 'Notes p. 7-11: Potential difference (or voltage) is defined as the work done in moving one coulomb of charge between two points. If the potential difference across a resistor is 10 V, it means that 10 J of work must be done to move 1 C of charge through it.' },
      ex3: { tab: 2, kind: 'W', name: '2 C through 8 V', V: 8, Q: 2, comp: 'resistor', txt: { V: '8', Q: '2' },
        q: 'Example 3 (notes p. 7-12): When a charge of 2 C flows through a potential difference of 8 V, how much work is done by the charge?' },
      a5: { tab: 2, kind: 'V', name: '120 J for 10 C through a bulb', W: 120, Q: 10, comp: 'lamp', txt: { W: '120', Q: '10' },
        q: 'Tutorial 7, A5: 120 J of work is done when 10 C of charge passes through an electric bulb. What is the potential difference across the bulb?' },

      res15: { tab: 3, kind: 'exp', comp: 'resistor', name: 'A 15 Ω resistor: take readings',
        q: 'Notes p. 7-15: Ohm’s law states that current is directly proportional to the potential difference between the ends of a conductor, provided that the physical conditions (e.g. temperature) of the conductor remain unchanged. Set a voltage, record the reading, and repeat at several voltages.' },
      ex4a: { tab: 3, kind: 'calc', find: 'V', name: '5.0 Ω carrying 1.2 A', R: 5, I: 1.2, txt: { R: '5.0', I: '1.2' },
        q: 'Example 4(a) (notes p. 7-18): Calculate the voltage across a 5.0 Ω ohmic conductor carrying a current of 1.2 A.' },
      ex4b: { tab: 3, kind: 'calc', find: 'I', name: '4.0 Ω with 6.0 V across it', R: 4, V: 6, txt: { R: '4.0', V: '6.0' },
        q: 'Example 4(b) (p. 7-18): Calculate the current flowing through a 4.0 Ω ohmic conductor when a voltage of 6.0 V is applied across it.' },
      a6: { tab: 3, kind: 'calc', find: 'R', name: '6.0 V gives 0.50 A', V: 6, I: 0.5, V2: 12, txt: { V: '6.0', I: '0.50', V2: '12' },
        q: 'Tutorial 7, A6: When the potential difference across a conductor is 6.0 V, the current is 0.50 A. Calculate (a) the resistance of the conductor, (b) the current which would flow if the potential difference were 12 V.' },
      lamp: { tab: 3, kind: 'exp', comp: 'lamp', name: 'A filament lamp (3.0 V, 0.60 W)',
        q: 'Tutorial 7, B7: a filament lamp has a rating of 0.60 W, 3.0 V; at 3.0 V its resistance is 15 Ω. Take readings up to 3.0 V and compare them with the 15 Ω resistor’s. (Below 3.0 V the lamp’s resistance is a value chosen for this page: the notes give only 15 Ω at 3.0 V.)' },

      ex5: { tab: 4, find: 'R', name: 'Nichrome wire, 14 m long', mat: 'Nichrome', rho: 1.0e-6, L: 14, A: 2.5e-7, area: 'A', Lf: 1, Af: 1,
        txt: { rho: `1.0 × ${ex(-6)}`, L: '14', A: `2.5 × ${ex(-7)}` },
        q: 'Example 5 (notes p. 7-21): A piece of nichrome wire is 14 m long and has a cross-sectional area of 2.5 × 10<sup>−7</sup> m<sup>2</sup>. If the resistivity of nichrome is 1.0 × 10<sup>−6</sup> Ω m, what is the resistance of the wire?' },
      ex6: { tab: 4, find: 'rho', name: 'A metallic wire, 0.64 mm across', mat: '', d: 0.64e-3, L: 0.985, R: 3.6, area: 'd', Lf: 0.01, txt: { d: '0.64', L: '98.5', R: '3.6' },
        q: 'Example 6 (notes p. 7-22): A metallic wire of diameter 0.64 mm is 98.5 cm long and has a resistance of 3.6 Ω. What is the resistivity of the wire?' },
      a3: { tab: 4, find: 'R', name: 'A railway conductor rail', mat: '', rho: 12.0e-8, L: 1000, A: 6000e-6, area: 'A', Lf: 1, Af: 1e-6,
        txt: { rho: `12.0 × ${ex(-8)}`, L: '1000', A: '6000' },
        q: 'Tutorial 7, A3: The conductor rail of an electric railway has a cross-sectional area of 6000 mm<sup>2</sup>. The resistivity of the material is 12.0 × 10<sup>−8</sup> Ω m. Calculate the resistance of a 1000 m length of rail.' },
      a4: { tab: 4, find: 'L', name: 'Nichrome for 1000 Ω', mat: 'Nichrome', rho: 110e-8, d: 0.08e-3, R: 1000, area: 'd', Lf: 1,
        txt: { rho: `110 × ${ex(-8)}`, d: '0.08', R: '1000' },
        q: 'Tutorial 7, A4: The resistivity of nichrome wire is 110 × 10<sup>−8</sup> Ω m. What length of wire of diameter 0.08 mm is required to provide a resistance of 1000 Ω?' },
      b1: { tab: 4, find: 'd', name: 'A coil of 3.50 Ω', mat: '', rho: 1.70e-8, L: 25, R: 3.5, area: 'd', Lf: 1, turns: 500, turnLen: '50.0',
        txt: { rho: `1.70 × ${ex(-8)}`, L: '25.0', R: '3.50' },
        q: 'Tutorial 7, B1: A coil is to have a resistance of 3.50 Ω. It consists of 500 turns of wire and the mean length of a turn is 50.0 mm. Calculate a suitable wire diameter. The resistivity of the wire is 1.70 × 10<sup>−8</sup> Ω m.' },
      b2: { tab: 4, find: 'cut', name: 'A 100 Ω wire cut in two', mat: '', R: 100, n: 2, txt: { R: '100', n: '2' },
        q: 'Tutorial 7, B2(a): A wire of resistance 100 Ω is cut into 2 pieces of equal lengths. What is the resistance of each piece?' },

      nich: { tab: 5, kind: 'rig', name: 'Nichrome wire, 0.50 mm', rho: 1.0e-6, mat: 'Nichrome', d: 0.5, V: 3,
        q: 'Notes pp. 7-19, 7-20: for a uniform metallic wire, <i>R</i> = <i>ρL</i>/<i>A</i>. Nichrome’s resistivity is 100 × 10<sup>−8</sup> Ω m. Drag the crocodile clip to change the length <i>L</i> in the circuit, and record the resistance at several lengths.' },
      w6: { tab: 5, kind: 'rig', name: 'Example 6’s wire: find ρ', rho: RHO6, mat: '', d: 0.64, V: 3, mystery: true,
        q: 'Example 6’s wire (notes p. 7-22): diameter 0.64 mm; 98.5 cm of it has a resistance of 3.6 Ω. Its material is not named. Record the resistance at several lengths, then find its resistivity from the gradient of the <i>R</i>–<i>L</i> graph.' },
      cu: { tab: 5, kind: 'rig', name: 'Copper wire, 0.50 mm', rho: 1.7e-8, mat: 'Copper', d: 0.5, V: 3,
        q: 'Notes p. 7-20: materials with low resistivity such as silver, copper and gold are used as conductors or connectors. Copper’s resistivity is 1.7 × 10<sup>−8</sup> Ω m.' }
    };
    const OWN = 'Your own values. Choose a scenario from the menu to go back to an example from the notes.';
    // the resistivity table, notes p. 7-20 (× 10^-8 Ω m at 20 °C)
    const METALS = [['Silver', 1.6], ['Copper', 1.7], ['Gold', 2.4], ['Aluminium', 2.8], ['Tungsten', 5.5], ['Nichrome', 100]];

    /* ---------------- the state ---------------- */
    let S = { scen: 'oneA', custom: false, step: 0 };
    let P = {};            // the scenario in use (a copy, changed by the inputs and the drags)
    let hl = {}, feat = {};
    const gv = (k, f) => (!S.custom && P.txt && P.txt[k] !== undefined ? P.txt[k] : f(P[k])); // a value as the notes write it
    // tab 3's recorded readings stay while the tab is open, so the resistor's and the lamp's can be compared
    let ohm = { resistor: [], lamp: [] }, vSet = 1.5, ivPlot = false;
    // tab 5's clip position and readings
    let rig = { L: 0.6, rl: [] };
    const mode = () => currentTab === 1 ? 'run' : currentTab === 2 || currentTab === 4 ? 'steps' : currentTab === 3 ? (P.kind === 'calc' ? 'steps' : 'read') : currentTab === 5 ? 'read' : '';
    const isRun = () => mode() === 'run';
    const isSteps = () => mode() === 'steps';

    /* ---------------- tab 1: current is flowing charge, I = Q/t ---------------- */
    const t1I = () => (!P.closed ? 0 : P.kind === 'findI' ? P.Q / P.t : P.I);
    const sim = { t: 0, running: false, last: null };
    const runEnd = () => (isRun() ? P.t : 0);
    // a long run is shown faster (A2's 60 s in 6 s), and the page says so
    const speedUp = () => (P.t > 10 ? P.t / 6 : 1);
    function keyMoments() {
      if (!isRun()) return [];
      const T = runEnd(), step = T > 10 ? 10 : 1, m = [];
      for (let k = 0; k * step < T - 1e-9; k++) m.push(k * step);
      if (P.t2 && !m.includes(P.t2)) m.push(P.t2);
      m.push(T);
      return m.sort((a, b) => a - b);
    }
    const ended = () => !sim.running && sim.t >= runEnd() - 1e-9 && runEnd() > 0;
    function t1Steps() {
      const I = t1I(), L = [];
      const tT = gv('t', f3);
      if (!P.closed) {
        L.push('The switch is open: the circuit is broken, so no charge can flow round it.');
        L.push({ h: `<i>I</i> = 0 A, so the charge passing P is <i>Q</i> = <i>It</i> = 0 × ${tT} = 0 C`, lit: true });
        return L;
      }
      if (P.kind === 'findI') {
        L.push(`<i>Q</i> = ${gv('Q', f3)} C passed P in <i>t</i> = ${tT} s`);
        L.push({ h: `<i>I</i> = ${frac('<i>Q</i>', '<i>t</i>')} = ${frac(gv('Q', f3), tT)} = ${A_(I)}`, lit: true });
        L.push({ h: `Each electron carries a charge of ${ECtxt} C, so the number of electrons passing P each second = ${frac(f3(I), ECtxt)} = ${num(I / EC)}`, lit: true });
        return L;
      }
      const mA = P.Iu === 1e-3, Itxt = mA ? `${gv('I', v => f3(v / 1e-3))} mA = ${gv('I', v => f3(v / 1e-3))} × ${ex(-3)} A` : `${gv('I', f3)} A`;
      const Isub = mA ? `${gv('I', v => f3(v / 1e-3))} × ${ex(-3)}` : gv('I', f3);
      L.push(`<i>I</i> = ${Itxt}, <i>t</i> = ${tT} s`);
      L.push({ h: `<i>Q</i> = <i>It</i> = ${Isub} × ${tT} = ${C_(I * P.t)}`, lit: true });
      if (P.t2 && !S.custom) L.push({ h: `In ${P.t2} s: <i>Q</i> = ${Isub} × ${P.t2} = ${C_(I * P.t2)}; the number of electrons = ${frac(f3(I * P.t2), ECtxt)} = ${num(I * P.t2 / EC)}`, lit: true });
      else if (P.I === 1 && P.Iu === 1) L.push('1 A is 1 coulomb every second: 1 C passes P each second.');
      return L;
    }

    /* ---------------- tab 2: emf and potential difference, V = W/Q ---------------- */
    function t2Values() {
      if (P.kind === 'emf') return { W: P.E * P.Q, V: P.E };
      if (P.kind === 'W') return { W: P.Q * P.V, V: P.V };
      return { W: P.W, V: P.W / P.Q };
    }
    function t2Steps() {
      const V = t2Values(), L = [];
      if (P.kind === 'emf') {
        L.push(`A battery of emf <i>E</i> = ${gv('E', f3)} V. A charge of ${gv('Q', f3)} C passes through it.`);
        L.push(`Emf is the electrical energy given to each coulomb of charge: ${gv('E', f3)} J to every coulomb (1 V = 1 J C<sup>−1</sup>).`);
        L.push({ h: `Energy given = emf × charge = ${gv('E', f3)} × ${gv('Q', f3)} = ${J_(V.W)}`, lit: true });
        return L;
      }
      if (P.kind === 'W') {
        L.push(`A charge <i>Q</i> = ${gv('Q', f3)} C flows through a potential difference <i>V</i> = ${gv('V', f3)} V.`);
        L.push(`p.d. is the work done in moving one coulomb: ${gv('V', f3)} J for every coulomb (1 V = 1 J C<sup>−1</sup>).`);
        L.push(`<i>V</i> = ${frac('<i>W</i>', '<i>Q</i>')}, so <i>W</i> = <i>QV</i>`);
        L.push({ h: `<i>W</i> = <i>QV</i> = ${gv('Q', f3)}(${gv('V', f3)}) = ${J_(V.W)}`, lit: true });
        return L;
      }
      L.push(`<i>W</i> = ${gv('W', f3)} J of work is done when <i>Q</i> = ${gv('Q', f3)} C passes through the bulb.`);
      L.push(`Potential difference = work done ÷ charge: <i>V</i> = ${frac('<i>W</i>', '<i>Q</i>')}`);
      L.push({ h: `<i>V</i> = ${frac(gv('W', f3), gv('Q', f3))} = ${V_(V.V)}`, lit: true });
      return L;
    }

    /* ---------------- tab 3: Ohm's law, R = V/I ---------------- */
    const RES_R = 15;
    // Tutorial B7's lamp: 15 Ω at its rated 3.0 V; its filament heats as the current grows, so its resistance rises
    // from about 3 Ω cold (a value chosen for this page) to 15 Ω at 3.0 V. I = V/R still rises with V.
    const lampR = v => 3 + 12 * Math.pow(Math.max(0, v) / 3, 0.8);
    const compR = (c, v) => (c === 'lamp' ? lampR(v) : RES_R);
    const expI = (c, v) => v / compR(c, v);
    function t3Values() {
      if (P.find === 'V') return { R: P.R, I: P.I, V: P.I * P.R };
      if (P.find === 'I') return { R: P.R, V: P.V, I: P.V / P.R };
      const R = P.V / P.I; return { R, V: P.V, I: P.I, V2: P.V2, I2: P.V2 / R };
    }
    function t3Steps() {
      const V = t3Values(), L = [];
      if (P.find === 'V') {
        L.push(`An ohmic conductor: <i>R</i> = ${gv('R', f3)} Ω, <i>I</i> = ${gv('I', f3)} A`);
        L.push(`<i>R</i> = ${frac('<i>V</i>', '<i>I</i>')}, so <i>V</i> = <i>IR</i>`);
        L.push({ h: `<i>V</i> = <i>IR</i> = ${gv('I', f3)}(${gv('R', f3)}) = ${V_(V.V)}`, lit: true });
        return L;
      }
      if (P.find === 'I') {
        L.push(`An ohmic conductor: <i>R</i> = ${gv('R', f3)} Ω, <i>V</i> = ${gv('V', f3)} V`);
        L.push(`<i>R</i> = ${frac('<i>V</i>', '<i>I</i>')}, so <i>I</i> = ${frac('<i>V</i>', '<i>R</i>')}`);
        L.push({ h: `<i>I</i> = ${frac(gv('V', f3), gv('R', f3))} = ${A_(V.I)}`, lit: true });
        return L;
      }
      L.push(`<i>V</i> = ${gv('V', f3)} V, <i>I</i> = ${gv('I', f3)} A`);
      L.push({ h: `(a) <i>R</i> = ${frac('<i>V</i>', '<i>I</i>')} = ${frac(gv('V', f3), gv('I', f3))} = ${O_(V.R)}`, lit: true });
      L.push(`(b) The conductor’s resistance stays ${O_(V.R)} (an ohmic conductor), now with <i>V</i> = ${gv('V2', f3)} V.`);
      L.push({ h: `<i>I</i> = ${frac('<i>V</i>', '<i>R</i>')} = ${frac(gv('V2', f3), f3(V.R))} = ${A_(V.I2)}`, lit: true });
      return L;
    }

    /* ---------------- tab 4: the resistance of a uniform wire, R = ρL/A (notes p. 7-19) ---------------- */
    function t4Values() {
      if (P.find === 'cut') return { R: P.R, Rn: P.R / P.n };
      if (P.find === 'R') { const A = P.area === 'd' ? areaOfD(P.d) : P.A; return { A, R: P.rho * P.L / A }; }

    /* ---------------- the graphs: tab 3 V–I (or I–V), tab 5 R–L ---------------- */

    /* ---------------- dragging: tab 4 the wire's end; tab 5 the crocodile clip ---------------- */

    /* ---------------- readouts, words and working ---------------- */
    function cards(list) {

        case 'count': return `Example 1: 0.75 A is 0.75 C every second. Each electron carries ${ECtxt} C, so 0.75 ÷ (${ECtxt}) = ${num(0.75 / EC)} electrons pass P each second.`;
        case 'emf': return 'A battery of emf 3 V gives 3 J of electrical energy to every coulomb of charge passing through it (p. 7-10).';
        case 'pd': return 'A p.d. of 10 V across a resistor means 10 J of work must be done to move each coulomb of charge through it (p. 7-11).';
        case 'gain': return 'Charges gain energy as they pass through the battery and lose it as they flow through the circuit: in the resistor it becomes heat (p. 7-13). 2 C through 8 V gives up 16 J.';
        case 'dq': return `Twice the charge through the same p.d. does twice the work: 4 C × 8 V = ${J_(4 * 8)}, where 2 C did 16 J.`;
        case 'straight': return 'Every reading gives <i>V</i>/<i>I</i> = 15 Ω: the resistor’s points lie on a straight line through the origin. It obeys Ohm’s law: an ohmic conductor (p. 7-17).';

      $('predictQ').innerHTML = Q.q;

      const opts = $('predictOpts');

      Q.opts.forEach((o, i) => {

        b.addEventListener('click', () => {
          if (opts.dataset.done) return;
          predictPick = i; opts.querySelectorAll('.opt').forEach((x, j) => x.classList.toggle('picked', j === i));
        });
        opts.appendChild(b);
      });
      delete opts.dataset.done;
      $('predictCheck').textContent = 'Check my answer';
    }
    $('predictCheck').addEventListener('click', () => {
      const Q = PREDICT[currentTab], opts = $('predictOpts'), fb = $('predictFb');
      if (!Q) return;
      if (opts.dataset.done) { renderPredict(currentTab); return; }
      if (predictPick === null) { fb.innerHTML = '<span class="verdict no">Pick an answer first.</span>'; return; }
      opts.dataset.done = '1';
      const ok = predictPick === Q.ans;
      opts.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === Q.ans) x.classList.add('right'); else if (j === predictPick) x.classList.add('wrong'); });
      // the options fold away: the result line names the pick (and the right answer), then the explanation
      $('predictBox').classList.add('done');
      fb.innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> Your prediction: ${Q.opts[predictPick]}.`

      $('predictCheck').textContent = 'Try again';
    });

          <div class="quiz-sum"><div class="quiz-q">You scored ${quiz.score} out of ${QUIZ_MARKS}.</div>${list}</div>
          <div class="row-btns"><button type="button" id="qAgain">Try the quiz again</button></div>`;
        $('qAgain').addEventListener('click', resetQuiz);
        return;
      }
      const Q = QUIZ[quiz.i], many = Q.parts.length > 1;
      quiz.picks = Q.parts.map(() => null);
      el.innerHTML = `<div class="quiz-top"><span>Question ${quiz.i + 1} of ${N}</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div>
        <div class="quiz-bar"><i style="width:${(quiz.i / N) * 100}%"></i></div>
        ${Q.stem ? `<div class="quiz-q" id="qStem">${Q.stem}</div>` : ''}<div class="quiz-src">${Q.src}${many ? ` · ${Q.parts.length} parts, answer them all` : ''}</div>
        ${Q.parts.map((Pt, k) => `<div class="qpart" data-k="${k}">
          <div class="${Q.stem ? 'qpart-q' : 'quiz-q'}">${partLabel(Q, k)}${Pt.q}</div>
          <div class="opts">${Pt.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
          <div class="feedback"></div></div>`).join('')}
        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;
          quiz.picks[k] = +b.dataset.j; part.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b));
        }));
      });
      $('qReset').addEventListener('click', resetQuiz);
      $('qSubmit').addEventListener('click', () => {
        const fb = $('qFb');
        if (quiz.done) { quiz.i++; quiz.done = false; renderQuiz(); return; }
        const left = quiz.picks.map((p, k) => p === null ? partLabel(Q, k).trim() || `part ${k + 1}` : null).filter(x => x !== null);
        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }
        quiz.done = true; fb.innerHTML = '';
        el.querySelectorAll('.qpart').forEach(part => {
          const k = +part.dataset.k, Pt = Q.parts[k], ok = quiz.picks[k] === Pt.ans;
          if (ok) quiz.score++; else quiz.missed.push([quiz.i, k]);
          part.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === Pt.ans) x.classList.add('right'); else if (j === quiz.picks[k]) x.classList.add('wrong'); });
          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${Pt.why}</span>`;
        });
        el.querySelector('.quiz-top span:last-child').textContent = `Score: ${quiz.score} of ${QUIZ_MARKS}`;
        $('qSubmit').textContent = quiz.i + 1 < N ? 'Next question' : 'See the summary';
      });
    }

    /* ---------------- Teacher mode ---------------- */
    // Only the teacher link (this page's address + ?teacher) shows the button; students and the
    // Brightspace embed use the plain address. Not a lock: the panel only changes this screen.
    const teacher = $('teacher');
    if (new URLSearchParams(location.search).has('teacher')) $('teacherBtn').hidden = false;
    $('teacherBtn').addEventListener('click', () => { teacher.hidden = !teacher.hidden; });
    $('tClose').addEventListener('click', () => { teacher.hidden = true; });
    $('tExplain').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-explain');
      e.target.textContent = on ? 'Show explanations' : 'Hide explanations'; e.target.classList.toggle('on', on);
    });
    $('tAnswers').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-answers');
      e.target.textContent = on ? 'Show answer labels' : 'Hide answer labels'; e.target.classList.toggle('on', on);
    });
    // free exploration: no Predict first, and every step shown at once
    $('tFree').addEventListener('click', e => {
      freeMode = !freeMode; document.body.classList.toggle('free-mode', freeMode);
      e.target.textContent = freeMode ? 'Back to the guided steps' : 'Switch to free exploration'; e.target.classList.toggle('on', freeMode);
      showTab(currentTab);
    });
    const fullBtn = $('tFull');
    if (!document.fullscreenEnabled) fullBtn.hidden = true;
    fullBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
    $('tReset').addEventListener('click', () => { resetQuiz(); showTab(1); });

    // for the checks: the state behind the drawing
    window.__pimState = () => ({ tab: currentTab, scen: S.scen, custom: S.custom, step: S.step, nSteps: isSteps() ? nSteps() : 0, t: sim.t, end: runEnd(), mode: mode(),
      P: JSON.parse(JSON.stringify(P)), I1: currentTab === 1 ? t1I() : null, v2: currentTab === 2 ? t2Values() : null, v3: currentTab === 3 && P.kind === 'calc' ? t3Values() : null,
      v4: currentTab === 4 ? t4Values() : null, ohm: JSON.parse(JSON.stringify(ohm)), vSet, iv: ivPlot, rig: JSON.parse(JSON.stringify(rig)), rigR: currentTab === 5 ? rigR() : null,
      fitR: __pim.fitR || null, fitRL: __pim.fitRL || null, keyMoments: keyMoments() });
    window.addEventListener('resize', () => { if (currentTab <= 5) { wireGeo = null; update(); } });
    showTab(1);
  </script>
  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),
    // and a touch the page grabbed for a drag (its own setPointerCapture call) keeps the page still.
    // (hasPointerCapture can't tell: a touch is always captured implicitly.)
    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
