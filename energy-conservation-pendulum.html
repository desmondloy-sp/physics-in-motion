  </div>

  <aside class="teacher" id="teacher" hidden aria-label="Teacher mode">
    <h2>Teacher mode</h2>
    <div class="tbtns">
      <button id="tExplain" type="button">Hide explanations</button>
      <button id="tFree" type="button">Switch to free exploration</button>
      <button id="tAnswers" type="button">Hide answer labels</button>
      <button id="tFull" type="button">Full screen</button>
      <button id="tReset" type="button">Reset whole applet</button>
      <button id="tClose" type="button">Close</button>
    </div>
    <h3>Suggested prompts</h3>
    <ul id="tPrompts"></ul>
  </aside>

  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), graphCv = $('graph'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const G = 10;          // g = 10 m s^-2, as the notes and Tutorial 5 take it
    const TRACK_R = 1.2;   // the curved track (Examples 7 and 8) is drawn as part of a circle of radius 1.2 m
    const LIP = 100 * Math.PI / 180; // E, the lip of the track, 100° round from the bottom (1.41 m up)
    const DT = 0.0005;     // RK4 step for the track and the pendulum (s)
    const clean = v => (Math.abs(v) < 1e-9 ? 0 : v);
    // 3 significant figures, as the lecturer's copy gives them (4.47 m/s); exact whole numbers stay whole (108 J);
    // an exact value keeps its own figures (0.4 m); a 1e-12 nudge so a binary half rounds up; a true minus sign
    const f3 = v => {
      const x = clean(v);
      if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x)).replace('-', '−');
      const t = (x * (1 + 1e-12)).toPrecision(3);
      if (Math.abs(+t - x) < 1e-9 || Math.abs(x) >= 100) return String(+t).replace('-', '−');
      return t.replace('-', '−');
    };
    const plain = v => String(+(+v).toFixed(3)).replace('-', '−'); // a typed value as typed: 10, 0.5
    const tx = t => (Math.round(t * 100) / 100).toFixed(2);      // a time on the clock: 0.62 s
    const J = v => Math.abs(v) >= 100000 ? `${f3(v / 1000)} kJ` : `${f3(v)} J`;
    const ms = v => `${f3(v)} m/s`;
    const m_ = v => `${f3(v)} m`;
    const rt = s => `<span class="root"><i class="rs">&radic;</i><span>${s}</span></span>`;
    const COL = { KE: '#16a34a', GPE: '#2563eb', heat: '#ea580c', tot: '#111827', mech: '#7c3aed', fit: '#db2777', v: '#0d9488', h: '#475569' };

    /* ---------------- scenarios (every number from the notes, the lecturer's copy or Tutorial 5) ---------------- */
    // fall: a mass m starts at height h (m) moving upwards at u (m/s), and falls to the ground.
    // track: a sphere on a curved track, released from rest at A, h = hA; loss = energy lost to friction from A to B.
    // pend: a pendulum bob of mass m on a string L, released at a0 degrees; b = air resistance (1/s).
    // bounce: a ball dropped from h (m) rebounds to h2 (m).
    const PRESETS = {
      b1: { tab: 1, kind: 'fall', name: '0.50 kg dropped from 10 m', m: 0.5, h: 10, u: 0, marks: [4], txt: { m: '0.50' },
        q: 'Tutorial 5, B1: A mass of 0.50 kg falls from a height of 10 m above the ground. Ignoring air resistance, calculate the potential energy, the kinetic energy and the speed of the mass as it falls past the following heights, measured from the ground. (a) 10 m (b) 4 m (c) 0 m (just before it hits the ground)' },
      ex6: { tab: 1, kind: 'fall', name: '1.0 kg thrown up from a 10 m tower', m: 1, h: 10, u: 4, points: true, txt: { m: '1.0', u: '4.0' },
        q: 'Example 6 (notes p. 5-18): A 1.0 kg mass is thrown up from A with velocity 4.0 m/s. It reaches point B, then falls down and hits the ground at C. Calculate the kinetic and gravitational potential energy of the mass at points A, B and C. Ignore air resistance.' },
      ex7: { tab: 2, kind: 'track', name: 'Smooth track, released from A', m: 1, hA: 1, loss: 0, letters: true, txt: { m: '1.0', hA: '1.0' },
        q: 'Example 7 (notes p. 5-19): A stationary sphere on a smooth track is released from A as shown. (a) State where (B, C, D, E) the sphere will come to rest momentarily. (b) Calculate the velocity of the sphere at B. (c) Calculate the velocity of the sphere at C. (The notes give no mass: this page uses 1.0 kg. The speeds do not depend on it.)' },
      pend: { tab: 2, kind: 'pend', name: 'Pendulum pulled to 35°', m: 1, L: 1.2, a0: 35, b: 0, txt: { m: '1.0' },
        q: 'A pendulum bob is released from rest and swings with no air resistance. (Values chosen for this page: 1.0 kg on a 1.2 m string, pulled 35° to one side.)' },
      ex8: { tab: 3, kind: 'track', name: 'Rough track, 50 J lost to friction', m: 10, hA: 1, loss: 50, txt: { hA: '1' },
        q: 'Example 8 (notes p. 5-20): A sphere is released from rest at A and moves down a rough track as shown. Calculate the kinetic energy of the sphere at B if the gravitational potential energy at A is 100 J and energy loss due to friction is 50 J. (GPE at A = 100 J at a height of 1 m, so the page takes m = 100 ÷ (10 × 1) = 10 kg. It spreads the 50 J of friction evenly along the track from A to B.)' },
      b2: { tab: 3, kind: 'bounce', name: 'Tennis ball: 3.6 m, then 2.4 m', m: 0.06, h: 3.6, h2: 2.4, txt: { m: '0.060' },
        q: 'Tutorial 5, B2: A tennis ball is dropped from a height of 3.6 m. It rebounds to a height of 2.4 m. (a) What is the speed of the ball just before hitting the ground? (b) What is the speed of the ball just after leaving the ground? (c) Account for the failure of the tennis ball to reach the original height of 3.6 m. (The mass is not given: this page uses 0.060 kg. The speeds do not depend on it.)' },
      air: { tab: 3, kind: 'pend', name: 'Pendulum with air resistance', m: 1, L: 1.2, a0: 35, b: 0.2, dur: 20, txt: { m: '1.0' },
        q: 'The same pendulum (1.0 kg on a 1.2 m string, released at 35°), now with air resistance. (Value chosen for this page: the air resistance takes away 0.2 of the bob’s speed every second.)' }
    };
    const OWN = 'Your own values. Choose a scenario from the menu to go back to an example from the notes.';

    /* ---------------- the state ---------------- */
    let S = { scen: 'b1', custom: false };
    let P = {};            // the scenario in use (a copy, changed by the inputs and the drags)
    let traj = null;       // the track or pendulum run, worked out once per change
    const sim = { t: 0, running: false, last: null };
    let hl = {}, feat = {};
    const gvTxt = k => (!S.custom && P.txt && P.txt[k] !== undefined ? P.txt[k] : plain(P[k])); // a value as the notes write it
    const isSwing = () => P.kind === 'track' || P.kind === 'pend';
    const heatName = () => (P.kind === 'bounce' ? 'Sound and heat' : P.kind === 'pend' ? 'Heat (air resistance)' : 'Heat (friction)');

    /* ---------------- the fall (tab 1): closed form, up is positive ---------------- */
    function fallEnd() { return (P.u + Math.sqrt(P.u * P.u + 2 * G * P.h)) / G; }
    function fallAt(t) {
      const y = Math.max(0, P.h + P.u * t - 0.5 * G * t * t), vy = P.u - G * t;
      return { y, vy };
    }

    /* ---------------- the bounce (Tutorial B2): closed form ---------------- */
    // "just after leaving the ground" is a moment of its own, AFTER seconds after "just before": the ball sits on the
    // ground for that instant with its new upward speed, so both readings are exact
    const AFTER = 2e-5;
    function bounceTimes() { const t1 = Math.sqrt(2 * P.h / G), vUp = Math.sqrt(2 * G * P.h2); return { t1, vUp, end: t1 + AFTER + vUp / G }; }
    function bounceAt(t) {
      const { t1, vUp } = bounceTimes();
      if (t <= t1) return { y: Math.max(0, P.h - 0.5 * G * t * t), vy: -G * t, lost: 0 };
      const s = Math.max(0, t - t1 - AFTER);
      return { y: Math.max(0, vUp * s - 0.5 * G * s * s), vy: vUp - G * s, lost: P.m * G * (P.h - P.h2) };
    }

    /* ---------------- the track and the pendulum: one equation, RK4 ---------------- */
    // The sphere on a curved track (a circle of radius R) and the bob on a string of length L move the same way:
    // θ'' = −(g/R) sin θ − b θ' − (friction f along the track) / (mR). The heat is integrated on its own
    // (dHeat/dt = m b R² θ'² + f R |θ'|), so the total staying constant is a real check, not something forced.
    function swingParams() {
      const R = P.kind === 'pend' ? P.L : TRACK_R, side = P.side || -1;
      const th0 = side * (P.kind === 'pend' ? P.a0 * Math.PI / 180 : Math.acos(1 - P.hA / TRACK_R));
      const f = P.loss ? P.loss / (R * Math.abs(th0)) : 0;
      return { R, m: P.m, b: P.b || 0, f, th0 };
    }
    function deriv(s, q) {
      const [th, w] = s;
      // at rest the friction acts against the way the sphere is about to move
      const dir = w > 0 ? 1 : w < 0 ? -1 : -Math.sign(Math.sin(th));
      return [w, -(G / q.R) * Math.sin(th) - q.b * w - dir * q.f / (q.m * q.R), q.m * q.b * q.R * q.R * w * w + q.f * q.R * Math.abs(w)];
    }
    function rk4(s, h, q) {
      const k1 = deriv(s, q), k2 = deriv(s.map((v, j) => v + h / 2 * k1[j]), q);
      const k3 = deriv(s.map((v, j) => v + h / 2 * k2[j]), q), k4 = deriv(s.map((v, j) => v + h * k3[j]), q);
      return s.map((v, j) => v + h / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j]));
    }
    function swingAt(t) {
      const T = traj, k = Math.max(0, Math.min(T.samples.length - 1, Math.floor(t / 0.01 + 1e-9)));
      let s = T.samples[k]; const rem = t - k * 0.01, n = Math.ceil(rem / DT - 1e-9);
      for (let i = 0; i < n; i++) s = rk4(s, rem / n, T.q);
      return s;
    }
    function buildSwing() {
      const q = swingParams(), samples = [[q.th0, 0, 0]], brackets = [];
      const thC = Math.acos(1 - 0.4 / TRACK_R), wantC = P.kind === 'track' && P.letters && P.hA > 0.4 + 1e-9;
      const cons = !q.b && !q.f;
      traj = { q, samples, events: [], end: 0, thC };
      let s = samples[0], turns = 0, i = 0;
      const cap = P.dur || 40;
      while (i * DT < cap - 1e-12) {
        const s1 = rk4(s, DT, q), ta = i * DT, tb = (i + 1) * DT;
        if ((i + 1) % 20 === 0) samples.push(s1);
        if (s[0] * s1[0] < 0) brackets.push(['B', ta, tb]);
        if (wantC && (s[0] - thC) * (s1[0] - thC) < 0) brackets.push(['C', ta, tb]);
        if (i > 0 && s[1] * s1[1] < 0) { brackets.push(['turn', ta, tb]); turns++; }
        s = s1; i++;
        if ((cons && turns >= 2) || (q.f && turns >= 1)) break;
      }
      const fn = { B: t => swingAt(t)[0], C: t => swingAt(t)[0] - thC, turn: t => swingAt(t)[1] };
      for (const [kind, a0, b0] of brackets) {
        let a = a0, b = b0; const fa = fn[kind](a);
        for (let k = 0; k < 60; k++) { const m = (a + b) / 2; if (fn[kind](m) * fa > 0) a = m; else b = m; }
        traj.events.push({ t: (a + b) / 2, kind });
      }
      const turnsT = traj.events.filter(e => e.kind === 'turn');
      traj.end = P.dur ? P.dur : turnsT.length ? turnsT[turnsT.length - 1].t : i * DT;
      traj.events = traj.events.filter(e => e.t <= traj.end + 1e-9);
      // the end of every swing, for the dots and the decay curve on the energy graph
      traj.peaks = [0, ...turnsT.map(e => e.t)].map(t => ({ t, mech: energyOf(swingAt(t), q).mech }));
    }
    function energyOf(s, q) {
      const v = Math.abs(s[1]) * q.R, h = q.R * (1 - Math.cos(s[0]));
      const KE = 0.5 * q.m * v * v, GPE = q.m * G * h;
      return { v, h, KE, GPE, heat: s[2], mech: KE + GPE, total: KE + GPE + s[2] };
    }

    /* ---------------- one state for whatever is on screen ---------------- */
    function stateAt(t) {
      if (P.kind === 'fall') { const f = fallAt(t), v = Math.abs(f.vy), KE = 0.5 * P.m * v * v, GPE = P.m * G * f.y;
        return { y: f.y, h: f.y, v, vy: f.vy, KE, GPE, heat: 0, mech: KE + GPE, total: KE + GPE }; }
      if (P.kind === 'bounce') { const f = bounceAt(t), v = Math.abs(f.vy), KE = 0.5 * P.m * v * v, GPE = P.m * G * f.y;
        return { y: f.y, h: f.y, v, vy: f.vy, KE, GPE, heat: f.lost, mech: KE + GPE, total: KE + GPE + f.lost }; }
      const s = swingAt(t), e = energyOf(s, traj.q);
      return Object.assign(e, { th: s[0], w: s[1] });
    }
    const now = () => stateAt(sim.t);
    function runEnd() {
      if (P.kind === 'fall') return fallEnd();
      if (P.kind === 'bounce') return bounceTimes().end;
      return traj ? traj.end : 0;
    }
    // falls and bounces are over in under 2 s: shown at half speed; the track and the pendulum in real time
    const playRate = () => (isSwing() ? 1 : 0.5);

    /* ---------------- key moments, each with its name ---------------- */
    function keyList() {
      const end = runEnd(), L = [];
      if (P.kind === 'fall') {
        const ex6 = P.points && !S.custom;
        L.push({ t: 0, name: ex6 ? 'A' : `the start (${m_(P.h)} up)` });
        if (P.u > 0) L.push({ t: P.u / G, name: ex6 ? 'B, the top' : 'the top' });
        (P.marks || []).forEach(hm => { if (hm < P.h) L.push({ t: (P.u + Math.sqrt(P.u * P.u + 2 * G * (P.h - hm))) / G, name: `${m_(hm)} above the ground` }); });
        L.push({ t: end, name: ex6 ? 'C, just before hitting the ground' : 'just before it hits the ground' });
      } else if (P.kind === 'bounce') {
        const { t1 } = bounceTimes();
        L.push({ t: 0, name: 'the start' }, { t: t1, name: 'just before hitting the ground' }, { t: t1 + AFTER, name: 'just after leaving the ground' }, { t: end, name: 'the top of the rebound' });
      } else {
        const tr = P.kind === 'track', ex8 = tr && P.loss > 0;
        L.push({ t: 0, name: tr ? 'A' : 'the release point' });
        let turn = 0;
        traj.events.forEach(e => {
          if (e.kind === 'B') L.push({ t: e.t, name: tr ? 'B, the lowest point' : 'the lowest point' });
          else if (e.kind === 'C') L.push({ t: e.t, name: 'C' });
          else { turn++;
            L.push({ t: e.t, name: ex8 ? 'its highest point on the far side' : tr ? (turn === 1 ? 'D' : 'A again') : P.b ? `the end of swing ${turn}` : turn === 1 ? 'the other side' : 'the release point again' }); }
        });
        if (P.dur && !L.some(k => Math.abs(k.t - end) < 1e-6)) L.push({ t: end, name: `${tx(end)} s, the end of the run` });
      }
      return L.sort((a, b) => a.t - b.t);
    }
    const keyMoments = () => keyList().map(k => k.t);
    function atKey() { if (sim.running) return null; return keyList().find(k => Math.abs(k.t - sim.t) < 1e-7) || null; }

    function loadScenario(id) {
      S.scen = id; S.custom = false;
      P = JSON.parse(JSON.stringify(PRESETS[id]));
      $('question').innerHTML = P.q;
      rebuild();
    }
    function rebuild() { traj = null; if (isSwing()) buildSwing(); sim.t = 0; sim.running = false; sim.last = null; geo = null; }

    /* ---------------- the clock ---------------- */
    function frame(ts) {
      if (!sim.running) return;
      if (sim.last === null) sim.last = ts;
      // a first rAF timestamp can be earlier than the one stored: never step backwards
      const dt = Math.max(0, Math.min(0.05, (ts - sim.last) / 1000)); sim.last = ts;
      const end = runEnd();
      sim.t = Math.min(end, sim.t + dt * playRate());
      if (sim.t >= end - 1e-9) { sim.t = end; sim.running = false; }
      update();
      if (sim.running) requestAnimationFrame(frame);
    }
    function start() {
      const end = runEnd();
      if (end <= 0) { update(); return; }
      if (sim.t >= end - 1e-9) sim.t = 0;
      sim.running = true; sim.last = null; clearFeatNoteOnly(); update(); requestAnimationFrame(frame);
    }
    function setTime(t) { sim.running = false; sim.last = null; sim.t = Math.max(0, Math.min(runEnd(), t)); update(); }
    function resetRun() { sim.running = false; sim.last = null; sim.t = 0; update(); }
    function runToEnd() { setTime(runEnd()); }
    $('startBtn').addEventListener('click', start);
    $('pauseBtn').addEventListener('click', () => {
      if (sim.running) { sim.running = false; sim.last = null; update(); }
      else if (sim.t > 0 && sim.t < runEnd()) start();
    });
    $('resetBtn').addEventListener('click', resetRun);
    $('nextMoment').addEventListener('click', () => { const n = keyMoments().find(m => m > sim.t + 1e-6); if (n !== undefined) setTime(n); });
    $('prevMoment').addEventListener('click', () => { const p = keyMoments().filter(m => m < sim.t - 1e-6).pop(); if (p !== undefined) setTime(p); });

    /* ---------------- drawing helpers ---------------- */
    // what the canvas drew, for the checks: every label's box, every arrow, the panes and the drag handles
    window.__pim = { labels: [], arrows: [], panes: [], handles: [] };
    function setup(cv) {
      const r = cv.getBoundingClientRect();
      if (r.width < 20 || r.height < 20) return null; // hidden: never draw at no size
      const dpr = window.devicePixelRatio || 1, cw = Math.round(r.width * dpr), ch = Math.round(r.height * dpr);
      if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
      const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, r.width, r.height);
      return { ctx, W: r.width, H: r.height };
    }
    // Canvas text with <i>, <sub> and <sup> runs, so symbols of physical quantities are italic, as in the notes.
    // Honours ctx.textAlign; returns the width. measureOnly = true draws nothing.
    function richText(ctx, s, x, y, measureOnly) {
      const base = ctx.font, m = base.match(/([\d.]+)px/), size = m ? +m[1] : 12;
      const runs = []; let it = false, sub = 0;
      for (const tok of String(s).split(/(<\/?(?:i|sub|sup)>)/)) {
        if (tok === '<i>') it = true; else if (tok === '</i>') it = false;
        else if (tok === '<sub>') sub = 1; else if (tok === '<sup>') sub = -1;
        else if (tok === '</sub>' || tok === '</sup>') sub = 0;
        else if (tok) {
          let f = sub ? base.replace(/[\d.]+px/, (size * 0.75).toFixed(1) + 'px') : base;
          if (it) f = 'italic ' + f;
          ctx.font = f; runs.push({ t: tok, f, sub, w: ctx.measureText(tok).width });
        }
      }
      ctx.font = base;
      const w = runs.reduce((a, r) => a + r.w, 0);
      if (measureOnly) return w;
      const align = ctx.textAlign;
      let cx = align === 'center' ? x - w / 2 : (align === 'right' || align === 'end') ? x - w : x;
      ctx.textAlign = 'left';
      for (const r of runs) { ctx.font = r.f; ctx.fillText(r.t, cx, y + (r.sub === 1 ? size * 0.3 : r.sub === -1 ? -size * 0.4 : 0)); cx += r.w; }
      ctx.textAlign = align; ctx.font = base;
      return w;
    }
    let PANE = 'scene', CW = 1e9, CH = 1e9, CX0 = 0, CY0 = 0; // the pane name for the checks; the area a label must stay inside
    function arrow(ctx, x1, y1, x2, y2, color, lw = 3.5, head = 11, record = true) {
      const len = Math.hypot(x2 - x1, y2 - y1); if (len < 1.5) return;
      if (record) __pim.arrows.push({ pane: PANE, x1, y1, x2, y2 });
      const a = Math.atan2(y2 - y1, x2 - x1), hd = Math.min(head, len * 0.6);
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hd * 0.8, y2 - Math.sin(a) * hd * 0.8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - hd * Math.cos(a - 0.45), y2 - hd * Math.sin(a - 0.45)); ctx.lineTo(x2 - hd * Math.cos(a + 0.45), y2 - hd * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
    }
    // a label's box before it is drawn: x/y is the middle of the card's left, centre or right edge
    function labelBox(ctx, lines, x, y, align, size) {
      ctx.font = `bold ${size}px Arial`;
      const w = Math.max(...lines.map(t => richText(ctx, t, 0, 0, true))), lh = size * 1.6 + 1, h = lines.length * lh - 1;
      const x0 = Math.max(CX0 + 4, Math.min(CW - w - 4, align === 'center' ? x - w / 2 : align === 'right' ? x - w : x));
      const y0 = Math.max(CY0 + 2, Math.min(CH - h - 2, y - size * 0.8));
      return { x: x0 - 3, y: y0, w: w + 6, h, lh, tx: x0, size };
    }
    const hitBox = (a, b, pad = 1) => Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) > pad && Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) > pad;
    function crossesArrow(box) {
      return __pim.arrows.some(a => { if (a.pane !== PANE) return false; for (let k = 0; k <= 24; k++) { const px = a.x1 + (a.x2 - a.x1) * k / 24, py = a.y1 + (a.y2 - a.y1) * k / 24;
        if (px > box.x + 0.5 && px < box.x + box.w - 0.5 && py > box.y + 0.5 && py < box.y + box.h - 0.5) return true; } return false; });
    }
    // labels on white cards, one card per line; nudge: +1 moves down, −1 up, to dodge labels and arrows already drawn
    function label(ctx, lines, x, y, color, align = 'center', size = 12, nudge = 0) {
      if (!Array.isArray(lines)) lines = [lines];
      let b = labelBox(ctx, lines, x, y, align, size);
      if (nudge) for (let i = 0; i < 14 && (__pim.labels.some(l => l.pane === PANE && hitBox(l, b)) || crossesArrow(b)); i++) b = labelBox(ctx, lines, x, b.y + size * 0.8 + nudge * 8, align, size);
      lines.forEach((t, i) => {
        const card = { pane: PANE, text: t.replace(/<[^>]+>/g, ''), x: b.x, y: b.y + i * b.lh, w: b.w, h: size * 1.6 };
        ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fillRect(card.x, card.y, card.w, card.h);
        ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.font = `bold ${size}px Arial`; richText(ctx, t, b.tx, card.y + size * 0.8);
        ctx.textBaseline = 'alphabetic';

      const X = v => Lm + (v - xr[0]) / (xr[1] - xr[0]) * pw, Y = v => Tm + (yr[1] - v) / (yr[1] - yr[0]) * ph;

      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (let v = 0; v <= xr[1] + 1e-9; v += xstep) { ctx.beginPath(); ctx.moveTo(X(v), Tm); ctx.lineTo(X(v), H - Bm); ctx.stroke(); ctx.fillText(f3(v), X(v), H - Bm + 5); }

      ctx.fillStyle = '#334155'; ctx.font = '12px Arial'; ctx.textAlign = 'right'; richText(ctx, xLab, W - Rm, H - 4);

      const end = runEnd(), E0 = stateAt(0).total, ys = niceStep(E0 * 1.08, 4), ytop = Math.ceil(E0 * 1.08 / ys - 1e-9) * ys;
      const { X, Y } = axes(ctx, W, H, [0, end], [0, ytop], '<i>t</i> (s)', 'energy (J)', niceStep(end, W < 500 ? 5 : 8), ys);
      // the lines grow with the run, up to the moment shown
      const n = Math.max(2, Math.ceil(400 * sim.t / Math.max(end, 1e-9))), pts = [];

        // (least squares on ln E, through the first dot). KE + GPE itself falls in steps, because energy is

        const pk = traj.peaks.filter(p => p.t <= sim.t + 1e-9), Ez = pk[0].mech;

      { src: 'Example 8, notes p. 5-20', stem: 'A sphere is released from rest at A and moves down a rough track to B, the lowest point. The gravitational potential energy at A is 100 J and the energy loss due to friction is 50 J.', parts: [

      { src: 'Tutorial 5, B1', stem: 'A mass of 0.50 kg falls from a height of 10 m above the ground. Ignore air resistance.', parts: [

      { src: 'Values chosen for this question', stem: 'A pendulum bob is released from rest, pulled 35° to one side. Ignore air resistance.', parts: [
        { lab: '(a)', q: 'Where is its kinetic energy greatest?', opts: ['At the lowest point', 'Where it is released', 'At the end of the swing on the other side', 'It is the same everywhere'], ans: 0,

    ];
    // the options are written with the right one first; turn each part's list round by a fixed amount so the right
    // answer is not always in the same place
    { let pc = 0; QUIZ.forEach(Q => Q.parts.forEach(Pt => { const n = Pt.opts.length, r = (pc++ * 3 + 1) % n;
      Pt.opts = Pt.opts.slice(r).concat(Pt.opts.slice(0, r)); Pt.ans = (Pt.ans - r + n) % n; })); }
    const QUIZ_MARKS = QUIZ.reduce((n, Q) => n + Q.parts.length, 0);
    const partLabel = (Q, k) => Q.parts[k].lab ? Q.parts[k].lab + ' ' : Q.parts.length > 1 ? `(${'abcdefgh'[k]}) ` : '';
    let quiz = { i: 0, score: 0, picks: [], done: false, missed: [] };
    function resetQuiz() { quiz = { i: 0, score: 0, picks: [], done: false, missed: [] }; renderQuiz(); }
    function renderQuiz() {
      const el = $('quiz'), N = QUIZ.length;
      if (quiz.i >= N) {
        const list = quiz.missed.length
          ? `<p>Go back over these:</p><ul>${quiz.missed.map(([n, k]) => { const Q = QUIZ[n];

          : '<p>Every answer right. Well done.</p>';
        el.innerHTML = `<div class="quiz-top"><span>Summary</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div><div class="quiz-bar"><i style="width:100%"></i></div>
          <div class="quiz-sum"><div class="quiz-q">You scored ${quiz.score} out of ${QUIZ_MARKS}.</div>${list}</div>
          <div class="row-btns"><button type="button" id="qAgain">Try the quiz again</button></div>`;
        $('qAgain').addEventListener('click', resetQuiz);
        return;
      }
      const Q = QUIZ[quiz.i], many = Q.parts.length > 1;
      quiz.picks = Q.parts.map(() => null);
      el.innerHTML = `<div class="quiz-top"><span>Question ${quiz.i + 1} of ${N}</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div>
        <div class="quiz-bar"><i style="width:${(quiz.i / N) * 100}%"></i></div>
        ${Q.stem ? `<div class="quiz-q" id="qStem">${Q.stem}</div>` : ''}<div class="quiz-src">${Q.src}${many ? ` · ${Q.parts.length} parts, answer them all` : ''}</div>
        ${Q.parts.map((Pt, k) => `<div class="qpart" data-k="${k}">
          <div class="${Q.stem ? 'qpart-q' : 'quiz-q'}">${partLabel(Q, k)}${Pt.q}</div>
          <div class="opts">${Pt.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
          <div class="feedback"></div></div>`).join('')}
        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;
          quiz.picks[k] = +b.dataset.j; part.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b));
        }));
      });
      $('qReset').addEventListener('click', resetQuiz);
      $('qSubmit').addEventListener('click', () => {
        const fb = $('qFb');
        if (quiz.done) { quiz.i++; quiz.done = false; renderQuiz(); return; }
        const left = quiz.picks.map((p, k) => p === null ? partLabel(Q, k).trim() || `part ${k + 1}` : null).filter(x => x !== null);
        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }
        quiz.done = true; fb.innerHTML = '';
        el.querySelectorAll('.qpart').forEach(part => {
          const k = +part.dataset.k, Pt = Q.parts[k], ok = quiz.picks[k] === Pt.ans;
          if (ok) quiz.score++; else quiz.missed.push([quiz.i, k]);
          part.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === Pt.ans) x.classList.add('right'); else if (j === quiz.picks[k]) x.classList.add('wrong'); });
          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${Pt.why}</span>`;
        });
        el.querySelector('.quiz-top span:last-child').textContent = `Score: ${quiz.score} of ${QUIZ_MARKS}`;
        $('qSubmit').textContent = quiz.i + 1 < N ? 'Next question' : 'See the summary';
      });

    /* ---------------- Teacher mode ---------------- */
    // Only the teacher link (this page's address + ?teacher) shows the button; students and the

    const teacher = $('teacher');

    fullBtn.addEventListener('click', () => {

    window.__pimState = () => ({ tab: currentTab, scen: S.scen, custom: S.custom, t: sim.t, end: runEnd(), rate: playRate(), P: JSON.parse(JSON.stringify(P)),
      state: currentTab <= 3 ? now() : null, keys: currentTab <= 3 ? keyList() : [], fitK, game: JSON.parse(JSON.stringify(game)),
      events: traj ? traj.events : [], peaks: traj ? traj.peaks : [], q: traj ? traj.q : null });
    window.__pimRunToEnd = runToEnd;
    window.__pimStateAt = t => stateAt(t);
    window.addEventListener('resize', () => { if (currentTab <= 4) { geo = null; update(); } });
    showTab(1);

  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),
    // and a touch the page grabbed for a drag (its own setPointerCapture call) keeps the page still.
    // (hasPointerCapture can't tell: a touch is always captured implicitly.)
    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
