  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const G = 10; // g = 10 m s^-2, as Tutorial 3 takes it
    const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
    const norm = a => ((a % 360) + 360) % 360;
    const clean = v => (Math.abs(v) < 0.05 ? 0 : v);
    const f1 = v => clean(v).toFixed(1).replace('-', '−'); // one decimal place, a true minus sign, never "−0.0"

    function scaleNote(ctx, x, y) { ctx.fillStyle = '#334155'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.fillText(`1 box = ${view.npb} N`, x, y); }
    // a pane's title, recorded with the labels so the checks see it whole (or cut off) like any other label
    function paneTitle(ctx, r, text) {

    /* ---------------- drawing, one function per kind of scene ---------------- */
    let handles = [];
    function draw() {

      if (box.width < 20 || box.height < 20) return; // hidden (the Challenge tab): nothing to draw

      ({ line: drawLine, close: drawClose, comp: drawComp, strings: drawStrings })[S.kind](ctx, W, H);
      pending.forEach(f => f());
      area = null;
      window.sceneMap = { handles: handles.map(h => ({ k: h.k, x: h.x, y: h.y })), labels, ends, W, H };
    }

    // Tab 1: the forces on a line, then added tip to tail along the line
    function drawLine(ctx, W, H) {
      const { s, half } = view, V = S.axis === 'v';
      const vals = S.forces.map(signed), u = S.unk ? -lineSum() : null, st = S.step;
      const cols = S.forces.map(f => COL[f.k]);
      // the grid, aligned to the object's centre
      const C = V ? { ox: Math.round(W * 0.3), oy: Math.round(H / 2) } : { ox: Math.round(W / 2), oy: Math.round(Math.min(92, H * 0.3)) };
      grid(ctx, { x: 0, y: 0, w: W, h: H }, C, false);
      scaleNote(ctx, 6, H - 8);
      // the object (and, hung from the ceiling, its string)
      if (V) {
        ctx.strokeStyle = '#334155'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(C.ox - 50, 12); ctx.lineTo(C.ox + 50, 12); ctx.stroke();
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(C.ox - 14, 12); ctx.lineTo(C.ox - 14, C.oy - half); ctx.stroke();
      }
      const bw = V ? 2 * half + 20 : 2 * half, bh = V ? 2 * half : 56;
      ctx.fillStyle = '#86efac'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5;
      ctx.fillRect(C.ox - bw / 2, C.oy - bh / 2, bw, bh); ctx.strokeRect(C.ox - bw / 2, C.oy - bh / 2, bw, bh);
      if (V) { ctx.fillStyle = '#1e293b'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(`${plain(-vals[0] / G)} kg`, C.ox, C.oy); ctx.textBaseline = 'alphabetic'; }
      if (S.v && !V) {
        arrow(ctx, { x: C.ox - 24, y: C.oy - bh / 2 - 16 }, { x: C.ox + 24, y: C.oy - bh / 2 - 16 }, '#0f172a', 2);
        area = null; card(ctx, `<i>v</i> = ${f1(S.v)} m s<sup>−1</sup> (constant)`, C.ox + 32, C.oy - bh / 2 - 16, '#0f172a', 'left', 12);
      }

      const items = vals.map((v, i) => ({ v, col: cols[i], f: S.forces[i], i }));
      if (u !== null && st >= 4 && Math.abs(u) > 0.05) items.push({ v: u, col: COL.U, f: null, i: -1 });
      const sides = {};
      items.forEach(it => { const k = it.v < 0 ? 'n' : 'p'; (sides[k] = sides[k] || []).push(it); });
      Object.values(sides).forEach(list => list.forEach((it, j) => { it.off = (j - (list.length - 1) / 2) * (V ? 26 : 22); }));
      items.forEach(it => {
        const dir = it.v < 0 ? -1 : 1;
        let a, b;
        if (V) { a = { x: C.ox + it.off + (it.f ? 0 : 14), y: C.oy - dir * bh / 2 }; b = { x: a.x, y: a.y - it.v * s }; }
        else { a = { x: C.ox + dir * bw / 2, y: C.oy + it.off }; b = { x: a.x + it.v * s, y: a.y }; }
        if (V && !it.f) a.x = C.ox - 14, b.x = C.ox - 14; // the tension acts along the string
        arrow(ctx, a, b, it.col, 4);
        const nm = it.f ? it.f.name : `${S.unk.name} ${S.unk.sym}`;
        const val = st >= 2 || !it.f ? `${sg(it.v)} N` : `${plain(Math.abs(it.v))} N`;
        const text = nm ? `${nm} = ${val}` : val;
        if (V) card(ctx, text, b.x + 12, b.y + (dir > 0 ? 10 : -10), it.col, 'left', 12);
        else card(ctx, text, b.x + dir * 8, it.off < 0 ? b.y - 13 : it.off > 0 ? b.y + 13 : b.y - 13, it.col, dir > 0 ? 'left' : 'right', 12);
        if (it.f) handles.push({ k: it.i, x: b.x, y: b.y });
      });
      if (u !== null && st < 4) card(ctx, `${S.unk.name} ${S.unk.sym} = ?`, V ? C.ox + bw / 2 + 12 : C.ox, V ? C.oy - bh / 2 - 30 : C.oy + bh / 2 + 14, COL.U, V ? 'left' : 'center', 12);
      // the sum: each force starts at the tip of the one before
      if (st >= 3) {

        const rcols = [...cols, COL.U];

        ctx.fillStyle = '#334155'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
        if (V) {
          const x0 = Math.round(W * 0.66), y0 = Math.round(H / 2 + ((lo + hi) / 2) * s), Y = n => y0 - n * s;
          ctx.fillText('Add them along the line:', x0 - 40, 16);
          row.forEach((v, i) => { const x = x0 + i * 18; arrow(ctx, { x, y: Y(cum[i]) }, { x, y: Y(cum[i + 1]) }, rcols[i], 3); if (i) dashed(ctx, { x: x - 18, y: Y(cum[i]) }, { x, y: Y(cum[i]) }, '#94a3b8'); });
          dot(ctx, { x: x0, y: Y(0) }, 3.5);

        } else {

          ctx.fillText('Add them along the line:', 8, yb - 6);
          row.forEach((v, i) => { const y = yb + 10 + i * 16; arrow(ctx, { x: X(cum[i]), y }, { x: X(cum[i + 1]), y }, rcols[i], 3); if (i) dashed(ctx, { x: X(cum[i]), y: y - 16 }, { x: X(cum[i]), y }, '#94a3b8'); });
          dot(ctx, { x: X(0), y: yb + 10 }, 3.5);
          const tot = cum[cum.length - 1], y3 = yb + 10 + row.length * 16 + 14;
          if (Math.abs(tot) > 0.05) arrow(ctx, { x: X(0), y: y3 }, { x: X(tot), y: y3 }, COL.R, 4);

      }
    }

    // Tab 2: the forces at one point, and the same forces tip to tail; the user's force closes the shape
    function drawClose(ctx, W, H) {
      const [L, R] = view.O, st = S.step, known = S.forces.map(vec), u = userVec(), N = netClose(), M = missing();
      const closed = N.m < CLOSE_TOL;
      paneTitle(ctx, L.r, 'Forces acting at one point');
      paneTitle(ctx, R.r, 'The same forces, one after another');
      grid(ctx, L.r, L, true); grid(ctx, R.r, R, false);
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
      if (W >= 600) { ctx.beginPath(); ctx.moveTo(W / 2, 6); ctx.lineTo(W / 2, H - 6); ctx.stroke(); }
      else { ctx.beginPath(); ctx.moveTo(6, H / 2); ctx.lineTo(W - 6, H / 2); ctx.stroke(); }

      if (!closed) arrow(ctx, O, at(L, N.x, N.y), 'rgba(220,38,38,0.75)', 2.5);
      dot(ctx, O, 3.5);
      // right: tip to tail
      area = R.r;
      if (st < 2) {
        ctx.fillStyle = '#64748b'; ctx.font = '13px Arial'; ctx.textAlign = 'center';
        ctx.fillText('Press Next step to draw them', R.r.x + R.r.w / 2, R.r.y + R.r.h / 2 - 8);
        ctx.fillText('one after another.', R.r.x + R.r.w / 2, R.r.y + R.r.h / 2 + 10);
      } else {
        // drawn in order of direction, so forces along one line (Example 4) never lie on top of each other
        const ord = chainOrder();
        const pts = [{ x: 0, y: 0 }]; ord.forEach(i => pts.push({ x: pts[pts.length - 1].x + known[i].x, y: pts[pts.length - 1].y + known[i].y }));

        if (st >= 4 && M.m > 0.05) arrow(ctx, E, P[0], COL.M, 3, [7, 5]);

        if (S.user.m > 0.05) arrow(ctx, E, UE, COL.U, 4);

    // Tab 3: the given forces, then the unknown built from its components

      grid(ctx, o.r, o, true); scaleNote(ctx, 6, H - 8);
      S.forces.forEach((f, i) => {

        if (st <= 2 && !Gv.onAxis) arc(ctx, O, 26 + 12 * i, Gv.axis, Gv.axis + (norm(f.a - Gv.axis) > 180 ? -Gv.ang : Gv.ang), `${plain(Gv.ang)}°`, c);

      if (st >= 3 && Math.abs(M.x) > 0.05) { arrow(ctx, O, Xt, c, 3, [7, 4]); card(ctx, `${uComp('x').replace('its ', '')} = ${sg(M.x)} N`, (O.x + Xt.x) / 2, O.y + (M.y >= 0 ? 18 : -18), c, 'center', 12); }
      if (st >= 4 && Math.abs(M.y) > 0.05) { arrow(ctx, Xt, Mt, c, 3, [7, 4]); card(ctx, `${uComp('y').replace('its ', '')} = ${sg(M.y)} N`, Xt.x + (M.x >= 0 ? 10 : -10), (Xt.y + Mt.y) / 2, c, M.x >= 0 ? 'left' : 'right', 12); }
      if (st >= 5 && M.m > 0.05) { arrow(ctx, O, Mt, c, 4); card(ctx, `${nm} = ${f1(M.m)} N`, Mt.x + (M.x >= 0 ? 10 : -10), Mt.y + (M.y >= 0 ? -12 : 12), c, M.x >= 0 ? 'left' : 'right'); }
      if (st >= 6 && Math.abs(M.x) > 0.05 && Math.abs(M.y) > 0.05) {
        const axis = M.x > 0 ? 0 : 180, al = deg(Math.atan2(Math.abs(M.y), Math.abs(M.x))), sgn = (M.x > 0) === (M.y > 0) ? 1 : -1;
        arc(ctx, O, 48, axis, axis + sgn * al, `<i>θ</i> = ${f1(al)}°`, c);
      }
      dot(ctx, O, 4);
    }

    // Tab 4: the block on two strings, and its three forces drawn tip to tail (a closed triangle)
    function drawStrings(ctx, W, H) {
      const [L, R] = view.panes, s = view.s, th = S.theta, T = tension(th), half = rad(th / 2);
      paneTitle(ctx, L, 'The 1 kg block and the forces on it');
      paneTitle(ctx, R, 'The three forces, one after another');
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
      if (W >= 600) { ctx.beginPath(); ctx.moveTo(W / 2, 6); ctx.lineTo(W / 2, H - 6); ctx.stroke(); }
      else { ctx.beginPath(); ctx.moveTo(6, H / 2); ctx.lineTo(W - 6, H / 2); ctx.stroke(); }
      // left: the block; each tension along its string, the weight down from the block
      area = L;
      const bw = 60, bh = 34, Wlen = G * s;
      // place the block so the tensions above it and the weight below it both fit

      const k = { x: L.x + L.w / 2, y: Math.max(top, Math.min(bottom, L.y + (L.h - bh - Wlen + T * Math.cos(half) * s) / 2)) };
      ctx.fillStyle = '#94a3b8'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5;

      ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('1 kg', k.x, k.y + bh / 2); ctx.textBaseline = 'alphabetic';
      const gap = th < 0.5 ? 7 : 0; // vertical strings sit side by side, as the notes draw them

      const tL = { x: aL.x - T * Math.sin(half) * s, y: aL.y - T * Math.cos(half) * s }, tR = { x: aR.x + T * Math.sin(half) * s, y: aR.y - T * Math.cos(half) * s };
      if (S.showComp && th >= 0.5) {
        const v = T * Math.cos(half) * s, hz = T * Math.sin(half) * s;
        [[aL, -1], [aR, 1]].forEach(([a, d]) => {
          dashed(ctx, a, { x: a.x, y: a.y - v }, '#0f766e', 2); dashed(ctx, { x: a.x, y: a.y - v }, { x: a.x + d * hz, y: a.y - v }, '#ea580c', 2);
        });
        card(ctx, `vertical part ${f1(T * Math.cos(half))} N`, k.x + 8, k.y - v / 2, '#0f766e', 'left', 12);
        card(ctx, `horizontal parts ${f1(T * Math.sin(half))} N each way`, k.x, k.y - T * Math.cos(half) * s - 14, '#ea580c', 'center', 12);
      }
      arrow(ctx, aL, tL, COL.F1, 4); arrow(ctx, aR, tR, COL.F2, 4);
      if (th >= 0.5) arc(ctx, k, 26, 90 + th / 2, 90 - th / 2, `<i>θ</i> = ${plain(th)}°`, '#475569');
      // each tension's label beyond its own arrowhead, on its own side: at mid-arrow the two crowded each other
      card(ctx, `<i>T</i> = ${f1(T)} N`, tL.x - 6, tL.y - 12, COL.F1, 'right'); card(ctx, `<i>T</i> = ${f1(T)} N`, tR.x + 6, tR.y - 12, COL.F2, 'left');
      const wa = { x: k.x, y: k.y + bh }, wb = { x: k.x, y: k.y + bh + Wlen };
      arrow(ctx, wa, wb, COL.W, 4); card(ctx, `<i>W</i> = ${f1(G)} N`, k.x + 10, (wa.y + wb.y) / 2, COL.W, 'left');
      handles.push({ k: 'tL', ...tL }, { k: 'tR', ...tR });
      // right: T, T and W, tail to tip, end where they started
      area = R;
      const hx = T * Math.sin(half), w3 = th < 0.5 ? 16 : 0;

      const B = { x: A.x - hx * s, y: A.y - T * Math.cos(half) * s }, Cc = { x: A.x, y: A.y - G * s };
      if (th < 0.5) {

      } else {
        arrow(ctx, A, B, COL.F1, 4); arrow(ctx, B, Cc, COL.F2, 4); arrow(ctx, Cc, A, COL.W, 4);

      }
      dot(ctx, A, 4);
      card(ctx, `The arrows end where they started: ${SF} = 0`, R.x + R.w / 2, R.y + R.h - 14, '#15803d', 'center', 12);
    }

    /* ---------------- the controls (typed values) ---------------- */
    function forceInputs() {
      const box = $('forceInputs'), K = S.kind;
      const field = (id, lab, v, step = 0.1, dis = false) => `<div class="control-group"><label for="${id}">${lab}</label><input id="${id}" type="number" step="${step}" value="${v}"${dis ? ' disabled' : ''} /></div>`;
      let h = '';
      if (K === 'line') S.forces.forEach((f, i) => {
        const lab = f.fix ? `${f.name || LAB[f.k]} (N)` : `${f.name || LAB[f.k]} (N, ${S.axis === 'v' ? 'up' : 'right'} +)`;
        h += `<div class="fgroup"><span class="swatch" style="background:${COL[f.k]}"></span>${field('v' + i, lab, (f.fix ? f.m : signed(f)).toFixed(1), 0.5)}</div>`;
      });
      else if (K === 'close' || K === 'comp') {
        S.forces.forEach((f, i) => { h += `<div class="fgroup"><span class="swatch" style="background:${COL[f.k]}"></span>${field('m' + i, `${LAB[f.k]} (N)`, f.m.toFixed(1))}${field('a' + i, 'Direction from +<i>x</i> (°)', f.a.toFixed(1), 1)}</div>`; });
        if (K === 'close') h += `<div class="fgroup"><span class="swatch" style="background:${COL.U}"></span>${field('um', `${S.ulab} (N)`, S.user.m.toFixed(1), 0.5, !!S.lock)}${field('ua', 'Direction from +<i>x</i> (°)', S.user.a.toFixed(1), 1)}</div>`;
      } else if (K === 'strings') {
        h += `<div class="fgroup wide"><span class="swatch" style="background:${COL.F1}"></span><div class="control-group label-row"><label for="th" id="thLab">Angle <i>θ</i> between the strings (${plain(S.theta)}°)</label><input id="th" type="range" min="0" max="150" step="1" value="${S.theta}" /></div></div>`;
      }
      box.innerHTML = h;
      box.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { readInputs(inp.id); toCustom(); update(); }));
    }
    // a typed value goes into the forces; the field being typed in is never rewritten
    function readInputs(id) {
      const num = (i, d = 0) => { const v = parseFloat($(i).value); return Number.isFinite(v) ? v : d; };
      if (S.kind === 'line') S.forces.forEach((f, i) => {
        const v = num('v' + i);
        if (f.fix) { f.m = Math.min(1000, Math.abs(v)); return; }
        f.m = Math.min(1000, Math.abs(v));
        f.a = S.axis === 'v' ? (v < 0 ? 270 : 90) : (v < 0 ? 180 : 0);
      });
      else if (S.kind === 'close' || S.kind === 'comp') {
        S.forces.forEach((f, i) => { f.m = Math.min(200, Math.max(0, num('m' + i))); if (id === 'a' + i) { f.a = norm(num('a' + i)); f.ref = 'x'; } });
        if (S.kind === 'close') { if (!S.lock) S.user.m = Math.min(200, Math.max(0, num('um'))); if (id === 'ua') S.user.a = norm(num('ua')); }
      } else if (S.kind === 'strings') S.theta = Math.max(0, Math.min(150, num('th')));
    }
    function syncInputs() {
      const set = (id, v) => { const e = $(id); if (e && document.activeElement !== e) e.value = v; };
      if (S.kind === 'line') S.forces.forEach((f, i) => set('v' + i, (f.fix ? f.m : signed(f)).toFixed(1)));
      else if (S.kind === 'close' || S.kind === 'comp') {
        S.forces.forEach((f, i) => { set('m' + i, f.m.toFixed(1)); set('a' + i, f.a.toFixed(1)); });
        if (S.kind === 'close') { set('um', S.user.m.toFixed(1)); set('ua', S.user.a.toFixed(1)); }
      } else if (S.kind === 'strings') { set('th', S.theta); const l = $('thLab'); if (l) l.innerHTML = `Angle <i>θ</i> between the strings (${plain(S.theta)}°)`; }
    }
    // The example's question no longer applies to your own values. The box keeps its height, so the drawing and the
    // fields under it never jump while a finger drags or a value is typed; choosing a scenario frees it again.
    function toCustom() {
      if (S.scen === 'custom') return;
      S.scen = 'custom'; presetEl.value = 'custom';
      const q = $('question'), h = q.getBoundingClientRect().height;
      if (h) q.style.minHeight = h + 'px';
      q.innerHTML = customText();
    }

    /* ---------------- the step line, the readouts, the words and the working ---------------- */
    function stepText() {
      const st = S.step;
      if (S.kind === 'line') return S.unk
        ? ['The forces on the object. One force is unknown.', 'Give each force its sign: right and up are +, left and down are −.', 'In equilibrium the net force is zero: the forces add to 0.', `So the unknown force is the sum of the others with its sign reversed.`][st - 1]
        : ['The forces on the object.', 'Give each force its sign: right and up are +, left and down are −.', 'Add them along the line: each force starts at the tip of the one before.', 'The resultant joins the start to the last tip.'][st - 1];
      if (S.kind === 'close') return ['The forces act at one point. The object is in equilibrium, so one force is missing.', 'Draw them one after another: the tail of each force at the tip of the one before.', 'The gap: a dashed line from the last tip back to the start. The missing force must fill it.', 'The missing force joins the last tip to the start. Measure it: count the boxes and measure its angle.'][st - 1];
      return ['Draw the forces and a table: Force, ' + FX + ', ' + FY + '.', 'For each force, find ' + FX + ' and ' + FY + '.', `In equilibrium ${SFX} = 0: find ${uComp('x')}.`, `In equilibrium ${SFY} = 0: find ${uComp('y')}.`, `Find ${uName()} using Pythagoras’ theorem.`, 'Find the angle it makes with the horizontal using tan <i>θ</i>.'][st - 1];
    }
    function cardsFor() {
      if (S.kind === 'line') return S.unk
        ? [['rSum', 'Sum of the given forces'], ['rUnk', `${S.unk.name} ${S.unk.sym}`], ['rDir', 'Its direction'], ['rEq', 'In equilibrium?']]
        : [['rSum', 'Net force ' + SF], ['rDir', 'Direction'], ['rEq', 'In equilibrium?']];
      if (S.kind === 'close') return [['rUser', S.ulab], ['rNet', 'Net force ' + SF], ['rMiss', 'Missing force'], ['rDir', 'Its direction']];
      if (S.kind === 'comp') return [['rSx', SFX + ' of the given forces'], ['rSy', SFY + ' of the given forces'], ['rU', S.unk.sym ? S.unk.sym : 'Missing force'], ['rDir', 'Its direction']];
      return [['rW', 'Weight <i>W</i> = <i>mg</i>'], ['rTh', 'Angle <i>θ</i> between the strings'], ['rT', 'Tension <i>T</i> in each string'], ['rV', 'Vertical part of each <i>T</i>']];
    }
    let hl = {};
    function buildCards() {
      const c = cardsFor(), el = $('readout');
      el.className = 'readout' + (c.length === 3 ? ' n3' : '');
      el.innerHTML = c.map(([id, t]) => `<div class="readout-card" id="${id}"><div class="title">${t}</div><div class="value">—</div></div>`).join('');
    }
    function setCard(id, html, cls) {
      const c = $(id); if (!c) return;
      const e = c.querySelector('.value'); if (e.innerHTML !== html) e.innerHTML = html;
      c.classList.toggle('ok', cls === 'ok'); c.classList.toggle('bad', cls === 'bad');
    }
    function readouts() {
      if (!view) return;
      const st = S.step, n = STEPS[S.kind];
      document.querySelectorAll('#readout .readout-card').forEach(c => c.classList.toggle('hl', !!hl[c.id]));
      let words = '';
      if (S.kind === 'strings') {
        const th = S.theta, i = KEY_ANGLES.indexOf(th);
        $('stepText').innerHTML = `<span class="n">θ = ${plain(th)}°</span>` + ({ 0: 'Scenario 1: both strings vertical.', 60: 'Scenario 2: the strings 60° apart.', 90: 'The strings at right angles.', 120: 'At 120° each tension equals the whole weight.', 150: 'Very wide: each string pulls mostly sideways.' }[th] || 'Your own angle.');
        $('prevStep').disabled = th <= KEY_ANGLES[0]; $('nextStep').disabled = th >= KEY_ANGLES[KEY_ANGLES.length - 1];
        const T = tension(th);
        setCard('rW', '10.0 N'); setCard('rTh', `${plain(th)}°`); setCard('rT', `${f1(T)} N`); setCard('rV', `${f1(T * Math.cos(rad(th / 2)))} N`);
        words = th < 0.5 ? 'Both strings pull straight up and share the weight equally: <i>T</i> + <i>T</i> = 10 N, so <i>T</i> = 5.0 N.'
          : `Each string pulls ${plain(th / 2)}° from the vertical, so only part of its tension holds the block up. <i>T</i> = ${f1(T)} N: ${T > 5.05 ? `greater than` : 'the same as'} the 5.0 N in scenario 1.`;
      } else {
        $('stepText').innerHTML = `<span class="n">Step ${st} of ${n}</span>${stepText()}`;
        $('prevStep').disabled = st <= 1; $('nextStep').disabled = st >= n;
      }
      if (S.kind === 'line') {
        const vals = S.forces.map(signed), tot = lineSum(), u = -tot, V = S.axis === 'v';
        const dirOf = v => (V ? (v > 0 ? 'upward' : 'downward') : (v > 0 ? 'to the right' : 'to the left'));
        const terms = vals.map(v => `(${sg(v)})`).join(' + ');
        const pre = V ? `<i>W</i> = <i>mg</i> = ${plain(-vals[0] / G)} kg × 10 m s<sup>−2</sup> = ${f1(-vals[0])} N. ` : '';
        if (S.unk) {
          setCard('rSum', st >= 3 ? `${sg(tot)} N` : '?');
          setCard('rUnk', st >= 4 ? `${f1(Math.abs(u))} N` : '?');
          setCard('rDir', st >= 4 ? (Math.abs(u) < 0.05 ? '—' : dirOf(u)) : '?');
          setCard('rEq', 'Yes: the object is in equilibrium', 'ok');
          const sym = S.unk.sym;
          words = pre + (st >= 3 ? `In equilibrium ${SF} = 0: ${terms} + ${sym} = 0` : '') + (st >= 4 ? `, so ${sym} = ${sg(u)} N: ${f1(Math.abs(u))} N ${dirOf(u)}.` : st >= 3 ? '.' : '')
            + (st >= 4 && S.v ? ' The box moves at constant velocity, so its acceleration is zero and the net force on it is zero.' : '')
            + (st >= 4 && V ? ` The tension equals the weight: <i>T</i> = ${f1(Math.abs(u))} N.` : '');
        } else {
          const ok = Math.abs(tot) < 0.05;
          setCard('rSum', st >= 4 ? `${sg(tot)} N` : '?');
          setCard('rDir', st >= 4 ? (ok ? 'none' : dirOf(tot)) : '?');
          setCard('rEq', st >= 4 ? (ok ? 'Yes' : 'No') : '?', st >= 4 ? (ok ? 'ok' : 'bad') : '');
          if (st >= 3) words = `${SF} = ${terms}` + (st >= 4 ? ` = ${sg(tot)} N` + (ok ? ': no net force acting on the object, so it is in equilibrium.' : `: a net force of ${f1(Math.abs(tot))} N ${dirOf(tot)}, so it is not in equilibrium.`) : ' = ?');
        }
      }
      if (S.kind === 'close') {
        const N = netClose(), M = missing(), closed = N.m < CLOSE_TOL;
        setCard('rUser', S.user.m > 0.05 ? `${f1(S.user.m)} N, ${f1(S.user.a)}° from +<i>x</i>` : '0 N');
        setCard('rNet', `${f1(N.m)} N`, closed ? 'ok' : 'bad');
        setCard('rMiss', st >= 4 ? `${f1(M.m)} N` : '?');
        const rel = relWords(M);
        setCard('rDir', st >= 4 ? (M.m < 0.05 ? '—' : rel || dirWords(M.x, M.y)) : '?');
        words = closed ? `Closed: the arrows join up, so ${SF} = 0 (within ${CLOSE_TOL} N). The object is in equilibrium.` : `Not closed yet: ${SF} = ${f1(N.m)} N. Drag the tip of your force (orange) until the arrows end where they started.`;
        if (st >= 4) words += M.m < 0.05 ? ' The given forces already balance: nothing is missing.' : ` The missing force: ${f1(M.m)} N, ${dirWords(M.x, M.y)}${rel ? ` (${rel})` : ''}.`;
      }
      if (S.kind === 'comp') {
        const s = sum(S.forces.map(vec)), M = missing();
        setCard('rSx', st >= 3 ? `${sg(s.x)} N` : '?'); setCard('rSy', st >= 4 ? `${sg(s.y)} N` : '?');
        setCard('rU', st >= 5 ? `${f1(M.m)} N` : '?'); setCard('rDir', st >= 6 ? dirWords(M.x, M.y) : '?');
        if (st >= 6) words = M.m < 0.05 ? 'The given forces already balance: nothing is missing.' : `${S.unk.sym ? S.unk.sym : 'The missing force'} = ${f1(M.m)} N, ${dirWords(M.x, M.y)}${relWords(M) ? ' (' + relWords(M) + ')' : ''}.`;
      }
      if ($('words').innerHTML !== words) $('words').innerHTML = words;
      const w = work(); if (w !== lastWork) { $('work').innerHTML = w; lastWork = w; }
    }
    // the working under the drawing, written out as on paper
    let lastWork = '';
    const num = v => { const t = f1(v); return t.startsWith('−') ? '(' + t + ')' : t; };
    const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
    function work() {
      const st = S.step;
      if (S.kind === 'strings') {
        const th = S.theta, T = tension(th), h = plain(th / 2);
        if (th < 0.5) return `<div class="math"><div class="eq">Vertical: <i>T</i> + <i>T</i> = <i>W</i>, so 2<i>T</i> = 10 N and <i>T</i> = ${frac('10', '2')} = <b>5.0 N</b></div></div>`;
        return `<div class="math"><div class="eq">Each string makes ${frac('<i>θ</i>', '2')} = ${h}° with the vertical.</div>`
          + `<div class="eq">Vertical: <i>T</i> cos ${h}° + <i>T</i> cos ${h}° = <i>W</i>, so 2<i>T</i> cos ${h}° = 10 N and <i>T</i> = ${frac('10', `2 × cos ${h}°`)} = <b>${f1(T)} N</b></div>`
          + `<div class="eq">Horizontal: −<i>T</i> sin ${h}° + <i>T</i> sin ${h}° = 0: the horizontal parts cancel.</div></div>`;
      }
      if (S.kind !== 'comp') return '';
      const fs = S.forces, s = sum(fs.map(vec)), M = missing();
      const cell = v => (st >= 2 ? `${sg(v)} N` : '');
      let h = '<table><thead><tr><th>Force</th><th>' + FX + '</th><th>' + FY + '</th></tr></thead><tbody>';
      fs.forEach(f => { const v = vec(f); h += `<tr${st === 2 ? ' class="lit"' : ''}><td>${LAB[f.k]} = ${plain(f.m)} N</td><td>${cell(v.x)}</td><td>${cell(v.y)}</td></tr>`; });
      h += `<tr class="unk"><td>${S.unk.sym ? S.unk.sym : 'Missing force'}${st >= 5 ? ' = ' + f1(M.m) + ' N' : ''}</td><td>${st >= 3 ? sg(M.x) + ' N' : '?'}</td><td>${st >= 4 ? sg(M.y) + ' N' : '?'}</td></tr>`;
      h += `<tr class="total"><td>Sum (in equilibrium)</td><td>${st >= 3 ? '0 N' : ''}</td><td>${st >= 4 ? '0 N' : ''}</td></tr></tbody></table>`;
      h += '<div class="math">';
      if (st >= 2) fs.forEach(f => { h += `<div class="eq">${compWork(f, 'x')},&nbsp;&nbsp; ${compWork(f, 'y')}</div>`; });
      if (st >= 3) h += `<div class="eq">${SFX} = 0: ${fs.map(f => num(vec(f).x)).join(' + ')} + ${uComp('x')} = 0, so ${uComp('x')} = <b>${sg(M.x)} N</b></div>`;
      if (st >= 4) h += `<div class="eq">${SFY} = 0: ${fs.map(f => num(vec(f).y)).join(' + ')} + ${uComp('y')} = 0, so ${uComp('y')} = <b>${sg(M.y)} N</b></div>`;
      if (st >= 5) h += `<div class="eq">${S.unk.sym || 'Missing force'} = <span class="root"><i class="rs">&radic;</i><span>${num(M.x)}<sup>2</sup> + ${num(M.y)}<sup>2</sup></span></span> = <b>${f1(M.m)} N</b></div>`;
      if (st >= 6) {
        if (M.m < 0.05) h += '<div class="eq">The given forces already balance: there is no missing force.</div>';
        else if (!clean(M.x) || !clean(M.y)) h += `<div class="eq">It points <b>${dirWords(M.x, M.y)}</b>.</div>`;
        else {
          const al = deg(Math.atan2(Math.abs(M.y), Math.abs(M.x)));
          h += `<div class="eq">tan <i>θ</i> = ${frac(f1(Math.abs(M.y)), f1(Math.abs(M.x)))}, so <i>θ</i> = <b>${f1(al)}°</b></div>`;
          h += `<div class="eq">Its <i>x</i>-component is ${M.x > 0 ? 'positive (right)' : 'negative (left)'} and its <i>y</i>-component is ${M.y > 0 ? 'positive (up)' : 'negative (down)'}, so it points <b>${dirWords(M.x, M.y)}</b>.</div>`;
        }
      }
      return h + '</div>';
    }
    function update() { draw(); readouts(); syncInputs(); }

    /* ---------------- steps and the scenario menu ---------------- */
    function setStep(n) { S.step = Math.max(1, Math.min(STEPS[S.kind], n)); clearFeat(); update(); }
    function stepAngle(d) {
      const th = S.theta, next = d > 0 ? KEY_ANGLES.find(a => a > th + 1e-9) : [...KEY_ANGLES].reverse().find(a => a < th - 1e-9);
      if (next === undefined) return;
      S.theta = next; clearFeat();
      const id = next === 0 ? 's1' : next === 60 ? 's2' : null;
      if (id && S.scen !== id && (S.scen === 'custom' || S.scen === 's1' || S.scen === 's2')) { S.scen = id; presetEl.value = id; $('question').style.minHeight = ''; $('question').innerHTML = PRESETS[id].q; }
      else if (!id) toCustom();
      update();
    }
    $('prevStep').addEventListener('click', () => (S.kind === 'strings' ? stepAngle(-1) : setStep(S.step - 1)));
    $('nextStep').addEventListener('click', () => (S.kind === 'strings' ? stepAngle(1) : setStep(S.step + 1)));
    // Reset: back to step 1 of the scenario last chosen from the menu, with its own values
    $('resetBtn').addEventListener('click', () => { const id = S.base || TABS[currentTab].presets[0]; presetEl.value = id; chooseScenario(id); });
    presetEl.addEventListener('change', () => chooseScenario(presetEl.value));
    function stepButtons() {
      const str = S.kind === 'strings';
      $('stepsLabel').textContent = str ? 'Key angles' : 'Steps';
      $('prevStep').innerHTML = str ? '&lsaquo; Smaller angle' : '&lsaquo; Previous step';
      $('nextStep').innerHTML = str ? 'Larger angle &rsaquo;' : 'Next step &rsaquo;';
    }
    function chooseScenario(id) {
      loadScenario(id);
      const sc = $('scene');
      sc.classList.toggle('short', S.kind === 'line' && S.axis === 'h');
      sc.classList.toggle('tall', S.kind === 'close' || S.kind === 'strings');
      buildCards(); forceInputs(); clearFeat(); stepButtons();
      update(); // at once: a step line or scale left stale for a frame is wrong for whatever reads it next
    }

    /* ---------------- dragging the arrowheads ---------------- */
    function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function pick(p) {
      let best = null, bd = 24;
      for (const h of handles) { const d = Math.hypot(p.x - h.x, p.y - h.y); if (d < bd) { bd = d; best = h.k; } }
      return best;
    }
    canvas.addEventListener('pointerdown', e => {
      const k = pick(pos(e)); if (k === null) return;
      dragging = { k }; canvas.setPointerCapture(e.pointerId); e.preventDefault();
    });
    canvas.addEventListener('pointermove', e => {
      const p = pos(e);
      if (!dragging) { canvas.style.cursor = pick(p) !== null ? 'grab' : 'default'; return; }
      canvas.style.cursor = 'grabbing';
      const q = { x: Math.max(4, Math.min(view.W - 4, p.x)), y: Math.max(4, Math.min(view.H - 4, p.y)) };
      const k = dragging.k;
      if (S.kind === 'line') {
        const f = S.forces[k], V = S.axis === 'v', h = handles.find(x => x.k === k);
        if (!h) return;
        const C = V ? { ox: Math.round(view.W * 0.3), oy: Math.round(view.H / 2) } : { ox: Math.round(view.W / 2), oy: Math.round(Math.min(92, view.H * 0.3)) };
        const edge = V ? view.half : view.half;
        const d = V ? C.oy - q.y : q.x - C.ox;
        const out = Math.max(0, Math.abs(d) - edge) / view.s;
        f.m = Math.min(1000, Math.round(out * 2) / 2);
        if (!f.fix) f.a = V ? (d < 0 ? 270 : 90) : (d < 0 ? 180 : 0);
      } else if (S.kind === 'close') {
        const [L, R] = view.O;
        let wx, wy;
        if (k === 'uL') { wx = (q.x - L.ox) / view.s; wy = (L.oy - q.y) / view.s; }
        else { const e2 = sum(S.forces.map(vec)); wx = (q.x - R.ox) / view.s - e2.x; wy = (R.oy - q.y) / view.s - e2.y; }
        if (!S.lock) S.user.m = Math.min(200, Math.round(Math.hypot(wx, wy) * 2) / 2);
        if (Math.hypot(wx, wy) > 0.2) S.user.a = norm(Math.round(deg(Math.atan2(wy, wx))));
      } else if (S.kind === 'comp') {
        const o = view.O[0], f = S.forces[k], wx = (q.x - o.ox) / view.s, wy = (o.oy - q.y) / view.s;
        f.m = Math.min(200, Math.round(Math.hypot(wx, wy) * 2) / 2);
        if (f.m > 0) f.a = norm(Math.round(deg(Math.atan2(wy, wx))));
        f.ref = 'x';
      } else if (S.kind === 'strings') {
        // the angle from the vertical is half the angle between the strings
        const L = view.panes[0], cx = L.x + L.w / 2, h = handles.find(x => x.k === k);
        const base = h ? { x: cx, y: h.y + tension(S.theta) * Math.cos(rad(S.theta / 2)) * view.s } : { x: cx, y: q.y + 40 };
        const dx = Math.abs(q.x - base.x), dy = Math.max(1, base.y - q.y);
        S.theta = Math.max(0, Math.min(150, Math.round(2 * deg(Math.atan2(dx, dy)))));
        dragging.base = base;
      }
      toCustom(); update();
    });
    const endDrag = () => { if (dragging) { dragging = null; update(); } };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---------------- the tabs ---------------- */
    const TABS = {
      1: { strip: 'Answer Predict first. Then press Next step to add the forces along the line, one step at a time, or drag an arrowhead to change a force.',
        presets: ['p313', 'a3', 'b5'], hint: 'Drag an arrowhead to change a force. Drag it past the object to turn it round.',
        key: [['#2563eb', 'Given forces'], ['#d97706', 'Unknown force'], ['#dc2626', 'Net force ΣF']],
        notes: ['When the net force acting on an object is zero, we say the object is in equilibrium (notes p. 3-13).', 'Right and up are positive; left and down are negative (p. 3-57).', 'An object in equilibrium is either at rest or moving at constant velocity (p. 3-19).'] },
      2: { strip: 'Answer Predict first. Then drag the tip of your force (orange) until the arrows close up, and press Next step to see the method.',
        presets: ['ex3', 'ex4', 'b1'], hint: 'Drag the orange arrowhead in either drawing, or type its value.',

    let feat = {}, predictPick = null;
    function clearFeat() { feat = {}; hl = {}; S.showComp = false; S.showRes = false; syncFeatButtons(); $('featNote').textContent = ''; }

    // a key feature shows itself on the drawing: it picks the scenario (if needed) and the step that show it
    function tapFeat(id) {
      const on = !feat[id];
      const want = scen => { if (S.base === scen && S.scen === scen) return; presetEl.value = scen; chooseScenario(scen); };
      clearFeat();
      if (on) {
        ({
          sign: () => { want('p313'); S.step = 2; },
          zero: () => { want('p313'); S.step = 4; hl = { rSum: true, rEq: true }; },
          motion: () => { want('a3'); S.step = 4; hl = { rUnk: true }; },
          weight: () => { want('b5'); S.step = 4; hl = { rUnk: true }; },
          chain: () => { want('ex4'); S.step = 2; },
          gap: () => { want('ex4'); S.step = 3; },
          closed: () => { want('ex4'); const M = missing(); S.user.m = M.m; S.user.a = M.a; S.step = 4; hl = { rNet: true }; },

          hparts: () => { want('s2'); S.showComp = true; },
          wide: () => { want('s2'); S.theta = 120; toCustom(); hl = { rT: true }; }

      feat = on ? { [id]: true } : {};

    function featNote(id) {
      const M = missing();
      switch (id) {
        case 'sign': return 'A force acting to the right or upward is positive; a force acting to the left or downward is negative. The magnitude itself is always positive: the sign only gives the direction (notes p. 3-57).';
        case 'zero': { const v = S.forces.map(signed), t = lineSum(); return `Resultant force = ${v.map(x => '(' + sg(x) + ')').join(' + ')} = ${sg(t)} N. ` + (Math.abs(t) < 0.05 ? 'No net force acting on the object: the forces are balanced and the object is in equilibrium (notes p. 3-13).' : 'Not zero, so these forces are not balanced.'); }
        case 'motion': return 'The box moves, yet the net force on it is zero. When an object is at rest or moving at constant velocity, the acceleration is zero, the net force is zero and the forces are balanced (notes p. 3-47). So the frictional force equals the 30 N push.';
        case 'weight': { const W = S.forces[0].m; return `The object hangs at rest, so the forces on it are balanced: the tension up equals the weight down. <i>W</i> = <i>mg</i> = ${plain(W / G)} × 10 = ${f1(W)} N, so <i>T</i> = ${f1(W)} N.`; }
        case 'chain': return 'The given forces drawn one after another: the tail of each force at the tip of the one before (notes p. 3-24). Each force keeps its length and its direction; it has only moved.';
        case 'gap': return 'If the forces were balanced, the last tip would land back on the start. It does not, so there is a gap. The missing force must fill it: it runs from the last tip back to the start.';
        case 'closed': return `Your force is now ${f1(S.user.m)} N, ${dirWords(userVec().x, userVec().y)}. The arrows end where they started, so Σ<i>F</i> = 0 and the object is in equilibrium.`;
        case 'opposite': return `The resultant of the 30 N and 40 N forces (grey, from the start to the last tip) is ${f1(M.m)} N. The missing force (purple) is equal in size and opposite in direction: ${f1(M.m)} N, ${relWords(M)}.`;
        case 'table': return 'Steps 1 and 2: a table with a row for each force, each broken into ' + FX + ' and ' + FY + ' with its sign. The missing force has a row too; its cells are still unknown.';
        case 'sumzero': { const s = sum(S.forces.map(vec)); return `The pole is in equilibrium, so each column of the table adds to zero. The given forces add to ${SFX} = ${sg(s.x)} N and ${SFY} = ${sg(s.y)} N, so ${uComp('x')} = ${sg(M.x)} N and ${uComp('y')} = ${sg(M.y)} N.`; }
        case 'pyth': return `Its two components are at right angles, so ${uName()} = √(${num(M.x)}² + ${num(M.y)}²) = ${f1(M.m)} N (Pythagoras’ theorem).`;
        case 'tan': return `tan <i>θ</i> = ${f1(Math.abs(M.y))} ÷ ${f1(Math.abs(M.x))} gives the angle with the horizontal. Then read the direction from the signs of the components: it points ${dirWords(M.x, M.y)}.`;
        case 'vertical': return 'Scenario 1: the 1 kg block has a weight of <i>mg</i> = 1 × 10 = 10 N. Both strings pull straight up and share it equally, so each tension is 5 N.';
        case 'vparts': { const T = tension(S.theta); return `Resolve each tension. Its vertical part is <i>T</i> cos ${plain(S.theta / 2)}° = ${f1(T * Math.cos(rad(S.theta / 2)))} N, and the two vertical parts add to the 10 N weight. So each <i>T</i> (${f1(T)} N) is larger than 5 N.`; }
        case 'hparts': { const T = tension(S.theta); return `The horizontal parts, <i>T</i> sin ${plain(S.theta / 2)}° = ${f1(T * Math.sin(rad(S.theta / 2)))} N each, point in opposite directions and cancel. They hold nothing up, which is why the tension must be larger than in scenario 1.`; }
        case 'wide': return `At ${plain(S.theta)}° each tension is ${f1(tension(S.theta))} N: as large as the whole weight. At 150° it is ${f1(tension(150))} N. The wider the angle, the smaller the vertical part of each tension, so the larger each tension must be.`;
      }
      return '';
    }

    function renderPredict(tab) {

      $('predictQ').innerHTML = P.q;

      const opts = $('predictOpts');

      P.opts.forEach((o, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.innerHTML = o;

          if (opts.dataset.done) return;
          predictPick = i; opts.querySelectorAll('.opt').forEach((x, j) => x.classList.toggle('picked', j === i));

      $('predictCheck').textContent = 'Check my answer';

      if (opts.dataset.done) { renderPredict(currentTab); return; }
      if (predictPick === null) { fb.innerHTML = '<span class="verdict no">Pick an answer first.</span>'; return; }
      opts.dataset.done = '1';
      const ok = predictPick === P.ans;
      opts.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === P.ans) x.classList.add('right'); else if (j === predictPick) x.classList.add('wrong'); });
      // the options fold away: the result line names the pick (and the right answer), then the explanation
      $('predictBox').classList.add('done');
      fb.innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> Your prediction: ${P.opts[predictPick]}.`
        + (ok ? '' : ` The answer: <b>${P.opts[P.ans]}</b>.`) + ` <span class="why">${P.why}</span>`;
      $('predictCheck').textContent = 'Try again';
    });

        return;
      }
      const Q = QUIZ[quiz.i], many = Q.parts.length > 1;
      quiz.picks = Q.parts.map(() => null);
      el.innerHTML = `<div class="quiz-top"><span>Question ${quiz.i + 1} of ${N}</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div>
        <div class="quiz-bar"><i style="width:${(quiz.i / N) * 100}%"></i></div>
        ${Q.stem ? `<div class="quiz-q" id="qStem">${Q.stem}</div>` : ''}<div class="quiz-src">${Q.src}${many ? ` · ${Q.parts.length} parts, answer them all` : ''}</div>
        ${Q.parts.map((P, k) => `<div class="qpart" data-k="${k}">
          <div class="${Q.stem ? 'qpart-q' : 'quiz-q'}">${partLabel(Q, k)}${P.q}</div>
          <div class="opts">${P.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
          <div class="feedback"></div></div>`).join('')}
        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;
          quiz.picks[k] = +b.dataset.j; part.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b));
        }));
      });
      $('qReset').addEventListener('click', resetQuiz);
      $('qSubmit').addEventListener('click', () => {
        const fb = $('qFb');
        if (quiz.done) { quiz.i++; quiz.done = false; renderQuiz(); return; }
        const left = quiz.picks.map((p, k) => p === null ? partLabel(Q, k).trim() || `part ${k + 1}` : null).filter(x => x !== null);
        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }
        quiz.done = true; fb.innerHTML = '';
        el.querySelectorAll('.qpart').forEach(part => {
          const k = +part.dataset.k, P = Q.parts[k], ok = quiz.picks[k] === P.ans;
          if (ok) quiz.score++; else quiz.missed.push([quiz.i, k]);
          part.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === P.ans) x.classList.add('right'); else if (j === quiz.picks[k]) x.classList.add('wrong'); });
          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${P.why}</span>`;
        });
        el.querySelector('.quiz-top span:last-child').textContent = `Score: ${quiz.score} of ${QUIZ_MARKS}`;
        $('qSubmit').textContent = quiz.i + 1 < N ? 'Next question' : 'See the summary';
      });
    }

    /* ---------------- Teacher mode ---------------- */
    // Only the teacher link (this page's address + ?teacher) shows the button; students and the
    // Brightspace embed use the plain address. Not a lock: the panel only changes this screen.
    const teacher = $('teacher');
    if (new URLSearchParams(location.search).has('teacher')) $('teacherBtn').hidden = false;
    $('teacherBtn').addEventListener('click', () => { teacher.hidden = !teacher.hidden; });
    $('tClose').addEventListener('click', () => { teacher.hidden = true; });
    $('tExplain').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-explain');
      e.target.textContent = on ? 'Show explanations' : 'Hide explanations'; e.target.classList.toggle('on', on);
    });
    $('tAnswers').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-answers');
      e.target.textContent = on ? 'Show answer labels' : 'Hide answer labels'; e.target.classList.toggle('on', on);
    });
    // free exploration: every step shown at once, no Predict first
    $('tFree').addEventListener('click', e => {
      freeMode = !freeMode; document.body.classList.toggle('free-mode', freeMode);
      e.target.textContent = freeMode ? 'Back to the guided steps' : 'Switch to free exploration'; e.target.classList.toggle('on', freeMode);
      showTab(currentTab);
    });
    const fullBtn = $('tFull');
    if (!document.fullscreenEnabled) fullBtn.hidden = true;
    fullBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
    $('tReset').addEventListener('click', () => { resetQuiz(); showTab(1); });

    window.addEventListener('resize', () => { if (currentTab <= 4) { view = null; update(); } });
    showTab(1);
  </script>
  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),
    // and a touch the page grabbed for a drag (its own setPointerCapture call) keeps the page still.
    // (hasPointerCapture can't tell: a touch is always captured implicitly.)
    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
