    <h3>Suggested prompts</h3>
    <ul id="tPrompts"></ul>
  </aside>

  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), graphCv = $('graph'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const K = 8.99e9;      // Coulomb's constant k, N m^2 C^-2 (notes p. 6-17)
    const EC = 1.60e-19;   // the size of the charge on an electron or a proton, C (notes p. 6-4)
    // Coulomb's law (notes p. 6-17), the one place it is written: + means the charges repel
    const coulomb = (q1, q2, r) => K * q1 * q2 / (r * r);
    const G = 10;          // g = 10 m s^-2 (tab 2's hanging balls)
    const clean = v => (Math.abs(v) < 1e-300 ? 0 : v);
    // 3 significant figures, as the lecturer's copy gives them; exact whole numbers stay whole; an exact value keeps
    // its own figures; a 1e-12 nudge so a binary half rounds up; a true minus sign
    const f3 = v => {
      const x = clean(v);
      if (Math.abs(x - Math.round(x)) < 1e-9 * Math.max(1, Math.abs(x))) return String(Math.round(x)).replace('-', '−');
      const t = (x * (1 + 1e-12)).toPrecision(3);
      if (Math.abs(+t - x) < 1e-12 * Math.max(1, Math.abs(x)) || Math.abs(x) >= 100) return String(+t).replace('-', '−');
      return t.replace('-', '−');
    };
    const ex = e => `10<sup>${String(e).replace('-', '−')}</sup>`;
    // a number in 3 significant figures; very large or very small ones as a × 10^n, like the notes
    function num(v, sf = 3) {
      const x = clean(v); if (x === 0) return '0';
      const a = Math.abs(x); let e = Math.floor(Math.log10(a) + 1e-12);
      if (e >= -2 && e <= 3) return sf === 3 ? f3(x) : (x * (1 + 1e-12)).toPrecision(sf).replace('-', '−');
      let m = (a / Math.pow(10, e) * (1 + 1e-12)).toPrecision(sf);
      if (+m >= 10) { e++; m = (a / Math.pow(10, e) * (1 + 1e-12)).toPrecision(sf); }
      if (e === 0) return (x < 0 ? '−' : '') + m;
      return `${x < 0 ? '−' : ''}${m} × ${ex(e)}`;
    }
    const sgn = v => (v > 0 ? '+' : '') + num(v);          // a charge keeps its sign: +2.40 × 10^-13
    const C_ = v => `${sgn(v)} C`;
    const N_ = v => `${num(v)} N`;
    const plain = v => String(+(+v).toFixed(4)).replace('-', '−');
    // a value in an input box: big and small ones in calculator form (1.5e6)
    const inTxt = v => { const a = Math.abs(v); return a !== 0 && (a >= 1e5 || a < 1e-3) ? (+v).toExponential().replace('e+', 'e') : String(+(+v).toFixed(4)); };
    const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
    const rt = s => `<span class="root"><i class="rs">&radic;</i><span>${s}</span></span>`;
    const ECtxt = `1.60 × ${ex(-19)}`;
    const COL = { pos: '#22c55e', posD: '#15803d', neg: '#facc15', negD: '#a16207', neu: '#e2e8f0', neuD: '#64748b', force: '#dc2626', line: '#2563eb', extra: '#dc2626' };

    /* ---------------- scenarios (every number from the notes, the lecturer's copy or Tutorial 6) ---------------- */
    // tab 1: particle (p protons, nn neutrons, e electrons); given (charged to Q, find the electrons);
    //        excess (N electrons added to a charge Q0); transfer (N electrons moved from A to B)
    // tab 2: two balls hanging from threads, charges q1, q2 in units of 10^-8 C
    // tab 3: find F from Q1, Q2, r; or find Q from F, r (ratio = Q_A ÷ Q_B)
    // tab 4: point charges in µC, positions in cm from the middle; plates; a small charge at P
    const PRESETS = {
      he: { tab: 1, kind: 'particle', name: 'Helium atom', p: 2, nn: 2, e: 2, title: 'A helium atom',
        q: 'Notes pp. 6-3 to 6-5: An atom is made up of protons (positive charge), neutrons (no charge) and electrons (negative charge). When an object has equal numbers of protons and electrons, it is electrically neutral or uncharged. The helium atom has 2 protons, 2 neutrons and 2 electrons.' },
      ex1: { tab: 1, kind: 'given', name: 'Charged to +14 C', Q: 14, txt: { Q: '+14' }, title: 'An object charged to +14 C',
        q: 'Example 1 (notes p. 6-6): (a) An object is charged to +14 Coulombs, calculate the number of electrons lost. (b) What if the object is charged to −14 Coulombs, calculate the number of electrons gained. (Type −14 for part (b).)' },
      ex2: { tab: 1, kind: 'particle', name: '14 protons, 16 electrons', p: 14, nn: 0, e: 16, title: 'A particle',
        q: 'Example 2 (p. 6-7): A particle has 14 protons and 16 electrons. (a) What is the charge of the particle? Positive, negative or neutral? (b) Calculate the charge of the particle.' },
      ex3: { tab: 1, kind: 'excess', name: '10⁶ extra electrons', Q0: 0, n: 1e6, txt: { Q0: '0', n: ex(6) }, title: 'An object with extra electrons',
        q: 'Example 3 (p. 6-8): If an object has an excess of 10⁶ electrons, what is the electric charge on the object? (This page starts the object neutral and adds the 10⁶ electrons.)' },
      ex4: { tab: 1, kind: 'transfer', name: 'Electrons moved from A to B', n: 1.5e6, txt: { n: `1.5 × ${ex(6)}` }, title: 'Objects A and B',
        q: 'Example 4 (p. 6-9): Objects A and B are electrically neutral. If 1.5 million electrons are transferred from A to B, what is the final electric charge on each object?' },
      ex5: { tab: 1, kind: 'excess', name: '+1.00 C, then 6 electrons added', Q0: 1, n: 6, txt: { Q0: '+1.00', n: '6' }, title: 'An object of charge +1.00 C',
        q: 'Example 5 (p. 6-10): If 6 electrons are added to an object of charge +1.00 C, the final charge on the object is approximately (A) −5.00 C (B) +5.00 C (C) +7.00 C (D) +1.00 C' },

      pp: { tab: 2, kind: 'balls', name: 'Two positive charges', q1: 6, q2: 6,
        q: 'Notes p. 6-11: When charged objects are brought close together, they exert equal and opposite forces on each other. Like charges repel each other. (Values chosen for this page: two 1.0 g balls on 0.20 m threads, hung 10 cm apart, each with a charge of +6.0 × 10⁻⁸ C.)' },
      pn: { tab: 2, kind: 'balls', name: 'A negative and a positive charge', q1: -1.8, q2: 1.8,
        q: 'Notes p. 6-11: Unlike charges attract each other. (Values chosen for this page: −1.8 × 10⁻⁸ C and +1.8 × 10⁻⁸ C on the same balls. Assume the balls never touch, as Tutorial 6 B4 does.)' },
      nn: { tab: 2, kind: 'balls', name: 'Two negative charges', q1: -6, q2: -6,
        q: 'Like charges repel each other, whether both are positive or both are negative. (Values chosen for this page: −6.0 × 10⁻⁸ C on each ball.)' },
      uneq: { tab: 2, kind: 'balls', name: 'Unequal charges: +9.0 and +4.0', q1: 9, q2: 4,
        q: 'One ball carries more charge than the other: +9.0 × 10⁻⁸ C and +4.0 × 10⁻⁸ C. Which ball feels the larger force? (Values chosen for this page.)' },

      ex6: { tab: 3, kind: 'coul', find: 'F', q1: 1, q2: -1, r: 1e-3, unit: 'mm', uf: 1e-3, qExp: 0, txt: { q1: '+1.00', q2: '−1.00', r: '1.00' },
        q: 'Example 6 (notes p. 6-18): Two point charges +1.00 C and −1.00 C are separated by 1.00 mm. Find the magnitude of the attractive electric force that each charge exerts on the other.' },
      ex7: { tab: 3, kind: 'coul', find: 'Q', F: 3, r: 3e-3, ratio: 1, unit: 'mm', uf: 1e-3, txt: { F: '3', r: '3.00' },
        q: 'Example 7 (p. 6-19): Two similar point charges are separated by 3.00 mm. Find the magnitude of each point charge if each charge exerts a force of 3 N on each other.' },
      a4: { tab: 3, kind: 'coul', find: 'F', q1: 6e-11, q2: -6e-11, r: 0.2, unit: 'cm', uf: 1e-2, qExp: -11, txt: { q1: '+6.00', q2: '−6.00', r: '20.0' },
        q: 'Tutorial 6, A4: Two small balls of net charges +6.00 × 10⁻¹¹ C and −6.00 × 10⁻¹¹ C are separated by 20.0 cm. Calculate the magnitude of the electric force that they exert on each other.' },
      c1: { tab: 3, kind: 'coul', find: 'F', q1: 1.6e-19, q2: 1.6e-19, r: 2e-15, unit: '× 10⁻¹⁵ m', unitH: `× ${ex(-15)} m`, uf: 1e-15, qExp: -19, mass: 1.67e-27, txt: { q1: '+1.60', q2: '+1.60', r: '2.00' },
        q: 'Tutorial 6, C1: Two protons in the nucleus of an atom are at a distance of 2.00 × 10⁻¹⁵ m from each other. Treat the protons as point charges. (a) Calculate the magnitude of the electric force that they exert on each other. (b) What would be the acceleration of each proton if this were the only force acting on them? Given the mass of a proton = 1.67 × 10⁻²⁷ kg.' },
      c2: { tab: 3, kind: 'coul', find: 'Q', F: 1, r: 3, ratio: 10, unit: 'm', uf: 1, txt: { F: '1.00', r: '3.00' },
        q: 'Tutorial 6, C2: Two point charges A and B are separated by a distance of 3.00 m. Each exerts an electric force of 1.00 N on the other. If A carries 10 times as much electric charge as B, what is the magnitude of charge on B?' },

      pos: { tab: 4, kind: 'field', name: 'A positive point charge', charges: [{ dx: 0, dy: 0, q: 1 }],
        q: 'Electric field (lecturer’s slides, p. 8-33): An electric field is a region in which an electric charge experiences an electric force when placed in the field. It is represented graphically by electric field lines.' },
      neg: { tab: 4, kind: 'field', name: 'A negative point charge', charges: [{ dx: 0, dy: 0, q: -1 }],
        q: 'Electric field lines produced by a negative point charge (lecturer’s slides, p. 8-33).' },
      opp: { tab: 4, kind: 'field', name: 'Equal and opposite charges', charges: [{ dx: -5, dy: 0, q: 1 }, { dx: 5, dy: 0, q: -1 }],
        q: 'Field lines of two equal and opposite charges placed close together (lecturer’s slides, p. 8-34).' },
      nn4: { tab: 4, kind: 'field', name: 'Two equal negative charges', charges: [{ dx: -5, dy: 0, q: -1 }, { dx: 5, dy: 0, q: -1 }],
        q: 'Example 12 (lecturer’s slides, p. 8-39): Draw the electric field lines for the two charges (−q and −q). Put an X if there is a neutral point with no electric force.' },
      un4: { tab: 4, kind: 'field', name: 'Charges +2 µC and −1 µC', charges: [{ dx: -5, dy: 0, q: 2 }, { dx: 5, dy: 0, q: -1 }],
        q: 'The number of field lines drawn is proportional to the magnitude of the charge (lecturer’s slides, p. 8-35, point 3). (Values chosen for this page: +2 µC and −1 µC.)' },
      plates: { tab: 4, kind: 'plates', name: 'Between two charged plates',
        q: 'Example 10 (lecturer’s slides, p. 8-37): Sketch the electric field between the positive and negative plates.' },
      ex11: { tab: 4, kind: 'field', name: 'A charge at P, beside a + charge', charges: [{ dx: -4, dy: 0, q: 1 }], probe: { dx: 5, dy: 0 }, showP: true, pSign: 1,
        q: 'Example 11 (lecturer’s slides, p. 8-38): Which direction will a charge at P move (a) if the charge is positive? (b) if the charge is negative? (Switch the charge at P to negative for part (b).)' }
    };
    const OWN = 'Your own values. Choose a scenario from the menu to go back to an example from the notes.';

    /* ---------------- the state ---------------- */
    let S = { scen: 'he', custom: false, step: 0 };
    let P = {};            // the scenario in use (a copy, changed by the inputs and the drags)
    let hl = {}, feat = {};
    const gv = (k, f) => (!S.custom && P.txt && P.txt[k] !== undefined ? P.txt[k] : f(P[k])); // a value as the notes write it
    const isRun = () => currentTab === 2;
    const isSteps = () => currentTab === 1 || currentTab === 3;

    /* ---------------- tab 1: charge and the atom (a step walk) ---------------- */
    function t1Values() {
      if (P.kind === 'particle') { const d = P.e - P.p; return { d, Q: -d * EC }; }
      if (P.kind === 'given') return { N: Math.abs(P.Q) / EC };
      if (P.kind === 'excess') { const Qe = -P.n * EC; return { Qe, Q: P.Q0 + Qe }; }
      return { Qe: -P.n * EC, QA: P.n * EC, QB: -P.n * EC };
    }
    function t1Steps() {
      const V = t1Values(), L = [];
      if (P.kind === 'particle') {
        L.push(`Protons: ${P.p}. Each proton carries +${ECtxt} C.`);
        L.push(`Electrons: ${P.e}. Each electron carries −${ECtxt} C.`);
        if (V.d > 0) L.push(`More electrons than protons (${P.e} &gt; ${P.p}), so the particle is negatively charged.`);
        else if (V.d < 0) L.push(`Fewer electrons than protons (${P.e} &lt; ${P.p}), so the particle is positively charged.`);
        else L.push(`Equal numbers of protons and electrons (${P.p} and ${P.e}), so it is electrically neutral (uncharged).`);
        if (V.d > 0) L.push({ h: `There ${V.d === 1 ? 'is 1 more electron' : `are ${V.d} more electrons`}: <i>Q</i> = <i>Ne</i> = ${V.d} × (−${ECtxt}) = ${C_(V.Q)}`, lit: true });
        else if (V.d < 0) L.push({ h: `There ${V.d === -1 ? 'is 1 electron' : `are ${-V.d} electrons`} fewer: <i>Q</i> = <i>Ne</i> = ${-V.d} × (+${ECtxt}) = ${C_(V.Q)}`, lit: true });
        else L.push({ h: 'The charges cancel: <i>Q</i> = 0 C', lit: true });
        return L;
      }
      if (P.kind === 'given') {
        if (P.Q === 0) return [{ h: 'The object is uncharged: no electrons were lost or gained.', lit: true }];
        const lost = P.Q > 0;
        L.push(lost ? 'Positive charge means electrons have been lost.' : 'Negative charge means electrons have been gained.');
        L.push('<i>Q</i> = <i>Ne</i> (the sign is not needed: we want the number of electrons)');
        L.push({ h: `Number of electrons ${lost ? 'lost' : 'gained'} = ${frac(String(gv('Q', plain)).replace(/^[+−-]/, ''), ECtxt)} = ${num(V.N)}`, lit: true });
        return L;
      }
      if (P.kind === 'excess') {
        const nT = gv('n', num);
        L.push(`Charge of ${nT} electron${P.n === 1 ? '' : 's'} = ${nT} × (−${ECtxt}) = ${C_(V.Qe)}`);
        if (P.Q0 === 0) L.push({ h: `The object started neutral, so its charge is ${C_(V.Q)}`, lit: true });
        else if (Math.abs(V.Qe) < 1e-6 * Math.abs(P.Q0)) L.push({ h: `Final charge = ${gv('Q0', sgn)} − ${num(-V.Qe)} ≈ ${gv('Q0', sgn)} C: far too small a change to see`, lit: true });
        else L.push({ h: `Final charge = ${gv('Q0', sgn)} + (${num(V.Qe)}) = ${C_(V.Q)}`, lit: true });
        return L;
      }
      const nT = gv('n', num);
      L.push(`Charge of ${nT} electrons = (${nT}) × (−${ECtxt}) = ${C_(V.Qe)}`);
      L.push({ h: `A lost them: charge on A = ${C_(V.QA)}`, lit: true });
      L.push({ h: `B gained them: charge on B = ${C_(V.QB)}`, lit: true });
      return L;
    }

    /* ---------------- tab 2: two charged balls hanging from threads (RK4) ---------------- */
    const BM = 0.001, BL = 0.20, BD = 0.10;  // each ball 1.0 g, threads 0.20 m, pivots 10 cm apart (values chosen for this page)
    const BDAMP = 4;       // air resistance on the swing (1/s), so the balls come to rest
    const BR = 0.005;      // ball radius 0.5 cm: closer than 1 cm, the balls touch
    const DT2 = 0.0005, RUN2 = 6;
    const sim = { t: 0, running: false, last: null };
    let traj = null;
    function deriv2(s) {
      const [t1, w1, t2, w2] = s, q1 = P.q1 * 1e-8, q2 = P.q2 * 1e-8;
      const x1 = -BD / 2 + BL * Math.sin(t1), y1 = -BL * Math.cos(t1), x2 = BD / 2 + BL * Math.sin(t2), y2 = -BL * Math.cos(t2);
      const dx = x2 - x1, dy = y2 - y1, r = Math.hypot(dx, dy);
      const Fm = coulomb(q1, q2, r);                   // + pushes them apart
      const fx2 = Fm * dx / r, fy2 = Fm * dy / r;      // on ball 2; on ball 1 the opposite (Newton's third law)
      const a1 = (-BM * G * Math.sin(t1) - (fx2 * Math.cos(t1) + fy2 * Math.sin(t1))) / (BM * BL) - BDAMP * w1;
      const a2 = (-BM * G * Math.sin(t2) + (fx2 * Math.cos(t2) + fy2 * Math.sin(t2))) / (BM * BL) - BDAMP * w2;
      return [w1, a1, w2, a2];
    }
    function rk4(s, h) {
      const k1 = deriv2(s), k2 = deriv2(s.map((v, i) => v + h / 2 * k1[i])), k3 = deriv2(s.map((v, i) => v + h / 2 * k2[i])), k4 = deriv2(s.map((v, i) => v + h * k3[i]));
      return s.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
    }
    function ballPos(s) {
      const x1 = -BD / 2 + BL * Math.sin(s[0]), y1 = -BL * Math.cos(s[0]), x2 = BD / 2 + BL * Math.sin(s[2]), y2 = -BL * Math.cos(s[2]);
      return { x1, y1, x2, y2, r: Math.hypot(x2 - x1, y2 - y1) };
    }
    function buildBalls() {
      let s = [0, 0, 0, 0]; const samples = [s.slice()]; let touch = false, maxAbs = 0;
      const n = Math.round(RUN2 / DT2);
      for (let i = 1; i <= n; i++) {
        s = rk4(s, DT2); samples.push(s.slice());
        maxAbs = Math.max(maxAbs, Math.abs(s[0]), Math.abs(s[2]));
        if (ballPos(s).r < 2 * BR) { touch = true; break; }
      }
      traj = { samples, end: (samples.length - 1) * DT2, touch, maxAbs };
    }
    function stateAt2(t) {
      const T = traj, i = Math.max(0, Math.min(T.samples.length - 1, Math.floor(t / DT2 + 1e-9)));
      let s = T.samples[i]; const rem = t - i * DT2;
      if (rem > 1e-12 && i < T.samples.length - 1) s = rk4(s, rem);
      const p = ballPos(s), F = Math.abs(coulomb(P.q1 * 1e-8, P.q2 * 1e-8, p.r));
      return { t, th1: s[0], th2: s[2], w1: s[1], w2: s[3], F, ...p };
    }
    const runEnd = () => (traj ? traj.end : 0);
    const now2 = () => stateAt2(sim.t);
    const keyMoments = () => (isRun() ? [0, runEnd()] : []);
    const atKey = () => !sim.running && (sim.t === 0 || Math.abs(sim.t - runEnd()) < 1e-9);

    /* ---------------- tab 3: Coulomb's law ---------------- */
    function t3Values() {
      if (P.find === 'F') { const F = Math.abs(coulomb(P.q1, P.q2, P.r)); return { F, a: P.mass ? F / P.mass : null }; }
      const Q2 = P.F * P.r * P.r / (K * P.ratio), Q = Math.sqrt(Q2);
      return { Q2, Q, QA: P.ratio * Q, F: P.F };
    }
    const rU = r => r / P.uf;                           // r in the scenario's unit
    // r with as many decimals as the question gives it (1.00 mm, so a drag reads 2.00 mm; 20.0 cm)
    const rDec = () => (P.txt && P.txt.r && P.txt.r.includes('.') ? P.txt.r.split('.')[1].length : 2);
    const rTxt = () => `${gv('r', v => rU(v).toFixed(rDec()))} ${P.unitH || P.unit}`;
    const qTxt = k => { if (!S.custom && P.txt && P.txt[k]) return P.qExp ? `${P.txt[k]} × ${ex(P.qExp)}` : P.txt[k]; return sgn(P[k]); };
    const qMag = k => qTxt(k).replace(/^[+−-]/, '');
    // r in metres for the working, 3 significant figures (20.0 cm = 0.200 m); a unit that is already metres is not converted
    const rSI = () => { const a = P.r, e = Math.floor(Math.log10(a) + 1e-12); return e >= -2 && e <= 3 ? (a * (1 + 1e-12)).toPrecision(3) : num(a); };
    const inMetres = () => P.uf === 1 || /^×/.test(P.unit);
    const rM = () => (inMetres() ? rTxt() : `${rTxt()} = ${rSI()} m`);
    const rM2 = () => (P.uf === 1 ? gv('r', v => f3(v)) : `(${rSI()})`);
    function t3Steps() {
      const V = t3Values(), L = [];
      if (P.find === 'F') {
        L.push(`<i>Q</i><sub>1</sub> = ${qTxt('q1')} C, <i>Q</i><sub>2</sub> = ${qTxt('q2')} C, <i>r</i> = ${rM()}`);
        L.push(`<i>F</i> = <i>k</i> ${frac('<i>Q</i><sub>1</sub><i>Q</i><sub>2</sub>', '<i>r</i><sup>2</sup>')}<br><i>F</i> = ${frac(`8.99 × ${ex(9)} × ${qMag('q1')} × ${qMag('q2')}`, `${rM2()}<sup>2</sup>`)}`);
        L.push({ h: `<i>F</i> = ${N_(V.F)}`, lit: true });
        if (P.q1 === 0 || P.q2 === 0) L.push('One charge is zero, so there is no force.');
        else L.push(P.q1 * P.q2 < 0 ? `Unlike charges attract: each charge pulls the other with ${N_(V.F)}. The forces are equal and opposite.`
          : `Like charges repel: each charge pushes the other away with ${N_(V.F)}. The forces are equal and opposite.`);
        if (P.mass) L.push({ h: `<i>a</i> = ${frac('<i>F</i>', '<i>m</i>')} = ${frac(num(V.F, 4), `1.67 × ${ex(-27)}`)} = ${num(V.a)} m s<sup>−2</sup>`, lit: true });
        return L;
      }
      const ten = P.ratio !== 1, Qs = ten ? '<i>Q</i><sub>B</sub>' : '<i>Q</i>';
      L.push(`<i>F</i> = ${gv('F', f3)} N, <i>r</i> = ${rM()}, and ${ten ? `<i>Q</i><sub>A</sub> = ${plain(P.ratio)}<i>Q</i><sub>B</sub>` : 'the charges are the same: <i>Q</i><sub>1</sub> = <i>Q</i><sub>2</sub> = <i>Q</i>'}`);
      L.push(`${gv('F', f3)} = 8.99 × ${ex(9)} × ${frac(`${ten ? plain(P.ratio) : ''}${Qs}<sup>2</sup>`, `${rM2()}<sup>2</sup>`)}`);
      L.push(`${Qs}<sup>2</sup> = ${frac(`${gv('F', f3)} × ${rM2()}<sup>2</sup>`, `${ten ? plain(P.ratio) + ' × ' : ''}8.99 × ${ex(9)}`)} = ${num(V.Q2)}`);
      L.push({ h: `${Qs} = ${rt(num(V.Q2))} = ${num(V.Q)} C${ten ? ` (and <i>Q</i><sub>A</sub> = ${plain(P.ratio)}<i>Q</i><sub>B</sub> = ${num(V.QA)} C)` : ''}`, lit: true });
      return L;
    }

    /* ---------------- tab 4: electric field lines ---------------- */
    let WORLD_W = 40, view4 = null;    // the canvas shows 40 cm across (24 cm on a phone)
    let lines4 = null, key4 = '';

    /* ---------------- steps and the clock ---------------- */
    const nSteps = () => (currentTab === 1 ? t1Steps().length : currentTab === 3 ? t3Steps().length : 0);
    function setStep(n) { S.step = Math.max(0, Math.min(nSteps(), n)); update(); }
    $('prevStep').addEventListener('click', () => setStep(S.step - 1));

    let predictPick = null;
    function clearFeat() { feat = {}; hl = {}; syncFeatButtons(); $('featNote').textContent = ''; }

    // a key feature shows itself: it always reloads its scenario, then sets the step, the moment or the values that show it
    function tapFeat(id) {
      const on = !feat[id];

    function featNote(id) {
      const V1 = currentTab === 1 ? t1Values() : null, V3 = currentTab === 3 ? t3Values() : null, s2 = currentTab === 2 ? now2() : null;
      const L = __pim.lines || { from: [], endOn: [] };
      switch (id) {
        case 'neutral': return currentTab === 1 ? 'The helium atom has 2 protons and 2 electrons: equal numbers, so it is electrically neutral (uncharged), <i>Q</i> = 0 C (notes p. 6-5).'
          : 'Midway between two equal negative charges their fields cancel: X marks the neutral point, where a charge feels no electric force (Example 12).';
        case 'gained': return `Example 2: 16 electrons and 14 protons. 2 more electrons than protons, so it is negatively charged: <i>Q</i> = 2 × (−1.60 × 10<sup>−19</sup>) = ${C_(V1.Q)}.`;
        case 'lost': return `Example 1: positive charge means electrons have been lost: <i>N</i> = 14 ÷ 1.60 × 10<sup>−19</sup> = ${num(V1.N)}.`;
        case 'protons': return `Example 4: A ends ${C_(V1.QA)} and B ${C_(V1.QB)}. Only electrons moved; the protons stayed where they were. The charges are equal and opposite: no charge was created.`;
        case 'tiny': return `6 electrons carry only ${C_(V1.Qe)}. Added to +1.00 C that changes nothing you can see: the final charge is approximately +1.00 C (Example 5, answer D).`;
        case 'like': return `Two positive charges repel: the balls end ${f3(s2.r * 100)} cm apart, further than the 10 cm between the pivots, each thread at ${f3(Math.abs(s2.th1) * 180 / Math.PI)}°.`;
        case 'unlike': return `Unlike charges attract: the balls end ${f3(s2.r * 100)} cm apart, closer than the 10 cm between the pivots. Each feels ${N_(s2.F)}.`;
        case 'equal': return `+9.0 and +4.0 × 10<sup>−8</sup> C: the force on each ball is the same, ${N_(s2.F)}, and both threads lean by ${f3(Math.abs(s2.th1) * 180 / Math.PI)}°. Equal and opposite forces (p. 6-11).`;
        case 'nn': return `Two negative charges repel just as two positive ones do: like charges repel. The forces, ${N_(s2.F)}, are the same as for +6.0 and +6.0.`;
        case 'half': return `At 0.50 mm, half the distance: <i>F</i> = ${N_(V3.F)}, 4 times 8.99 × 10<sup>15</sup> N. <i>r</i><sup>2</sup> is a quarter as large.`;
        case 'double': return `At 2.00 mm, twice the distance: <i>F</i> = ${N_(V3.F)}, a quarter of 8.99 × 10<sup>15</sup> N.`;
        case 'dq': return `Doubling <i>Q</i><sub>1</sub> to +2.00 C doubles the force: <i>F</i> = ${N_(V3.F)}, twice 8.99 × 10<sup>15</sup> N.`;
        case 'pair': return `Each charge pulls the other with the same force, ${N_(V3.F)}: equal and opposite (p. 6-11).`;
        case 'closer': return 'Field lines are closer together when they are near the charge, indicating that the electric field is stronger near the charge (p. 8-35, point 1). Further out they spread apart: the field is weaker.';
        case 'startEnd': return `The field lines start on the positive charge and end on the negative charge (p. 8-35, point 2): ${L.endOn[1] || 0} of the ${L.from[0] || 0} lines from +1 µC end on −1 µC.`;
        case 'number': return `+2 µC has ${L.from[0]} lines and −1 µC has ${L.from[1]}: twice the charge, twice the lines (p. 8-35, point 3). Only ${L.endOn[1]} of the lines from +2 µC can end on −1 µC; the rest go off the screen.`;
        case 'plates': return 'Between two charged plates the lines are straight, parallel and evenly spaced: the field is the same strength everywhere between them (Example 10).';
        case 'negP': return 'A negative charge at P is pushed opposite to the field lines: towards the positive charge, to the left (Example 11(b)). A positive charge at P moves to the right.';
      }
      return '';

    function renderPredict(tab) {
      const Q = PREDICT[tab], box = $('predictBox');

      if (!Q) { box.hidden = true; return; }
      box.hidden = false; box.classList.remove('done');
      $('predictQ').innerHTML = Q.q;
      $('predictFb').innerHTML = '';
      const opts = $('predictOpts');
      opts.innerHTML = '';
      Q.opts.forEach((o, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.innerHTML = o;
        b.addEventListener('click', () => {
          if (opts.dataset.done) return;
          predictPick = i; opts.querySelectorAll('.opt').forEach((x, j) => x.classList.toggle('picked', j === i));
        });
        opts.appendChild(b);
      });
      delete opts.dataset.done;
      $('predictCheck').textContent = 'Check my answer';
    }

      if (!Q) return;
      if (opts.dataset.done) { renderPredict(currentTab); return; }
      if (predictPick === null) { fb.innerHTML = '<span class="verdict no">Pick an answer first.</span>'; return; }
      opts.dataset.done = '1';
      const ok = predictPick === Q.ans;
      opts.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === Q.ans) x.classList.add('right'); else if (j === predictPick) x.classList.add('wrong'); });
      // the options fold away: the result line names the pick (and the right answer), then the explanation
      $('predictBox').classList.add('done');
      fb.innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> Your prediction: ${Q.opts[predictPick]}.`

      $('predictCheck').textContent = 'Try again';
    });

          why: '<i>a</i> = <i>F</i> ÷ <i>m</i> = 57.54 ÷ 1.67 × 10<sup>−27</sup> = 3.45 × 10<sup>28</sup> m s<sup>−2</sup>. (9.61 × 10<sup>−26</sup> multiplies by the mass.)' }] },
      { src: 'Tutorial 6, C2', stem: 'Two point charges A and B are separated by a distance of 3.00 m. Each exerts an electric force of 1.00 N on the other. A carries 10 times as much electric charge as B.', parts: [
        { q: 'What is the magnitude of the charge on B?', opts: [`1.00 × ${ex(-5)} C`, `3.16 × ${ex(-5)} C`, `1.00 × ${ex(-4)} C`, `1.00 × ${ex(-10)} C`], ans: 0,
          why: '1.00 = 8.99 × 10<sup>9</sup> × 10<i>Q</i><sub>B</sub><sup>2</sup> ÷ 3.00<sup>2</sup>, so <i>Q</i><sub>B</sub><sup>2</sup> = 1.00 × 10<sup>−10</sup> and <i>Q</i><sub>B</sub> = 1.00 × 10<sup>−5</sup> C. (3.16 × 10<sup>−5</sup> C leaves out the 10; 1.00 × 10<sup>−4</sup> C is the charge on A.)' }] },
      { src: 'Coulomb’s law, notes p. 6-17', stem: 'Two point charges a distance <i>r</i> apart exert a force <i>F</i> on each other.', parts: [
        { lab: '(a)', q: 'The distance is halved. The force becomes …', opts: ['4<i>F</i>', '2<i>F</i>', '<i>F</i>/2', '<i>F</i>/4'], ans: 0,
          why: '<i>F</i> = <i>kQ</i><sub>1</sub><i>Q</i><sub>2</sub> ÷ <i>r</i><sup>2</sup>: half the distance makes <i>r</i><sup>2</sup> a quarter, so the force is 4 times as large.' },
        { lab: '(b)', q: 'Instead, the distance is doubled. The force becomes …', opts: ['<i>F</i>/4', '<i>F</i>/2', '2<i>F</i>', '4<i>F</i>'], ans: 0,
          why: 'Twice the distance makes <i>r</i><sup>2</sup> four times as large, so the force is a quarter.' }] },
      { src: 'Example 11, lecturer’s slides p. 8-38 (electric field)', stem: 'P is to the right of a positive point charge, in its electric field. A small charge is placed at P.', parts: [
        { lab: '(a)', q: 'If the charge at P is positive, it moves …', opts: ['to the right, away from the positive charge', 'to the left, towards the positive charge', 'nowhere: it stays at P', 'upwards, across the field lines'], ans: 0,
          why: 'A positive charge is pushed along the field lines, which point away from a positive charge: to the right. Like charges repel.' },
        { lab: '(b)', q: 'If the charge at P is negative, it moves …', opts: ['to the left, towards the positive charge', 'to the right, away from the positive charge', 'nowhere: it stays at P', 'downwards, across the field lines'], ans: 0,
          why: 'A negative charge is pushed opposite to the field lines: to the left, towards the positive charge. Unlike charges attract.' }] }
    ];
    // the options are written with the right one first; turn each part's list round by a fixed amount so the right
    // answer is not always in the same place
    { let pc = 0; QUIZ.forEach(Q => Q.parts.forEach(Pt => { const n = Pt.opts.length, r = (pc++ * 3 + 1) % n;
      Pt.opts = Pt.opts.slice(r).concat(Pt.opts.slice(0, r)); Pt.ans = (Pt.ans - r + n) % n; })); }
    const QUIZ_MARKS = QUIZ.reduce((n, Q) => n + Q.parts.length, 0);
    const partLabel = (Q, k) => Q.parts[k].lab ? Q.parts[k].lab + ' ' : Q.parts.length > 1 ? `(${'abcdefgh'[k]}) ` : '';
    let quiz = { i: 0, score: 0, picks: [], done: false, missed: [] };
    function resetQuiz() { quiz = { i: 0, score: 0, picks: [], done: false, missed: [] }; renderQuiz(); }
    function renderQuiz() {
      const el = $('quiz'), N = QUIZ.length;
      if (quiz.i >= N) {
        const list = quiz.missed.length
          ? `<p>Go back over these:</p><ul>${quiz.missed.map(([n, k]) => { const Q = QUIZ[n];
              return `<li>Question ${n + 1}${partLabel(Q, k).trim()} (${Q.src}): ${(Q.stem ? Q.stem + ' ' : '') + Q.parts[k].q}</li>`; }).join('')}</ul>`
          : '<p>Every answer right. Well done.</p>';
        el.innerHTML = `<div class="quiz-top"><span>Summary</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div><div class="quiz-bar"><i style="width:100%"></i></div>
          <div class="quiz-sum"><div class="quiz-q">You scored ${quiz.score} out of ${QUIZ_MARKS}.</div>${list}</div>
          <div class="row-btns"><button type="button" id="qAgain">Try the quiz again</button></div>`;
        $('qAgain').addEventListener('click', resetQuiz);
        return;
      }
      const Q = QUIZ[quiz.i], many = Q.parts.length > 1;
      quiz.picks = Q.parts.map(() => null);
      el.innerHTML = `<div class="quiz-top"><span>Question ${quiz.i + 1} of ${N}</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div>
        <div class="quiz-bar"><i style="width:${(quiz.i / N) * 100}%"></i></div>
        ${Q.stem ? `<div class="quiz-q" id="qStem">${Q.stem}</div>` : ''}<div class="quiz-src">${Q.src}${many ? ` · ${Q.parts.length} parts, answer them all` : ''}</div>
        ${Q.parts.map((Pt, k) => `<div class="qpart" data-k="${k}">
          <div class="${Q.stem ? 'qpart-q' : 'quiz-q'}">${partLabel(Q, k)}${Pt.q}</div>
          <div class="opts">${Pt.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
          <div class="feedback"></div></div>`).join('')}
        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;
          quiz.picks[k] = +b.dataset.j; part.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b));
        }));
      });
      $('qReset').addEventListener('click', resetQuiz);
      $('qSubmit').addEventListener('click', () => {
        const fb = $('qFb');
        if (quiz.done) { quiz.i++; quiz.done = false; renderQuiz(); return; }
        const left = quiz.picks.map((p, k) => p === null ? partLabel(Q, k).trim() || `part ${k + 1}` : null).filter(x => x !== null);
        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }
        quiz.done = true; fb.innerHTML = '';
        el.querySelectorAll('.qpart').forEach(part => {
          const k = +part.dataset.k, Pt = Q.parts[k], ok = quiz.picks[k] === Pt.ans;
          if (ok) quiz.score++; else quiz.missed.push([quiz.i, k]);
          part.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === Pt.ans) x.classList.add('right'); else if (j === quiz.picks[k]) x.classList.add('wrong'); });
          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${Pt.why}</span>`;
        });
        el.querySelector('.quiz-top span:last-child').textContent = `Score: ${quiz.score} of ${QUIZ_MARKS}`;
        $('qSubmit').textContent = quiz.i + 1 < N ? 'Next question' : 'See the summary';
      });
    }

    /* ---------------- Teacher mode ---------------- */
    // Only the teacher link (this page's address + ?teacher) shows the button; students and the
    // Brightspace embed use the plain address. Not a lock: the panel only changes this screen.
    const teacher = $('teacher');
    if (new URLSearchParams(location.search).has('teacher')) $('teacherBtn').hidden = false;
    $('teacherBtn').addEventListener('click', () => { teacher.hidden = !teacher.hidden; });
    $('tClose').addEventListener('click', () => { teacher.hidden = true; });
    $('tExplain').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-explain');
      e.target.textContent = on ? 'Show explanations' : 'Hide explanations'; e.target.classList.toggle('on', on);
    });
    $('tAnswers').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-answers');
      e.target.textContent = on ? 'Show answer labels' : 'Hide answer labels'; e.target.classList.toggle('on', on);
    });
    // free exploration: no Predict first, and every step shown at once
    $('tFree').addEventListener('click', e => {
      freeMode = !freeMode; document.body.classList.toggle('free-mode', freeMode);
      e.target.textContent = freeMode ? 'Back to the guided steps' : 'Switch to free exploration'; e.target.classList.toggle('on', freeMode);
      showTab(currentTab);
    });
    const fullBtn = $('tFull');
    if (!document.fullscreenEnabled) fullBtn.hidden = true;
    fullBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
    $('tReset').addEventListener('click', () => { resetQuiz(); showTab(1); });

    // for the checks: the state behind the drawing
    window.__pimState = () => ({ tab: currentTab, scen: S.scen, custom: S.custom, step: S.step, nSteps: isSteps() ? nSteps() : 0, t: sim.t, end: runEnd(),
      P: JSON.parse(JSON.stringify(P)), s2: currentTab === 2 ? now2() : null, touch: traj ? traj.touch : null,
      v1: currentTab === 1 ? t1Values() : null, v3: currentTab === 3 ? t3Values() : null, lines: __pim.lines || null });
    window.addEventListener('resize', () => { if (currentTab <= 4) { geo = null; view4 = null; if (P.charges) P.placed = false; update(); } });
    showTab(1);
  </script>
  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),
    // and a touch the page grabbed for a drag (its own setPointerCapture call) keeps the page still.
    // (hasPointerCapture can't tell: a touch is always captured implicitly.)
    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
