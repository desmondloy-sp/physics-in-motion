    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const G = 10; // g = 10 m s^-2, as the notes and Tutorial 5 take it
    const clean = v => (Math.abs(v) < 1e-9 ? 0 : v);
    // 3 significant figures, as the lecturer's copy gives them (16.7 W, 53.3%); exact whole numbers stay
    // whole (64 W, 1250 W); a 1e-12 nudge so a binary half rounds up; a true minus sign
    const f3 = v => {
      const x = clean(v);
      if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x)).replace('-', '−');
      const t = (x * (1 + 1e-12)).toPrecision(3);
      // an exact value keeps its own figures (0.5 m, 2.5 W); only a rounded one is padded to 3 (16.7, 0.833)
      if (Math.abs(+t - x) < 1e-9 || Math.abs(x) >= 100) return String(+t).replace('-', '−');
      return t.replace('-', '−');
    };
    // one more figure, for a worked line's intermediate steps (16.67 × 100% ÷ 50% = 33.3, not 16.7 × 2 = 33.4)
    const f4 = v => { const x = clean(v); if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x)).replace('-', '−'); return String(+(x * (1 + 1e-12)).toPrecision(4)).replace('-', '−'); };
    const plain = v => String(+(+v).toFixed(2)).replace('-', '−'); // a typed value as typed: 10, 0.5
    const tx = t => (Math.round(t * 100) / 100).toFixed(2);      // a time on the clock: 2.00 s
    const J = v => Math.abs(v) >= 100000 ? `${f3(v / 1000)} kJ` : `${f3(v)} J`;
    const Wt = v => `${f3(v)} W`;
    const pct = v => `${f3(v)}%`;
    const COL = { F: '#2563eb', W: '#ea580c', in: '#0891b2', use: '#16a34a', heat: '#dc2626', P: '#7c3aed', tot: '#0f172a' };

    /* ---------------- scenarios (every number from the notes, the lecturer's copy or Tutorial 5) ---------------- */
    // tabs 1 and 4: a motor lifts a load (mass m, or a weight wN in newtons as Tutorial C3 gives it) by h metres at
    // constant speed in T seconds. Tab 4 adds the efficiency eff (%), or the power input Pin (W) to solve it from.
    // tab 2: the student lifts the load by hand. tab 3: the useful output and the input of a machine (W), or of a
    // light bulb (J); unknown = what the example asks for.
    const PRESETS = {
      ex5a: { tab: 1, name: '50 kg up 2.0 m in 1 minute', m: 50, h: 2, T: 60, txt: { h: '2.0' },
        q: 'Example 5 (notes p. 5-14): (a) determine how much power is required to lift a mass of 50 kg to a height of 2.0 m at constant speed if the whole process takes 1 minute.' },
      c2ab: { tab: 1, name: '32 kg up 12 m in 1 minute', m: 32, h: 12, T: 60,
        q: 'Tutorial 5, C2: A motor has to lift 32 kg of load per minute to a vertical height of 12 m. (a) Find the work done in lifting the load. (b) Find the power output of the motor.' },
      c3a: { tab: 1, name: '500 N up 3 m in 2 s', wN: 500, h: 3, T: 2,
        q: 'Tutorial 5, C3: A machine lifts a load of 500 N through a vertical height of 3 m in 2 s. (a) Find the useful power output of the machine.' },

      a2: { tab: 2, name: '10 kg box up 0.50 m', m: 10, h: 0.5, txt: { h: '0.50' },
        q: 'Tutorial 5, A2: A man lifts a 10 kg box to a height of 0.50 m. Lift it yourself: once slowly, once quickly. Is the work done the same? Is the power?' },
      ex4: { tab: 2, name: '50 kg up 2.0 m', m: 50, h: 2, txt: { h: '2.0' },
        q: 'Example 4 (notes p. 5-10): a mass of 50 kg is lifted to a height of 2.0 m. Lift it yourself and find your power.' },

      bulb: { tab: 3, name: 'Light bulb', kind: 'bulb', unit: 'J', out: 20, inp: 100,
        q: 'Notes p. 5-12: In the case of a light bulb, only some of the electricity consumed is converted into visible light. Most of the electricity is actually converted into heat. (Values chosen for this page: the bulb takes in 100 J of electricity and gives out 20 J of light.)' },
      ex5b: { tab: 3, name: 'Motor at 50% efficiency', kind: 'motor', m: 50, h: 2, T: 60, eff: 50,
        q: 'Example 5 (notes p. 5-14): (b) Calculate the power input of the motor if it works at 50% efficiency. (In part (a) it lifts 50 kg to a height of 2.0 m in 1 minute.)' },
      c2c: { tab: 3, name: 'Motor with 120 W input', kind: 'motor', m: 32, h: 12, T: 60, inp: 120,
        q: 'Tutorial 5, C2: A motor has to lift 32 kg of load per minute to a vertical height of 12 m. (c) Find the efficiency of the motor if the input power is 120 W.' },
      c3b: { tab: 3, name: 'Machine at 60% efficiency', kind: 'machine', wN: 500, h: 3, T: 2, eff: 60,
        q: 'Tutorial 5, C3: A 60% efficient machine lifts a load of 500 N through a vertical height of 3 m in 2 s. (b) Find the power input of the machine.' },

      ex5: { tab: 4, name: '50 kg, 1 minute, 50% efficient', m: 50, h: 2, T: 60, eff: 50, txt: { h: '2.0' },
        q: 'Example 5 (notes p. 5-14): (a) determine how much power is required to lift a mass of 50 kg to a height of 2.0 m at constant speed if the whole process takes 1 minute. Then, (b) Calculate the power input of the motor if it works at 50% efficiency.' },
      c2: { tab: 4, name: '32 kg up 12 m, 120 W input', m: 32, h: 12, T: 60, Pin: 120,
        q: 'Tutorial 5, C2: A motor has to lift 32 kg of load per minute to a vertical height of 12 m. (a) Find the work done in lifting the load. (b) Find the power output of the motor. (c) Find the efficiency of the motor if the input power is 120 W.' },
      c3: { tab: 4, name: '500 N up 3 m, 60% efficient', wN: 500, h: 3, T: 2, eff: 60,
        q: 'Tutorial 5, C3: A 60% efficient machine lifts a load of 500 N through a vertical height of 3 m in 2 s. (a) Find the useful power output of the machine. (b) Find the power input of the machine.' }
    };
    const CUSTOM_NAME = { 1: 'Your own lift', 2: 'Your own load', 3: 'Your own machine', 4: 'Your own machine' };

    /* ---------------- the state ---------------- */
    // L: the lift in use on tabs 1, 2 and 4 (a copy of the scenario, changed by the inputs); M: tab 3's machine
    let S = { scen: 'ex5a', base: 'ex5a', step: 1, custom: false };
    let L = {}, M = {};
    const sim = { t: 0, running: false, last: null };
    const hand = { y: 0, dragging: false, t0: null, t: 0, done: false, attempts: [], msg: '' };
    const STEPS = { 3: 5 };
    let hl = {}, feat = {};

    const weight = P => (P.wN !== undefined ? P.wN : P.m * G);
    // the useful power output of a lift at constant speed: the work done (weight × height) over the time
    const usefulP = P => weight(P) * P.h / P.T;

    function loadScenario(id) {
      const P = PRESETS[id];
      S.scen = id; S.custom = id === 'custom';
      if (!S.custom) {
        S.base = id;
        if (P.tab === 3) {
          M = Object.assign({ unit: 'W' }, P);
          // solve the machine from the example's data: the useful output from the lift, the unknown from the rest
          if (P.kind !== 'bulb') M.out = usefulP(P);
          if (P.inp !== undefined) { M.eff = M.out / M.inp * 100; M.unknown = 'eff'; }
          else if (P.eff !== undefined) { M.inp = M.out / (P.eff / 100); M.unknown = 'inp'; }
          if (P.kind === 'bulb') { M.eff = M.out / M.inp * 100; M.unknown = 'eff'; }
        } else {
          L = Object.assign({}, P);
          // Tutorial C2 gives the power input: the efficiency follows from the useful power output
          if (P.tab === 4 && P.Pin !== undefined) L.eff = usefulP(P) / P.Pin * 100;
        }
        $('question').innerHTML = P.q;
      } else $('question').innerHTML = 'Your own values. Choose a scenario from the menu to go back to an example from the notes.';
      S.step = freeMode ? (STEPS[currentTab] || 1) : 1;
      sim.t = 0; sim.running = false; sim.last = null;
      resetHand(true);
    }
    // a value as the notes write it (2.0 m) while on the scenario; as typed once changed
    const gv = (P, k) => (!S.custom && P.txt && P.txt[k] !== undefined ? P.txt[k] : plain(P[k]));

    /* ---------------- tabs 1 and 4: a lift at constant speed ---------------- */
    function lift(t) {
      const P = L, mg = weight(P), k = Math.max(0, Math.min(1, t / P.T)), y = P.h * k;
      const Wd = mg * y, Pout = usefulP(P), eff = (P.eff || 100) / 100;
      return { y, mg, Wd, Pout, eff, Ein: Wd / eff, heat: Wd / eff - Wd, Pin: Pout / eff, started: t > 1e-9, done: t >= P.T - 1e-9 };
    }
    // show a long lift faster than real time, so it takes about 6 real seconds (a 2 s lift runs in real time)
    const playRate = () => Math.max(1, L.T / 6);

    /* ---------------- tab 2: the hand lift ---------------- */
    function resetHand(clearAll) {
      hand.y = 0; hand.dragging = false; hand.t0 = null; hand.t = 0; hand.done = false; hand.msg = '';
      if (clearAll) hand.attempts = [];
    }
    const handNow = () => (hand.dragging && hand.t0 !== null ? (performance.now() - hand.t0) / 1000 : hand.t);
    function finishLift(t) {
      // the time as the clock shows it (0.01 s), so the working's W ÷ t gives exactly the power printed beside it
      t = Math.max(0.01, Math.round(t * 100) / 100);
      hand.dragging = false; hand.done = true; hand.y = L.h; hand.t = t;
      const Wd = weight(L) * L.h;
      hand.attempts.push({ t, W: Wd, P: Wd / t, m: L.m, h: L.h });
      if (hand.attempts.length > 6) hand.attempts.shift();
    }

    /* ---------------- tab 3: the machine ---------------- */
    function machine() {
      const P = M, st = S.step, out = P.out, inp = P.inp, eff = P.eff, heat = inp - out;
      // what the student has found so far: the useful output (step 1), what else is given (2), the unknown (4), the heat (5)
      const known = { out: st >= 1, inp: P.unknown === 'inp' ? st >= 4 : st >= 2, eff: P.unknown === 'eff' ? st >= 4 : st >= 2, heat: st >= 5 };
      return { out, inp, eff, heat, known, toScale: st >= 4 };
    }

    /* ---------------- the clock (tabs 1 and 4) ---------------- */
    function runEnd() { return currentTab === 1 || currentTab === 4 ? L.T : 0; }
    function frame(ts) {
      if (!sim.running) return;
      if (sim.last === null) sim.last = ts;
      // a first rAF timestamp can be earlier than the one stored: never step backwards
      const dt = Math.max(0, Math.min(0.05, (ts - sim.last) / 1000)); sim.last = ts;
      const end = runEnd();
      sim.t = Math.min(end, sim.t + dt * playRate());
      if (sim.t >= end - 1e-9) { sim.t = end; sim.running = false; }
      update();
      if (sim.running) requestAnimationFrame(frame);
    }
    function start() {
      const end = runEnd();
      if (end <= 0) { update(); return; }
      if (sim.t >= end - 1e-9) sim.t = 0;
      sim.running = true; sim.last = null; clearFeatNoteOnly(); update(); requestAnimationFrame(frame);
    }
    function setTime(t) { sim.running = false; sim.last = null; sim.t = Math.max(0, Math.min(runEnd(), t)); update(); }
    function resetRun() { sim.running = false; sim.last = null; sim.t = 0; update(); }
    function runToEnd() { setTime(runEnd()); }
    // key moments: every quarter of the lift, and its end
    function keyMoments() { const end = runEnd(); return end > 0 ? [0, end / 4, end / 2, 3 * end / 4, end] : []; }
    $('startBtn').addEventListener('click', start);
    $('pauseBtn').addEventListener('click', () => {
      if (sim.running) { sim.running = false; sim.last = null; update(); }
      else if (sim.t > 0 && sim.t < runEnd()) start();
    });
    $('resetBtn').addEventListener('click', resetRun);
    $('nextMoment').addEventListener('click', () => { const n = keyMoments().find(m => m > sim.t + 1e-6); if (n !== undefined) setTime(n); });
    $('prevMoment').addEventListener('click', () => { const p = keyMoments().filter(m => m < sim.t - 1e-6).pop(); if (p !== undefined) setTime(p); });
    $('downBtn').addEventListener('click', () => { resetHand(false); update(); });
    $('clearBtn').addEventListener('click', () => { resetHand(true); clearFeat(); update(); });

    /* ---------------- drawing helpers ---------------- */
    // what the canvas drew, for the checks: every label's box, every arrow, the panes and the drag handles
    window.__pim = { labels: [], arrows: [], panes: [], handles: [] };
    function setup(cv) {
      const r = cv.getBoundingClientRect();
      if (r.width < 20 || r.height < 20) return null; // hidden: never draw at no size
      const dpr = window.devicePixelRatio || 1, cw = Math.round(r.width * dpr), ch = Math.round(r.height * dpr);
      if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
      const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, r.width, r.height);
      return { ctx, W: r.width, H: r.height };
    }
    // Canvas text with <i>, <sub> and <sup> runs, so symbols of physical quantities are italic, as in the notes.
    // Honours ctx.textAlign; returns the width. measureOnly = true draws nothing.
    function richText(ctx, s, x, y, measureOnly) {
      const base = ctx.font, m = base.match(/([\d.]+)px/), size = m ? +m[1] : 12;
      const runs = []; let it = false, sub = 0;
      for (const tok of String(s).split(/(<\/?(?:i|sub|sup)>)/)) {
        if (tok === '<i>') it = true; else if (tok === '</i>') it = false;
        else if (tok === '<sub>') sub = 1; else if (tok === '<sup>') sub = -1;
        else if (tok === '</sub>' || tok === '</sup>') sub = 0;
        else if (tok) {
          let f = sub ? base.replace(/[\d.]+px/, (size * 0.75).toFixed(1) + 'px') : base;
          if (it) f = 'italic ' + f;
          ctx.font = f; runs.push({ t: tok, f, sub, w: ctx.measureText(tok).width });
        }
      }
      ctx.font = base;
      const w = runs.reduce((a, r) => a + r.w, 0);
      if (measureOnly) return w;
      const align = ctx.textAlign;
      let cx = align === 'center' ? x - w / 2 : (align === 'right' || align === 'end') ? x - w : x;
      ctx.textAlign = 'left';
      for (const r of runs) { ctx.font = r.f; ctx.fillText(r.t, cx, y + (r.sub === 1 ? size * 0.3 : r.sub === -1 ? -size * 0.4 : 0)); cx += r.w; }
      ctx.textAlign = align; ctx.font = base;
      return w;
    }
    let PANE = 'scene', CW = 1e9, CH = 1e9; // the pane name for the checks; the canvas size a label must stay inside
    function arrow(ctx, x1, y1, x2, y2, color, lw = 3.5, head = 11, dash = null, record = true) {
      const len = Math.hypot(x2 - x1, y2 - y1); if (len < 1.5) return;
      if (record) __pim.arrows.push({ pane: PANE, x1, y1, x2, y2 });
      const a = Math.atan2(y2 - y1, x2 - x1), hd = Math.min(head, len * 0.6);
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hd * 0.8, y2 - Math.sin(a) * hd * 0.8); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - hd * Math.cos(a - 0.45), y2 - hd * Math.sin(a - 0.45)); ctx.lineTo(x2 - hd * Math.cos(a + 0.45), y2 - hd * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
    }
    // a label's box before it is drawn: x/y is the middle of the card's left, centre or right edge
    function labelBox(ctx, lines, x, y, align, size) {
      ctx.font = `bold ${size}px Arial`;
      const w = Math.max(...lines.map(t => richText(ctx, t, 0, 0, true))), lh = size * 1.6 + 1, h = lines.length * lh - 1;
      const x0 = Math.max(4, Math.min(CW - w - 4, align === 'center' ? x - w / 2 : align === 'right' ? x - w : x));
      const y0 = Math.max(2, Math.min(CH - h - 2, y - size * 0.8));
      return { x: x0 - 3, y: y0, w: w + 6, h, lh, tx: x0, size };
    }
    const hitBox = (a, b, pad = 1) => Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) > pad && Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) > pad;
    function crossesArrow(box) {
      return __pim.arrows.some(a => { if (a.pane !== PANE) return false; for (let k = 0; k <= 24; k++) { const px = a.x1 + (a.x2 - a.x1) * k / 24, py = a.y1 + (a.y2 - a.y1) * k / 24;
        if (px > box.x + 2 && px < box.x + box.w - 2 && py > box.y + 2 && py < box.y + box.h - 2) return true; } return false; });
    }
    // labels on white cards, one card per line; nudge: +1 moves down, −1 up, to dodge labels and arrows already drawn
    function label(ctx, lines, x, y, color, align = 'center', size = 12, nudge = 0) {
      if (!Array.isArray(lines)) lines = [lines];
      let b = labelBox(ctx, lines, x, y, align, size);
      if (nudge) for (let i = 0; i < 14 && (__pim.labels.some(l => l.pane === PANE && hitBox(l, b)) || crossesArrow(b)); i++) b = labelBox(ctx, lines, x, b.y + size * 0.8 + nudge * 8, align, size);
      lines.forEach((t, i) => {
        const card = { pane: PANE, text: t.replace(/<[^>]+>/g, ''), x: b.x, y: b.y + i * b.lh, w: b.w, h: size * 1.6 };
        ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fillRect(card.x, card.y, card.w, card.h);
        ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.font = `bold ${size}px Arial`; richText(ctx, t, b.tx, card.y + size * 0.8);
        ctx.textBaseline = 'alphabetic';
        __pim.labels.push(card);
      });
      return b;
    }
    function title(ctx, text, x, y) {
      ctx.fillStyle = '#334155'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
      richText(ctx, text, x, y);
      __pim.labels.push({ pane: PANE, text: text.replace(/<[^>]+>/g, ''), x: x - 2, y: y - 10, w: richText(ctx, text, 0, 0, true) + 4, h: 18, title: true });
    }
    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    function dashLine(ctx, x1, y1, x2, y2, color = '#94a3b8') {
      ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
    }
    // a "nice" gridline step: 1, 2, 2.5 or 5 times a power of ten, giving at most `max` steps
    function niceStep(range, max) {
      const raw = range / max, p = Math.pow(10, Math.floor(Math.log10(raw)));
      for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= raw - 1e-12) return k * p;
      return 10 * p;
    }
    function pane(r, name) { PANE = name; __pim.panes.push(Object.assign({ name }, r)); return r; }

    /* ---------------- drawing: the scene ---------------- */
    function draw() {
      __pim = window.__pim = { labels: [], arrows: [], panes: [], handles: [] };
      const c = setup(canvas); if (!c) return;
      const { ctx, W, H } = c;
      CW = W; CH = H;
      if (currentTab === 3) drawFlow(ctx, W, H);
      else drawLift(ctx, W, H);
      drawGraph();
    }

    // The lift's layout: one function, used by the drawing AND the hand drag, so both agree where the load is
    // (skill: the drawing and the drag handler share one geometry)
    function liftGeom(W, H, P, motor) {
      const floorY = H - 34, bw = 70, bh = 44, mx = W * 0.45, my = 58;
      const bx = motor ? mx - 30 : W * 0.45;
      const top = motor ? my + 30 : 30;       // room above: the motor, or the top margin
      const k = (floorY - top - bh - 62) / Math.max(P.h, 1e-6); // pixels per metre: the lifted load keeps 62 px above it
      return { floorY, bw, bh, mx, my, bx, k };
    }
    let lg = null;
    function drawLift(ctx, W, H) {
      const P = L, motor = currentTab !== 2, mg = weight(P);
      pane({ x: 0, y: 0, w: W, h: H }, 'scene');
      if (!lg || !hand.dragging) lg = liftGeom(W, H, P, motor);
      const g = lg, { floorY, bw, bh, mx, my, bx, k } = g;
      const y = currentTab === 2 ? hand.y : lift(sim.t).y;
      ctx.fillStyle = '#eef2f7'; ctx.fillRect(0, floorY, W, H - floorY);
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
      // a height scale at the left
      const step = niceStep(P.h, 5);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.fillStyle = '#64748b'; ctx.font = '10px Arial'; ctx.textAlign = 'right';
      // (0 m sits just above the floor line, not on it)
      for (let v = 0; v <= P.h + 1e-9; v += step) { const yy = floorY - v * k; ctx.beginPath(); ctx.moveTo(34, yy); ctx.lineTo(42, yy); ctx.stroke(); ctx.fillText(`${f3(v)} m`, 32, v === 0 ? yy - 5 : yy + 3); }
      // the target height, dashed, and where the load starts
      const tY = floorY - P.h * k;
      dashLine(ctx, bx - bw / 2 - 20, tY, bx + bw / 2 + 96, tY, '#16a34a');
      ctx.setLineDash([5, 4]); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.strokeRect(bx - bw / 2, floorY - bh, bw, bh); ctx.setLineDash([]);
      const yb = floorY - y * k;
      if (motor) {
        ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI * 2); ctx.stroke();
        // the drum turns as the rope winds in
        const spin = y * k / 30;
        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + Math.cos(spin) * 26, my + Math.sin(spin) * 26); ctx.stroke();
        label(ctx, 'Motor', mx + 36, my, '#334155', 'left', 12);
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, my); ctx.lineTo(bx, yb - bh); ctx.stroke();
      }
      // the load: light orange with a black label
      roundRect(ctx, bx - bw / 2, yb - bh, bw, bh, 4, hand.dragging ? '#fb923c' : '#fdba74', '#9a3412');

    /* tab 3: the energy flow: a machine with arrows in and out, then (once the unknown is found) drawn to scale */

        : `So far: ${J(s.Ein)} taken in = ${J(s.Wd)} useful (GPE) + ${J(s.heat)} heat. Efficiency = ${pct(P.eff)}${s.done ? '. The lift is done.' : ', the same at every moment.'}`;
      work.innerHTML = s.done ? work4(s) : '';
    }

    function work1(s) {
      const P = L, mg = f3(s.mg), h = gv(P, 'h'), T = plain(P.T);
      const L1 = P.wN !== undefined ? `Force = weight of the load = ${mg} N` : `<i>F</i> = weight = <i>mg</i> = ${plain(P.m)} × ${plain(G)} = ${mg} N`;
      return eq([L1, `Work done: <i>W</i> = <i>F</i> × <i>h</i> = ${mg} × ${h} = ${J(s.Wd)}`,
        { h: `Power: <i>P</i> = <span class="frac"><span><i>W</i></span><span><i>t</i></span></span> = <span class="frac"><span>${f3(s.Wd)}</span><span>${T}</span></span> = ${Wt(s.Pout)}`, lit: true }]);
    }
    function words2() {
      const A = hand.attempts, last = A[A.length - 1];
      let s = `Your lift took ${tx(last.t)} s: <i>P</i> = ${J(last.W)} ÷ ${tx(last.t)} s = ${Wt(last.P)}.`;
      if (A.length >= 2) {
        const prev = A[A.length - 2];
        if (Math.abs(prev.W - last.W) < 1e-9) s += last.t < prev.t ? ' Faster than the lift before: the same work in less time, so more power.' : last.t > prev.t ? ' Slower than the lift before: the same work in more time, so less power.' : '';
        else s += ' A different load or height: a different amount of work.';
      } else s += ' Press “Put it down” and lift it again, faster or slower.';
      return s;
    }
    function stepText3(s, nm) {
      const P = M, u = P.unit === 'J';
      const outSrc = P.kind === 'bulb' || S.custom ? `${unitV(s.out)}.` : `work done ÷ time = ${J(weight(P) * P.h)} ÷ ${plain(P.T)} s = ${unitV(s.out)}.`;
      switch (S.step) {
        case 1: return P.kind === 'bulb' && !S.custom ? 'A light bulb is for light: the useful energy output is the light, 20 J.'
          : `${S.custom ? 'The useful output' : `The ${nm.dev.toLowerCase()} is for lifting the load: the useful power output`} = ${outSrc}`;
        case 2: return P.unknown === 'inp' ? `The efficiency is given: ${pct(s.eff)}. The power input is not known yet.`
          : P.kind === 'bulb' && !S.custom ? 'The energy input: 100 J of electricity.' : `The ${u ? 'energy' : 'power'} input is given: ${unitV(s.inp)}.`;
        case 3: return u ? 'Efficiency = useful energy output ÷ energy input × 100% (notes p. 5-13).' : 'Efficiency = useful power output ÷ power input × 100% (notes p. 5-13).';
        case 4: return P.unknown === 'inp' ? `Power input = ${f4(s.out)} × 100% ÷ ${pct(s.eff)} = ${unitV(s.inp)}.` : `Efficiency = ${f4(s.out)} ÷ ${f4(s.inp)} × 100% = ${pct(s.eff)}.`;
        case 5: return `The rest, ${f4(s.inp)} − ${f4(s.out)} = ${unitV(s.heat)}, is converted to an unintended form: heat.`;
      }
      return '';
    }
    function work3(s) {
      const P = M, u = P.unit === 'J', o = u ? 'useful energy output' : 'useful power output', i = u ? 'energy input' : 'power input', L3 = [];
      L3.push(`Efficiency = <span class="frac"><span>${o}</span><span>${i}</span></span> × 100%`);
      if (P.unknown === 'inp') {
        L3.push(`${pct(s.eff)} = <span class="frac"><span>${f4(s.out)}</span><span>${i}</span></span> × 100%`);
        if (S.step >= 4) L3.push({ h: `${i} = ${f4(s.out)} × <span class="frac"><span>100%</span><span>${pct(s.eff)}</span></span> = ${unitV(s.inp)}`, lit: true });
      } else if (S.step >= 4) L3.push({ h: `&nbsp;&nbsp;&nbsp;= <span class="frac"><span>${f4(s.out)}</span><span>${f4(s.inp)}</span></span> × 100% = ${pct(s.eff)}`, lit: true });
      else L3.push(`&nbsp;&nbsp;&nbsp;= <span class="frac"><span>${f4(s.out)}</span><span>${f4(s.inp)}</span></span> × 100% = ?`);
      if (S.step >= 5) L3.push(`Heat (unintended) = ${i} − ${o} = ${f4(s.inp)} − ${f4(s.out)} = ${unitV(s.heat)}`);
      return eq(L3);
    }
    function work4(s) {
      const P = L, mg = f3(s.mg), h = gv(P, 'h'), T = plain(P.T), Wd = weight(P) * P.h, L4 = [];
      L4.push(P.wN !== undefined ? `Useful work: <i>W</i> = ${mg} × ${h} = ${J(Wd)}` : `Useful work: <i>W</i> = <i>mgh</i> = ${plain(P.m)} × ${plain(G)} × ${h} = ${J(Wd)}`);
      L4.push({ h: `Useful power output = <span class="frac"><span><i>W</i></span><span><i>t</i></span></span> = <span class="frac"><span>${f3(Wd)}</span><span>${T}</span></span> = ${Wt(s.Pout)}`, lit: true });
      if (P.Pin !== undefined && !S.custom) L4.push({ h: `Efficiency = <span class="frac"><span>${f4(s.Pout)}</span><span>${plain(P.Pin)}</span></span> × 100% = ${pct(P.eff)}`, lit: true });
      else L4.push({ h: `Power input = ${f4(s.Pout)} × <span class="frac"><span>100%</span><span>${pct(P.eff)}</span></span> = ${Wt(s.Pin)}`, lit: true });
      L4.push(`Energy input in ${T} s = ${f4(s.Pin)} × ${T} = ${J(s.Ein)}; heat = ${J(s.Ein)} − ${J(s.Wd)} = ${J(s.heat)}`);

    }

    function update() {

    function fillPresets(list, tab) {

      [...list, 'custom'].forEach(id => { const o = document.createElement('option'); o.value = id; o.textContent = id === 'custom' ? CUSTOM_NAME[tab] : PRESETS[id].name; presetEl.appendChild(o); });
      presetEl.value = list[0];
    }

    function showTab(tab) {
      currentTab = tab;
      sim.running = false;
      document.querySelectorAll('#tabs .tab').forEach(b => { const on = +b.dataset.tab === tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
      $('stepLabel').textContent = `Step ${tab} of 5`;
      document.querySelectorAll('#stepBar i').forEach((i, n) => i.classList.toggle('on', n < tab));
      $('strip').innerHTML = TABS[tab].strip;
      renderKey(tab);
      $('pageSim').hidden = tab === 5;
      $('page5').hidden = tab !== 5;
      if (tab <= 4) {
        const T = TABS[tab];
        canvas.className = 't' + tab;
        $('stepGroup').hidden = tab !== 3;
        $('simGroup').hidden = tab !== 1 && tab !== 4;
        $('handGroup').hidden = tab !== 2;
        $('moments').hidden = tab !== 1 && tab !== 4;
        $('sceneHint').textContent = T.hint;
        $('graphTitle').innerHTML = T.graph || '';
        $('notes').innerHTML = '<ul>' + T.notes.map(n => `<li>${n}</li>`).join('') + '</ul>';
        fillPresets(T.presets, tab);
        chooseScenario(T.presets[0]);
      }
      if (tab === 5) renderQuiz();
      renderPredict(tab);
      renderFeats(tab);
      $('tPrompts').innerHTML = PROMPTS[tab].map(p => `<li>${p}</li>`).join('');
    }
    document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => showTab(+b.dataset.tab)));

    /* ---------------- Tab 5: Challenge ---------------- */
    // every answer recomputed and matched to the lecturer's copy or Tutorial 5's answer key
    // A question whose parts share one situation is one screen: the situation once, then its parts
    const QUIZ = [
      { src: 'Notes p. 5-11', stem: 'Power …', parts: [
        { lab: '(a)', q: 'Power is defined as …', opts: ['the rate at which work is done', 'the total work done', 'the force times the distance moved', 'the energy stored in an object'], ans: 0,
          why: 'Power is the rate at which work is done, or the rate at which energy is used or converted from one form to another: how fast the work is done.' },
        { lab: '(b)', q: 'The SI unit of power is …', opts: ['J/s, the watt (W)', 'the joule (J)', 'N m', 'the newton (N)'], ans: 0,
          why: 'The SI unit of power is J/s or watt (W). The joule and the newton metre are units of work and energy.' }] },
      { src: 'Example 5, notes p. 5-14', stem: 'A motor lifts a mass of 50 kg to a height of 2.0 m at constant speed. The whole process takes 1 minute.', parts: [
        { lab: '(a)', q: 'How much power is required?', opts: ['16.7 W', '1000 W', '500 W', '8.33 W'], ans: 0,
          why: '<i>W</i> = <i>mgh</i> = 50 × 10 × 2.0 = 1000 J, and 1 minute = 60 s: <i>P</i> = 1000 ÷ 60 = 16.7 W. (1000 W forgets to divide by the time; 500 W is the weight.)' },
        { lab: '(b)', q: 'What is the power input of the motor if it works at 50% efficiency?', opts: ['33.3 W', '8.33 W', '16.7 W', '66.7 W'], ans: 0,
          why: 'Power input = useful power output × 100% ÷ efficiency = 16.67 × 100% ÷ 50% = 33.3 W. (8.33 W multiplies by 50% instead of dividing. The lecturer’s copy writes 33.4 W because it doubles the rounded 16.7.)' }] },
      { src: 'Tutorial 5, C2', stem: 'A motor has to lift 32 kg of load per minute to a vertical height of 12 m.', parts: [
        { lab: '(a)', q: 'Find the work done in lifting the load.', opts: ['3840 J', '384 J', '2.67 J', '38 400 J'], ans: 0,
          why: 'Force = weight = 32 × 10 = 320 N, so <i>W</i> = 320 × 12 = 3840 J. (384 J leaves out <i>g</i>.)' },
        { lab: '(b)', q: 'Find the power output of the motor.', opts: ['64 W', '3840 W', '230 400 W', '320 W'], ans: 0,
          why: 'Power output = work done ÷ time = 3840 J ÷ 60 s = 64 W. (3840 W treats a minute as one second; 230 400 W multiplies by 60.)' },
        { lab: '(c)', q: 'Find the efficiency of the motor if the input power is 120 W.', opts: ['53.3%', '187.5%', '46.7%', '64%'], ans: 0,
          why: 'Efficiency = power output ÷ power input × 100% = 64 ÷ 120 × 100% = 53.3%. (187.5% divides the wrong way: an efficiency is never more than 100%.)' }] },
      { src: 'Tutorial 5, C3', stem: 'A 60% efficient machine lifts a load of 500 N through a vertical height of 3 m in 2 s.', parts: [
        { lab: '(a)', q: 'Find the useful power output of the machine.', opts: ['750 W', '1500 W', '3000 W', '450 W'], ans: 0,
          why: 'Work done = 500 × 3 = 1500 J, so useful power output = 1500 ÷ 2 = 750 W. (1500 W forgets the time; 450 W takes 60% of the useful output.)' },
        { lab: '(b)', q: 'Find the power input of the machine.', opts: ['1250 W', '450 W', '750 W', '1200 W'], ans: 0,
          why: 'Efficiency = output ÷ input, so 60% = 750 ÷ power input: power input = 750 ÷ 0.6 = 1250 W. (450 W multiplies by 0.6 instead of dividing.)' }] },
      { src: 'Notes p. 5-13', stem: 'Efficiency is defined as …', parts: [
        { q: 'Which is right?', opts: ['the ratio of the useful energy output to the total energy input', 'the ratio of the energy input to the useful energy output', 'the useful energy output minus the energy input', 'the energy converted to heat'], ans: 0,
          why: 'Efficiency is defined as the ratio of the useful energy output to the total energy input, usually expressed as a percentage: useful energy output ÷ energy input × 100%.' }] },
      { src: 'Notes p. 5-12', stem: 'A light bulb converts 100% of the electricity it takes in: 20% into light and 80% into heat.', parts: [
        { lab: '(a)', q: 'What is the efficiency of the bulb?', opts: ['20%', '80%', '100%', '25%'], ans: 0,
          why: 'Only the light is useful: efficiency = 20 ÷ 100 × 100% = 20%. (80% is the heat; 25% divides the light by the heat.)' },
        { lab: '(b)', q: 'What happens to the heat?', opts: ['It dissipates into the environment', 'It is converted back into electricity', 'It is destroyed', 'It becomes extra light'], ans: 0,
          why: 'Most of the electricity is converted into heat, which dissipates into the environment (notes p. 5-12). Energy cannot be destroyed (p. 5-15).' }] },
      { src: 'Notes p. 5-12', stem: 'The useful energy output of a machine is always …', parts: [
        { q: 'Which is right?', opts: ['less than the energy input', 'equal to the energy input', 'more than the energy input', 'zero'], ans: 0,
          why: 'Some of the energy is always converted to an unintended form (mostly heat), so the useful energy output is always less than the energy input.' }] },
      { src: 'Tutorial 5, A2, lifted twice', stem: 'Two students each lift a 10 kg box to a height of 0.50 m. A takes 2.0 s and B takes 0.50 s.', parts: [
        { lab: '(a)', q: 'Compare the work done by A and by B.', opts: ['The same, 50 J each', 'B does four times as much', 'A does four times as much', 'B does no work'], ans: 0,
          why: 'Work done = <i>mgh</i> = 10 × 10 × 0.50 = 50 J for both: the same load to the same height.' },
        { lab: '(b)', q: 'What is B’s power?', opts: ['100 W', '25 W', '50 W', '10 W'], ans: 0,
          why: '<i>P</i> = <i>W</i> ÷ <i>t</i> = 50 ÷ 0.50 = 100 W. (25 W is A’s power: 50 ÷ 2.0.)' }] },
      { src: 'Tutorial 5, C2, one minute', stem: 'The motor in Tutorial C2 takes in 120 W and gives a useful power output of 64 W.', parts: [
        { q: 'How much energy is converted to heat in one minute?', opts: ['3360 J', '56 J', '7200 J', '3840 J'], ans: 0,
          why: 'Each second, 120 − 64 = 56 J becomes heat; in 60 s that is 56 × 60 = 3360 J. (7200 J is the whole energy input; 3840 J is the useful work.)' }] },
      { src: 'Notes p. 5-11, values chosen for this question', stem: 'A lamp converts 600 J of electrical energy in 10 s, at a constant rate.', parts: [
        { q: 'What is its power?', opts: ['60 W', '6000 W', '600 W', '0.0167 W'], ans: 0,
          why: '<i>P</i> = <i>E</i> ÷ <i>t</i> = 600 ÷ 10 = 60 W. (6000 W multiplies; 0.0167 W divides the wrong way.)' }] }
    ];
    // the options are written with the right one first; turn each part's list round by a fixed amount so the right
    // answer is not always in the same place (positions 4, 1, 2, 3, 4, ... down the quiz)
    { let pc = 0; QUIZ.forEach(Q => Q.parts.forEach(P => { const n = P.opts.length, r = (pc++ * 3 + 1) % n;
      P.opts = P.opts.slice(r).concat(P.opts.slice(0, r)); P.ans = (P.ans - r + n) % n; })); }
    const QUIZ_MARKS = QUIZ.reduce((n, Q) => n + Q.parts.length, 0);
    const partLabel = (Q, k) => Q.parts[k].lab ? Q.parts[k].lab + ' ' : Q.parts.length > 1 ? `(${'abcdefgh'[k]}) ` : '';
    let quiz = { i: 0, score: 0, picks: [], done: false, missed: [] };
    function resetQuiz() { quiz = { i: 0, score: 0, picks: [], done: false, missed: [] }; renderQuiz(); }
    function renderQuiz() {
      const el = $('quiz'), N = QUIZ.length;
      if (quiz.i >= N) {
        const list = quiz.missed.length
          ? `<p>Go back over these:</p><ul>${quiz.missed.map(([n, k]) => { const Q = QUIZ[n];
              return `<li>Question ${n + 1}${partLabel(Q, k).trim()} (${Q.src}): ${(Q.stem ? Q.stem + ' ' : '') + Q.parts[k].q}</li>`; }).join('')}</ul>`
          : '<p>Every answer right. Well done.</p>';
        el.innerHTML = `<div class="quiz-top"><span>Summary</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div><div class="quiz-bar"><i style="width:100%"></i></div>
          <div class="quiz-sum"><div class="quiz-q">You scored ${quiz.score} out of ${QUIZ_MARKS}.</div>${list}</div>
          <div class="row-btns"><button type="button" id="qAgain">Try the quiz again</button></div>`;
        $('qAgain').addEventListener('click', resetQuiz);
        return;
      }
      const Q = QUIZ[quiz.i], many = Q.parts.length > 1;
      quiz.picks = Q.parts.map(() => null);
      el.innerHTML = `<div class="quiz-top"><span>Question ${quiz.i + 1} of ${N}</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div>
        <div class="quiz-bar"><i style="width:${(quiz.i / N) * 100}%"></i></div>
        ${Q.stem ? `<div class="quiz-q" id="qStem">${Q.stem}</div>` : ''}<div class="quiz-src">${Q.src}${many ? ` · ${Q.parts.length} parts, answer them all` : ''}</div>
        ${Q.parts.map((P, k) => `<div class="qpart" data-k="${k}">
          <div class="${Q.stem ? 'qpart-q' : 'quiz-q'}">${partLabel(Q, k)}${P.q}</div>
          <div class="opts">${P.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
          <div class="feedback"></div></div>`).join('')}
        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;
          quiz.picks[k] = +b.dataset.j; part.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b));
        }));
      });
      $('qReset').addEventListener('click', resetQuiz);
      $('qSubmit').addEventListener('click', () => {
        const fb = $('qFb');
        if (quiz.done) { quiz.i++; quiz.done = false; renderQuiz(); return; }
        const left = quiz.picks.map((p, k) => p === null ? partLabel(Q, k).trim() || `part ${k + 1}` : null).filter(x => x !== null);
        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }
        quiz.done = true; fb.innerHTML = '';
        el.querySelectorAll('.qpart').forEach(part => {
          const k = +part.dataset.k, P = Q.parts[k], ok = quiz.picks[k] === P.ans;
          if (ok) quiz.score++; else quiz.missed.push([quiz.i, k]);
          part.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === P.ans) x.classList.add('right'); else if (j === quiz.picks[k]) x.classList.add('wrong'); });
          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${P.why}</span>`;
        });
        el.querySelector('.quiz-top span:last-child').textContent = `Score: ${quiz.score} of ${QUIZ_MARKS}`;
        $('qSubmit').textContent = quiz.i + 1 < N ? 'Next question' : 'See the summary';
      });
    }

    /* ---------------- Teacher mode ---------------- */
    // Only the teacher link (this page's address + ?teacher) shows the button; students and the
    // Brightspace embed use the plain address. Not a lock: the panel only changes this screen.
    const teacher = $('teacher');
    if (new URLSearchParams(location.search).has('teacher')) $('teacherBtn').hidden = false;
    $('teacherBtn').addEventListener('click', () => { teacher.hidden = !teacher.hidden; });
    $('tClose').addEventListener('click', () => { teacher.hidden = true; });
    $('tExplain').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-explain');
      e.target.textContent = on ? 'Show explanations' : 'Hide explanations'; e.target.classList.toggle('on', on);
    });
    $('tAnswers').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-answers');
      e.target.textContent = on ? 'Show answer labels' : 'Hide answer labels'; e.target.classList.toggle('on', on);
    });
    // free exploration: every step shown at once, no Predict first
    $('tFree').addEventListener('click', e => {
      freeMode = !freeMode; document.body.classList.toggle('free-mode', freeMode);
      e.target.textContent = freeMode ? 'Back to the guided steps' : 'Switch to free exploration'; e.target.classList.toggle('on', freeMode);
      showTab(currentTab);
    });
    const fullBtn = $('tFull');
    if (!document.fullscreenEnabled) fullBtn.hidden = true;
    fullBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
    $('tReset').addEventListener('click', () => { resetQuiz(); showTab(1); });

    // for the checks: the state behind the drawing
    window.__pimState = () => ({ tab: currentTab, step: S.step, scen: S.scen, t: sim.t, end: runEnd(), rate: runEnd() > 0 ? playRate() : 0, L, M, lift: lift(sim.t), machine: machine(), hand: JSON.parse(JSON.stringify(hand)), moments: keyMoments() });
    window.__pimRunToEnd = runToEnd;
    window.addEventListener('resize', () => { if (currentTab <= 4) { lg = null; update(); } });
    showTab(1);
  </script>
  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),
    // and a touch the page grabbed for a drag (its own setPointerCapture call) keeps the page still.
    // (hasPointerCapture can't tell: a touch is always captured implicitly.)
    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
