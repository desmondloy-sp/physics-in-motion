  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const G = 10; // g = 10 m s^-2, as Tutorial 4 takes it
    const RAD = Math.PI / 180;
    const clean = v => (Math.abs(v) < 1e-9 ? 0 : v);
    // 3 significant figures, as the lecturer's copy gives them; exact whole numbers stay whole; an exact value keeps
    // its own figures (0.5, 7.5); a 1e-12 nudge so a binary half rounds up; a true minus sign
    const f3 = v => {
      const x = clean(v);
      if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x)).replace('-', '−');
      const t = (x * (1 + 1e-12)).toPrecision(3);
      if (Math.abs(+t - x) < 1e-9 || Math.abs(x) >= 100) return String(+t).replace('-', '−');
      return t.replace('-', '−');

      tri: { tab: 1, name: 'Triangular plate' },

    /* ---------------- tab 1: hang a lamina freely ----------------
       Lengths in cm, y up. A uniform lamina pivots freely about the point of suspension: angular acceleration =

       plus a little damping so one run ends at rest. phi: the lamina's turn from the way it is drawn (anticlockwise +). */
    function polyProps(pts) { // area, first moments and second polar moment about the origin, for one polygon
      let A = 0, mx = 0, my = 0, J = 0;
      for (let i = 0; i < pts.length; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length], c = x0 * y1 - x1 * y0;

    function makeLamina(id) {

      else if (id === 'card') outer = [[0, 0], [16, 0], [16, 10], [0, 10]];

      const po = polyProps(outer); let A = po.A, mx = po.mx, my = po.my, J = po.J;

      else if (id === 'card') pins = { A: inward([0, 10], C, 1.3), B: inward([16, 10], C, 1.3), C: [8, 8.8] };
      else if (id === 'tri') pins = { A: inward([8, 14], C, 1.5), B: inward([16, 0], C, 1.5), C: inward([0, 0], C, 1.5) };
      else if (id === 'ring') pins = { A: [0, 7], B: [7 * Math.cos(-30 * RAD), 7 * Math.sin(-30 * RAD)], C: [7 * Math.cos(200 * RAD), 7 * Math.sin(200 * RAD)] };

    /* ---------------- tab 2: a uniform metre rule on a pivot ----------------

    const RULE_W = 0.5, RULE_M = RULE_W / G, PIV_H = 0.10;

    /* ---------------- tab 3: a cabinet tilted on one edge ----------------
       Lengths in m. A 1.2 m cabinet of mass 10 kg with a 20 kg load on its top or bottom shelf (the page's own values).

    const CAB = { H: 1.2, mb: 10, ml: 20, LH: 0.2 };
    const T3 = { B: 0.6, load: 'top', tilt0: 10 * RAD, tilt: 10 * RAD, om: 0, result: '' };
    function cab() {
      const B = T3.B, H = CAB.H, mb = CAB.mb, ml = T3.load === 'none' ? 0 : CAB.ml, M = mb + ml;
      const LW = Math.min(0.4, B - 0.12), ly = T3.load === 'bottom' ? 0.15 : H - 0.15;

    /* The Try It! of p. 4-22, seen from the front: the wall on the right, the person's left foot (on the right of the
       picture) against it. x in m along the floor from the left foot's inner edge, y up. Feet: left foot 0 to 0.12 m,
       right foot −0.36 to −0.24 m; G (the body's CG) at x = −0.12 m, 0.95 m up: the page's own values.

    const PERSON = { G: [-0.12, 0.95], lf: [0, 0.12], rf: [-0.36, -0.24], lift: 0.06, kG2: 1.7 * 1.7 / 12 };

    // Example 12: a ball in a dip, on a hump and on a flat surface (drawn in px; a visual model only)
    const SURF_HALF = 60, balls = [0, 1, 2].map(kind => ({ kind, x: 0, v: 0, off: false, fx: 0, fy: 0, fvy: 0 }));
    let eqGeo = null;
    const surfH = (kind, x) => (kind === 0 ? 0.012 * x * x : kind === 1 ? -0.012 * x * x : 0);

      if (R2.mass > 0 && Math.abs(R2.xm - R2.p) > 0.5) dim(ctx, px, onRule(R2.xm)[0], benchY + 18, `${f3(Math.abs(r.dm) * 100 * c)} cm`, COL.mass, 11);
      // which way it turns
      if (!r.balanced && !sim.done) turnArrow(ctx, px, py - th - 26, 18, r.net > 0, r.net > 0 ? COL.cw : COL.acw);
      __pim.handles.push({ id: 'pivot', kind: 'pivot', x: px, y: (py + benchY) / 2 + 6, r: 16 });
    }

    /* tab 3: the cabinet */
    function drawCabinet(ctx, W, H) {
      const c = cab(), floorY = H - 46;
      // room for it standing (B wide, H tall) and lying on its right side (reaching H past its right edge)
      // and 0.4 m on its left for the load's label
      const needW = c.B + c.H + 0.9, needH = Math.max(c.H, c.B) + 0.25;
      const k = frozen ? frozen.k : Math.min((W - 30) / needW, (floorY - 22) / needH);
      const cx = W / 2 - (c.H / 2 - 0.2) * k;
      const t = T3.tilt, cs = Math.cos(t), sn = Math.sin(t), ex = c.B / 2;
      // cabinet frame (x right, y up, origin at the base centre) -> canvas, turned clockwise by t about the right edge
      const toC = (x, y) => { const rx = x - ex; return [cx + (ex + rx * cs + y * sn) * k, floorY - (-rx * sn + y * cs) * k]; };
      geo = { k, cx, floorY, toC };

      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();

      ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 1.5;

      if (c.ml > 0) {
        const y0 = c.ly - CAB.LH / 2, y1 = c.ly + CAB.LH / 2, x0 = -c.LW / 2, x1 = c.LW / 2;
        poly(ctx, [toC(x0, y0), toC(x1, y0), toC(x1, y1), toC(x0, y1)]); ctx.fillStyle = '#dc2626'; ctx.fill(); ctx.strokeStyle = '#7f1d1d'; ctx.stroke();
      }

      const [gx, gy] = toC(0, c.yc), g = cabCG(c, t), inside = g.x < -1e-9, through = Math.abs(g.x) <= 1e-9;
      ctx.setLineDash([6, 5]); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, floorY + 14); ctx.stroke(); ctx.setLineDash([]);
      const edge = toC(ex, 0), left = toC(-ex, 0);
      ctx.lineWidth = 5;
      if (t < 1e-6) { ctx.strokeStyle = COL.ok; ctx.beginPath(); ctx.moveTo(left[0], floorY + 6); ctx.lineTo(edge[0], floorY + 6); ctx.stroke(); label(ctx, 'base', (left[0] + edge[0]) / 2, floorY + 26, '#166534', 'center', 11); }
      else if (t < Math.PI / 2 - 1e-3) {
        ctx.strokeStyle = inside ? COL.ok : COL.bad; ctx.beginPath(); ctx.moveTo(gx, floorY + 6); ctx.lineTo(edge[0], floorY + 6); ctx.stroke();
        dot(ctx, edge[0], edge[1], 5, '#0f172a');
        label(ctx, through ? 'over the edge' : inside ? 'inside the base' : 'outside the base', edge[0], floorY + 26, inside ? '#166534' : '#991b1b', 'center', 11);
      }
      weight(ctx, gx, gy, 46, null);
      label(ctx, 'CG', gx - 9, gy - 2, COL.W, 'right', 12, -1);
      label(ctx, `<i>W</i> = ${f3(c.M * G)} N`, gx + 8, gy + 38, COL.W, 'left', 12, 1);
      // the load's name beside the cabinet, level with the load, clear of the CG's labels
      if (c.ml > 0) { const a = toC(-ex, c.ly); label(ctx, `${c.ml} kg load`, a[0] - 8, a[1], '#7f1d1d', 'right', 11, -1); }
      // drag the top corner on the side away from the edge to tilt it
      const hnd = toC(-ex, c.H); __pim.handles.push({ id: 'cab', kind: 'cab', x: hnd[0], y: hnd[1], r: 22 });
    }

    /* tab 3: the Try It! person */
    function drawPerson(ctx, W, H) {
      const floorY = H - 40, k = frozen ? frozen.k : Math.min((floorY - 26) / 1.85, (W - 40) / 1.3), wx = wallX();
      const ox = W / 2 + 0.2 * k; // the left foot's inner edge (x = 0)
      const ang = personPose().ang;
      const toC = (x, y) => { const [wx, wy] = personAt(x, y); return [ox + wx * k, floorY - wy * k]; };
      geo = { k, ox, floorY, toC };
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, floorY, W, H - floorY);
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
      // the wall: bricks on the right
      const wX = ox + wx * k;
      ctx.fillStyle = '#e5e7eb'; ctx.fillRect(wX, 8, W - wX, floorY - 8); ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1;
      for (let y = floorY; y > 8; y -= 12) { ctx.beginPath(); ctx.moveTo(wX, y); ctx.lineTo(W, y); ctx.stroke(); for (let x = wX + ((y / 12) % 2 ? 0 : 12); x < W; x += 24) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 12); ctx.stroke(); } }
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wX, 8); ctx.lineTo(wX, floorY); ctx.stroke();
      label(ctx, 'Wall', Math.min(W - 24, wX + 26), 22, '#334155', 'center', 11);
      // body parts (m): shoes, legs, shorts, shirt, arms, head
      const up = P3.up ? PERSON.lift : 0;
      const rect = (x0, y0, x1, y1, fill, edge = '#1e293b') => { poly(ctx, [toC(x0, y0), toC(x1, y0), toC(x1, y1), toC(x0, y1)]); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = 1.2; ctx.stroke(); };
      rect(-0.29, 0.06 + up, -0.15, 0.85, '#3b82f6');        // right leg
      rect(-0.09, 0.06, 0.05, 0.85, '#3b82f6');              // left leg
      rect(PERSON.rf[0], up, PERSON.rf[1], 0.06 + up, '#f8fafc'); // right shoe
      rect(PERSON.lf[0], 0, PERSON.lf[1], 0.06, '#f8fafc');      // left shoe
      rect(-0.31, 0.85, 0.07, 1.42, '#fefce8');             // shirt
      rect(-0.36, 0.86, -0.31, 1.40, '#fde68a');            // right arm
      rect(0.07, 0.86, 0.12, 1.40, '#fde68a');              // left arm
      const hd = toC(-0.12, 1.55); ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(hd[0], hd[1], 0.11 * k, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#1e293b'; ctx.stroke();
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(hd[0], hd[1], 0.11 * k, Math.PI * 1.05 - ang, Math.PI * 1.95 - ang); ctx.fill();

      const [gx, gy] = toC(...PERSON.G);
      ctx.setLineDash([6, 5]); ctx.strokeStyle = '#db2777'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, floorY + 14); ctx.stroke(); ctx.setLineDash([]);
      // the base of support stays on the floor where the feet are (a foot that stays down does not move)
      const base = personBase(), b0 = [ox + base[0] * k], b1 = [ox + base[1] * k], inside = personInside();
      ctx.strokeStyle = COL.ok; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(b0[0], floorY + 6); ctx.lineTo(b1[0], floorY + 6); ctx.stroke();
      ctx.strokeStyle = inside ? COL.ok : COL.bad; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(gx, floorY + 6, 4, 0, Math.PI * 2); ctx.stroke();
      weight(ctx, gx, gy, 42, null);
      label(ctx, '<i>G</i>', gx - 9, gy - 4, COL.W, 'right', 13, -1);
      label(ctx, '<i>W</i>', gx + 8, gy + 34, COL.W, 'left', 12, 1);
      label(ctx, P3.up ? 'base: left foot' : 'base: both feet', (b0[0] + b1[0]) / 2, floorY + 26, '#166534', 'center', 11);
      label(ctx, 'Right foot', toC(PERSON.rf[0], 0)[0] - 4, floorY - 14 - up * k, '#334155', 'right', 11, -1);
    }

    /* tab 4: a cone */
    function drawCone(ctx, W, H) {
      const m = coneMode(), floorY = H - 44, { h, r, a } = CONE;
      const k = frozen ? frozen.k : Math.min((floorY - 30) / (h + 2), (W - 30) / (h * 1.55));
      const ox = m === 'apex' ? W * 0.32 : m === 'side' ? W * 0.18 : W * 0.5;
      // the cone's outline and CG in its own frame (cm), for each way it rests
      let pts, cg, toW;
      if (m === 'base') {        // apex up, base on the table; turned clockwise by phi about the right base edge
        pts = [[-r, 0], [r, 0], [0, h]]; cg = [0, CONE.gb];
        toW = (q, ph) => { const dx = q[0] - r, dy = q[1], c = Math.cos(ph), s = Math.sin(ph); return [r + dx * c + dy * s, -dx * s + dy * c]; };
      } else if (m === 'apex') { // apex down on the table; turned clockwise by phi about the apex
        pts = [[0, 0], [r, h], [-r, h]]; cg = [0, CONE.ga];
        toW = (q, ph) => { const c = Math.cos(ph), s = Math.sin(ph); return [q[0] * c + q[1] * s, -q[0] * s + q[1] * c]; };
      } else {                   // lying on its slant side, apex on the left; rolled along by x cm
        const u = [Math.cos(a), Math.sin(a)], n = [-Math.sin(a), Math.cos(a)];
        pts = [[0, 0], [h * u[0] - r * n[0], h * u[1] - r * n[1]], [h * u[0] + r * n[0], h * u[1] + r * n[1]]]; cg = [CONE.ga * u[0], CONE.ga * u[1]];
        toW = (q, ph, x) => [q[0] + x, q[1]];
      }
      const toC = q => [ox + q[0] * k, floorY - q[1] * k];
      geo = { k, ox, floorY, toC };
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, floorY, W, H - floorY);
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
      // the original position (dashed outline) and the height of its CG then
      const ph = m === 'side' ? 0 : C4.phi, xr = m === 'side' ? C4.x : 0;
      const ghost = pts.map(q => toC(toW(q, 0, 0))), now = pts.map(q => toC(toW(q, ph, xr)));
      const h0 = coneCGh(m, 0), hN = coneCGh(m, ph), y0 = floorY - h0 * k;
      ctx.setLineDash([5, 4]); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; poly(ctx, ghost); ctx.stroke();
      ctx.strokeStyle = COL.h0; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(8, y0); ctx.lineTo(W - 8, y0); ctx.stroke(); ctx.setLineDash([]);
      poly(ctx, now); ctx.fillStyle = 'rgba(103,232,249,0.85)'; ctx.fill(); ctx.strokeStyle = '#0e7490'; ctx.lineWidth = 2; ctx.stroke();
      const [gx, gy] = toC(toW(cg, ph, xr));
      weight(ctx, gx, gy, 36, null);
      label(ctx, 'CG', gx - 9, gy - 2, COL.W, 'right', 12, -1);
      label(ctx, '<i>W</i>', gx + 8, gy + 28, COL.W, 'left', 12, 1);
      // the dashed line's name at its right-hand end; the heights themselves are in the readouts below
      label(ctx, 'CG height before', W - 10, Math.max(14, y0 - 11), '#9d174d', 'right', 11, -1);
      // drag the cone: its apex (base mode), its base corner (apex mode) or its CG (side)
      const hp = m === 'base' ? toC(toW([0, h], ph, xr)) : m === 'apex' ? toC(toW([r, h], ph, xr)) : [gx, gy];
      __pim.handles.push({ id: 'cone', kind: 'cone', x: hp[0], y: hp[1], r: 22 });
    }
    function drawBalls(ctx, W, H) {
      const cols = W < 330 ? 1 : 3, slotX = [], refY = [], labY = [];
      for (let i = 0; i < 3; i++) {
        if (cols === 3) { slotX.push(W / 6 + i * W / 3); refY.push(H * 0.5); labY.push(H * 0.8); }
        else { slotX.push(W / 2); refY.push(H * (0.2 + i * 0.3)); labY.push(H * (0.2 + i * 0.3) + 32); }
      }
      const sc = Math.min(1.4, cols === 3 ? (W / 6 - 8) / SURF_HALF : 1.2);
      eqGeo = { slotX, refY, sc }; geo = eqGeo;
      const names = ['(a) dip', '(b) hump', '(c) flat'], types = ['Stable', 'Unstable', 'Neutral'];
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 3; ctx.beginPath();
        for (let x = -SURF_HALF; x <= SURF_HALF; x += 2) { const px = slotX[i] + x * sc, py = refY[i] - surfH(i, x) * sc; if (x === -SURF_HALF) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
        ctx.stroke();
        const home = ballCentre(i, 0, eqGeo);
        ctx.strokeStyle = 'rgba(37,99,235,0.35)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(home.x, home.y, home.r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        const b = balls[i], c = b.off ? { x: b.fx, y: b.fy } : ballCentre(i, b.x, eqGeo);
        if (c.y < H + 20) { ctx.fillStyle = '#2563eb'; ctx.beginPath(); ctx.arc(c.x, c.y, home.r, 0, Math.PI * 2); ctx.fill(); }
        label(ctx, sim.done ? `${names[i]}: ${types[i]}` : names[i], slotX[i], labY[i], '#334155', 'center', 12);
      }
    }

    /* ---------------- the inputs ---------------- */
    // wrap: a long label may take two lines on a phone (the others stay on one line with their value)
    const inp = (k, lab, v, min, max, step, wrap) => `<div class="control-group${wrap ? '' : ' label-row'}"><label for="in_${k}">${lab}</label><input id="in_${k}" type="number" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${plain(v)}" /></div>`;
    function buildInputs() {
      const el = $('inputs'); let h = '';
      $('expWrap').hidden = currentTab === 1;
      if (currentTab === 2) h = inp('p', 'Pivot at (cm mark)', R2.p, 5, 95, 1) + inp('m', 'Mass on the rule (g)', R2.mass, 0, 500, 10) + inp('xm', 'Mass at (cm mark)', R2.xm, 0, 100, 1);
      else if (currentTab === 3) {
        if (PRESETS[S.scen].person) h = '<div class="none">Nothing to set: press Lift the right foot.</div>';
        else h = inp('B', 'Base width (m)', T3.B, 0.3, 1.2, 0.05)
          + `<div class="control-group label-row"><label for="in_load">The 20 kg load</label><select id="in_load"><option value="top">Top shelf</option><option value="bottom">Bottom shelf</option><option value="none">No load</option></select></div>`
          + inp('tilt', 'Tilt angle (°)', Math.round(T3.tilt0 / RAD), 0, 85, 1);
      } else if (currentTab === 4) {
        const m = coneMode();
        h = m === 'balls' ? '<div class="none">Each ball starts a little way from its place: press Let go.</div>'
          : inp('disp', m === 'side' ? 'Roll it along (cm)' : 'Tilt it (°)', C4.disp, 0, DISP_MAX[m], 1);
      }
      el.innerHTML = h;
      el.querySelectorAll('input').forEach(i => i.addEventListener('input', () => readInput(i)));
      const ld = $('in_load'); if (ld) { ld.value = T3.load; ld.addEventListener('change', () => { T3.load = ld.value; resetRun(); toCustom(); update(); }); }
    }
    function inputValue(k) {
      if (currentTab === 2) return k === 'p' ? R2.p : k === 'm' ? R2.mass : R2.xm;
      if (currentTab === 3) return k === 'B' ? T3.B : Math.round(T3.tilt0 / RAD);
      return C4.disp;
    }
    function syncInputs() {
      document.querySelectorAll('#inputs input').forEach(i => {
        if (document.activeElement === i) return;
        const want = plain(inputValue(i.dataset.k));
        if (i.value !== want) i.value = want;
      });
    }
    function readInput(i) {
      const k = i.dataset.k, raw = parseFloat(i.value);
      if (!isFinite(raw)) return;
      const lim = (v, a, b) => Math.max(a, Math.min(b, v));
      if (currentTab === 2) {
        if (k === 'p') R2.p = lim(Math.round(raw), 5, 95); else if (k === 'm') R2.mass = lim(raw, 0, 500); else R2.xm = lim(raw, 0, 100);
        resetRun(); toCustom();
      } else if (currentTab === 3) {
        if (k === 'B') { T3.B = lim(raw, 0.3, 1.2); toCustom(); } else T3.tilt0 = lim(raw, 0, 85) * RAD;
        resetRun();
      } else { C4.disp = lim(raw, 0, +i.max); resetRun(); }
      update();
    }
    function toCustom() {
      if (S.custom || !CUSTOM_NAME[currentTab]) return;
      S.custom = true; presetEl.value = 'custom';
      // the question box keeps its height: nothing above the canvas may move while a finger drags
      const q = $('question'); q.style.minHeight = q.offsetHeight + 'px';
      q.innerHTML = 'Your own values. Choose a scenario from the menu to go back to it.';
      clearFeat();
    }

    /* ---------------- drags ---------------- */
    let drag = null;
    function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function pickHandle(p) {
      if (currentTab === 1 && geo) { // anywhere on the lamina
        const Lm = LAM[S.scen], P = Lm.outer.map(q => geo.toC(q));
        if (insidePoly(p, P)) return __pim.handles[0];
      }
      let best = null, bd = Infinity;
      for (const h of __pim.handles) { const d = Math.hypot(p.x - h.x, p.y - h.y); if (d < (h.r || 14) + 8 && d < bd) { bd = d; best = h; } }
      return best;
    }
    canvas.addEventListener('pointerdown', e => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
      const p = pos(e), h = pickHandle(p);
      if (!h || (currentTab === 3 && PRESETS[S.scen].person)) return;
      if (sim.running) { sim.running = false; sim.last = null; }
      drag = h; frozen = geo;
      if (currentTab === 1) drag.a0 = Math.atan2(-(p.y - geo.pinY), p.x - geo.pinX) - L1.phi;
      canvas.setPointerCapture(e.pointerId); e.preventDefault();
    });
    canvas.addEventListener('pointermove', e => {
      const p = pos(e);
      if (!drag) { canvas.style.cursor = pickHandle(p) ? 'grab' : 'default'; return; }
      canvas.style.cursor = 'grabbing';
      const g = geo;
      if (currentTab === 1) {
        // turned about the pin, at most 60° either side of its rest position (the scale is fitted to that)
        const rest = restPhi(LAM[S.scen], L1.pin), e = wrapA(Math.atan2(-(p.y - g.pinY), p.x - g.pinX) - drag.a0 - rest);
        L1.phi = rest + Math.max(-SWING_MAX, Math.min(SWING_MAX, e)); L1.om = 0; sim.done = false; sim.t = 0;
      }
      else if (currentTab === 2) {
        const xcm = Math.max(0, Math.min(100, Math.round((p.x - g.x0) / g.k * 100)));
        if (drag.kind === 'pivot') R2.p = Math.max(5, Math.min(95, xcm)); else R2.xm = xcm;
        R2.tilt = 0; R2.om = 0; sim.t = 0; sim.done = false; toCustom();
      } else if (currentTab === 3) {
        // the top corner's angle round the pivot edge sets the tilt (whole degrees)
        const c = cab(), e0 = g.toC(c.B / 2, 0), t = Math.atan2(p.x - e0[0], e0[1] - p.y) + Math.atan2(c.B, c.H);
        T3.tilt0 = Math.max(0, Math.min(85, Math.round(t / RAD))) * RAD; T3.tilt = T3.tilt0; T3.om = 0; T3.result = ''; sim.t = 0; sim.done = false;
      } else if (currentTab === 4) {
        const m = coneMode();
        if (m === 'side') C4.disp = Math.max(0, Math.min(20, Math.round((p.x - g.ox) / g.k - CONE.ga * Math.cos(CONE.a))));
        else if (m === 'base') { const e0 = g.toC([CONE.r, 0]); C4.disp = Math.max(0, Math.min(DISP_MAX.base, Math.round(Math.atan2(p.x - e0[0], e0[1] - p.y) / RAD + Math.atan2(CONE.r, CONE.h) / RAD))); }
        else if (m === 'apex') { const e0 = g.toC([0, 0]); C4.disp = Math.max(0, Math.min(30, Math.round(Math.atan2(p.x - e0[0], e0[1] - p.y) / RAD - Math.atan2(CONE.r, CONE.h) / RAD))); }
        sim.t = 0; sim.done = false; resetC4();
      }
      update();
    });
    const endDrag = () => {
      if (!drag) return;
      const was = drag; drag = null; frozen = null;
      // tab 1: let go of the lamina and it swings
      if (was.kind === 'lam' && Math.abs(wrapA(L1.phi - restPhi(LAM[S.scen], L1.pin))) > 0.2 * RAD) start();
      update();
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---------------- readouts, words and working ---------------- */
    function cards(list) {
      const el = $('readout');
      el.className = 'readout' + ({ 3: ' n3', 4: ' n4', 6: ' n6' }[list.length] || '');
      el.innerHTML = list.map(([id, title, value, cls]) => `<div class="readout-card${cls ? ' ' + cls : ''}${hl[id] ? ' hl' : ''}" id="${id}"><div class="title">${title}</div><div class="value">${value}</div></div>`).join('');
    }
    function eq(lines) { return '<div class="math">' + lines.map(l => `<span class="eq${l.lit ? ' lit' : ''}">${l.h || l}</span>`).join('') + '</div>'; }
    const dirWord = M => (M > 0 ? 'clockwise' : M < 0 ? 'anti-clockwise' : 'no turning effect');
    const deg = t => `${f3(t / RAD)}°`;
    function readouts() {
      const words = $('words'), work = $('work');
      work.innerHTML = ''; $('stepText').innerHTML = ''; words.innerHTML = '';
      if (currentTab === 1) {

        case 'cross': return 'The line through A and the line through B both pass through the CG, so they cross there. One line is not enough: the CG could be anywhere along it. A third line, through C, passes through the same point.';
        case 'regular': return 'A rectangular card of uniform density and thickness: the lines from holes near its corners are its diagonals, and they cross at its geometrical centre (p. 4-17).';
        case 'ring': return 'For a ring, the lines cross at its centre, where there is no ring at all: the CG is not on any physical part of the object (p. 4-17).';
        case 'bag': return 'Example 6: the bag hangs freely from the hook, so it comes to rest with its CG directly below the point of suspension.';
        case 'zero': return 'With the pivot at the 50 cm mark, the line of action of <i>W</i> passes through the pivot: <i>d</i> = 0, so the moment of <i>W</i> = 0.5 × 0 = 0 N m. The rule is in equilibrium (p. 4-19).';
        case 'turns': return 'With the pivot at the 30 cm mark, <i>W</i> acts 20 cm to the right of it: moment = 0.5 × 0.2 = 0.1 N m clockwise. Let go, the rule turns clockwise until its right end touches the bench (p. 4-19).';
        case 'balance': { const r = rule(); return `Tutorial 4 A5: about the pivot at 20 cm, <i>W</i> (0.5 N, 30 cm to the right) gives ${sgn(r.MW)} N m and the 150 g mass (1.5 N, 10 cm to the left) gives ${sgn(r.Mm)} N m. Σ<i>M</i> = 0: the rule balances.`; }
        case 'ex8': return 'Example 8: a student wrote “The moment of the rod’s weight about P is downwards and the force of 150 g is acting in the anti-clockwise direction”. A moment is clockwise or anti-clockwise; a weight acts downwards. The correct statement: “The moment of the rod’s weight about P is clockwise and the weight of the 150 g mass is acting downwards.”';
        case 'inside': return `Load on the top shelf, let go at 15°: below its toppling angle (${deg(c3(0.6, 'top').crit)}), the line of action of <i>W</i> is inside the base, so the moment of <i>W</i> about the edge turns it back onto its base.`;
        case 'outside': return `Let go at 20°: past ${deg(c3(0.6, 'top').crit)}, the line of action of <i>W</i> is outside the base, so the moment of <i>W</i> about the edge turns it over.`;
        case 'lower': return `Load on the bottom shelf: the CG is lower (${f3(c3(0.6, 'bottom').yc)} m, not ${f3(c3(0.6, 'top').yc)} m), so it topples only past ${deg(c3(0.6, 'bottom').crit)}. Let go at 20°, it falls back. Lowering the CG makes it more stable (p. 4-33): a coach bus’s luggage compartment is at the bottom.`;
        case 'broader': return `Base 1.0 m wide, load on top: it topples only past ${deg(c3(1.0, 'top').crit)} (the 0.6 m base: ${deg(c3(0.6, 'top').crit)}). Let go at 20°, it falls back. A broader base makes it more stable (p. 4-33): a racing car’s wide track and long wheelbase.`;
        case 'wall': return `Try It! (p. 4-22): with the right foot lifted, the base is the left foot. G is ${f3(-PERSON.G[0] * 100)} cm outside it, and the wall stops you leaning over it: your weight produces an anti-clockwise moment about your left foot, and you lose your balance.`;
        case 'stable': return `Cone on its base, tilted 15°: its CG rises from ${f3(coneCGh('base', 0))} cm to ${f3(coneCGh('base', 15 * RAD))} cm. Let go, the moment of its weight turns it back: stable equilibrium (p. 4-29).`;
        case 'unstable': return `Cone on its apex, tilted 5°: its CG falls from ${f3(coneCGh('apex', 0))} cm to ${f3(coneCGh('apex', 5 * RAD))} cm. Let go, it keeps turning about its apex and its CG keeps moving away: unstable equilibrium (p. 4-30).`;
        case 'neutral': return `Cone on its slant side, rolled along: its CG stays ${f3(coneCGh('side', 0))} cm above the table, wherever it is. It stays where it is put: neutral equilibrium (p. 4-31).`;
        case 'balls': return 'Example 12: in the dip the ball returns (stable equilibrium); on the hump it keeps moving away (unstable equilibrium); on the flat it stays where it is put (neutral equilibrium).';

    /* ---------------- Tab 5: Challenge ---------------- */
    // every answer from the lecturer's copy of Chapter 4 (pp. 4-15 to 4-34)

    const EQ = ['stable equilibrium', 'unstable equilibrium', 'neutral equilibrium', 'not in equilibrium'];
    const QUIZ = [

    // the options are written with the right one first (or in a fixed order); turn each part's list round by a fixed
    // amount so the right answer is not always in the same place
    { let pc = 0; QUIZ.forEach(Q => Q.parts.forEach(P => { const n = P.opts.length, r = (pc++ * 3 + 1) % n;
      P.opts = P.opts.slice(r).concat(P.opts.slice(0, r)); P.ans = (P.ans - r + n) % n; })); }
    const QUIZ_MARKS = QUIZ.reduce((n, Q) => n + Q.parts.length, 0);
    const partLabel = (Q, k) => Q.parts[k].lab ? Q.parts[k].lab + ' ' : '';
    let quiz = { i: 0, score: 0, picks: [], done: false, missed: [] };
    function resetQuiz() { quiz = { i: 0, score: 0, picks: [], done: false, missed: [] }; renderQuiz(); }
    function renderQuiz() {
      const el = $('quiz'), N = QUIZ.length;

        const list = quiz.missed.length
          ? `<p>Go back over these:</p><ul>${quiz.missed.map(([n, k]) => { const Q = QUIZ[n];
              return `<li>Question ${n + 1}${partLabel(Q, k).trim()} (${Q.src}): ${(Q.stem ? Q.stem + ' ' : '') + Q.parts[k].q}</li>`; }).join('')}</ul>`
          : '<p>Every answer right. Well done.</p>';

        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }

          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${P.why}</span>`;
        });
        el.querySelector('.quiz-top span:last-child').textContent = `Score: ${quiz.score} of ${QUIZ_MARKS}`;

  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
