  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const G = 10; // g = 10 m s^-2, as Tutorial 4 takes it
    const RAD = Math.PI / 180;
    const clean = v => (Math.abs(v) < 1e-9 ? 0 : v);
    // 3 significant figures, as the lecturer's copy gives them (1.73 m, 17.3 N m); exact whole numbers stay whole (30 N);
    // an exact value keeps its own figures (0.5, 4.5); a 1e-12 nudge so a binary half rounds up; a true minus sign
    const f3 = v => {
      const x = clean(v);

      const t = (x * (1 + 1e-12)).toPrecision(3);

    /* ---------------- drawing helpers ---------------- */

      });
      const mo = seesaw(0);

    /* tab 4: a beam in equilibrium */
    function drawBeam(ctx, W, H) {
      const narrow = W < 560, sz = narrow ? 11 : 12, st = S.step, s = solve4();
      const g = fitBeam(W, H, narrow ? 26 : 70, narrow ? 26 : 70, H - 118);
      geo = g;
      const ropeTop = 6;
      // ropes and supports
      (B.supports || []).forEach(([kind, x]) => {
        const X = g.X(x);
        if (kind === 'rope') { ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X, ropeTop); ctx.lineTo(X, g.by); ctx.stroke(); ctx.fillStyle = '#94a3b8'; ctx.fillRect(X - 18, 0, 36, ropeTop); }
      });

      (B.supports || []).forEach(([kind, x]) => {
        const X = g.X(x);

        if (kind === 'hinge') { ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(X, g.by, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); dot(ctx, X, g.by, 2.5); }

      // names of the ends and the supports, under the beam

      if (B.ends) { if (B.ends[0]) names.push([0, B.ends[0]]); if (B.ends[1]) names.push([B.L, B.ends[1]]); }
      (B.supports || []).forEach(([kind, x, nm]) => { if (nm) names.push([x, nm]); });
      (B.labels || []).forEach(([x, nm]) => names.push([x, nm]));
      // forces: unknowns orange (? until solved), weights purple, known forces blue
      const solved = f => f.unknown && st >= (f === s.other ? 5 : 4) && s.vals[f.id] !== undefined;
      const valOf = f => (f.unknown ? s.vals[f.id] : f.F);
      const Fmax = Math.max(...B.forces.map(f => (f.unknown ? (s.vals[f.id] || 0) : f.F)), 1);
      const lenOf = f => (f.unknown && !solved(f) ? (narrow ? 50 : 60) : (narrow ? 32 : 38) + (narrow ? 26 : 34) * Math.min(1, Math.abs(valOf(f)) / Fmax));
      const ends = B.forces.map(f => forceEnds(f, g, lenOf(f)));

      // each force from the chosen point, one row each, above the beam

        for (let i = 1; i < xs.length; i++) dim(ctx, g.X(xs[i - 1]), g.X(xs[i]), rowY(0), lenTxt(xs[i] - xs[i - 1], B.unit), '#334155', sz);
      } else {
        let row = 0;
        B.forces.forEach(f => {
          const r = Math.abs(f.x - s.xp); if (r < 1e-9) return;
          const col = f.unknown ? COL.unk : f.weight ? COL.W : COL.known;
          dim(ctx, Math.min(g.X(f.x), g.X(s.xp)), Math.max(g.X(f.x), g.X(s.xp)), rowY(row++), lenTxt(r, B.unit), col, sz);
        });
      }
      B.forces.forEach((f, i) => {
        const e = ends[i], col = f.unknown ? COL.unk : f.weight ? COL.W : COL.known;
        arrow(ctx, e.a[0], e.a[1], e.b[0], e.b[1], col, 3.5, 11);
        if (f.drag) __pim.handles.push({ id: f.id, kind: 'pt', x: e.P[0], y: e.P[1] });
      });
      names.forEach(([x, nm]) => label(ctx, nm, g.X(x), g.by + 36, '#0f172a', 'center', sz + 1, 1));
      B.forces.forEach((f, i) => {
        const e = ends[i], col = f.unknown ? COL.unk : f.weight ? COL.W : COL.known, up = e.free[1] < e.P[1];
        let t;
        if (f.unknown) t = solved(f) ? `${symOf(f)} = ${f3(valOf(f))} N` : `${symOf(f)} = ?`;
        else t = f.weight ? `<i>W</i> = ${f3(f.F)} N` : `${f3(f.F)} N${f.name ? ` (${f.name})` : ''}`;
        label(ctx, t, e.free[0], e.free[1] + (up ? -12 : 12), col, 'center', sz, up ? -1 : 1);
      });
      if (st >= 2 && s.blocked) label(ctx, 'Two unknown forces have a moment about this point', W / 2, 14, '#b91c1c', 'center', sz);
      else if (st >= 4 && s.u) label(ctx, `About ${s.pt.name}: Σ<i>M</i> = 0 ✓`, W / 2, 14, '#15803d', 'center', sz);
    }

    /* ---------------- the inputs ---------------- */
    function buildInputs() {
      const el = $('inputs');

    }

    function inputValue(k) {
      if (currentTab === 1) return k === 'F' ? B.forces[0].F : clean(B.forces[0].x - B.xp);
      if (currentTab === 2) return B.forces[+k.slice(1)].F;

    function syncInputs() {
      document.querySelectorAll('#inputs input').forEach(i => {

    }
    function readInput(i) {

      if (!isFinite(raw)) return;
      if (currentTab === 1) {
        const f = B.forces[0];
        if (k === 'F') f.F = Math.max(0, Math.min(500, raw));
        else f.x = Math.max(B.xp, Math.min(B.L, B.xp + raw));
      } else if (currentTab === 2) B.forces[+k.slice(1)].F = Math.max(0, Math.min(1000, raw));
      else if (currentTab === 3) {
        const kid = K.find(x => x.id === k.slice(1));
        if (k[0] === 'm') kid.m = Math.max(1, Math.min(100, raw)); else kid.x = Math.max(-HALF, Math.min(HALF, raw));
        resetSeesaw();
      }

    }
    function toCustom() {
      if (S.custom) return;

      // the question box keeps its height: nothing above the canvas may move while a finger drags
      const q = $('question'); q.style.minHeight = q.offsetHeight + 'px';
      q.innerHTML = 'Your own values. Choose a scenario from the menu to go back to the example.';
      clearFeat();
    }

    /* ---------------- drags ---------------- */
    let drag = null;
    function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function pickHandle(p) {
      let best = null, bd = Infinity;
      for (const h of __pim.handles) {
        const d = Math.hypot(p.x - h.x, p.y - h.y), r = h.r ? h.r + 8 : 20;
        // the free end of an arrow wins over the point it acts at when both are near
        const score = d - (h.kind === 'tip' ? 6 : 0);
        if (d < r && score < bd) { bd = score; best = h; }
      }
      return best;
    }
    const snapTo = (v, s) => Math.round(v / s) * s;
    canvas.addEventListener('pointerdown', e => {
      // a box still focused after typing is never refreshed (syncInputs skips it): let go of it first
      if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
      const p = pos(e), h = pickHandle(p);

    });
    canvas.addEventListener('pointermove', e => {
      const p = pos(e);

      canvas.style.cursor = 'grabbing';
      if (currentTab === 3) {
        const k = K.find(x => x.id === drag.id), g = geo;
        const ux = Math.cos(sim.tilt), uy = Math.sin(sim.tilt);
        k.x = clean(snapTo(Math.max(-HALF, Math.min(HALF, ((p.x - g.cx) * ux + (p.y - g.cy) * uy) / g.px)), 0.05));
        resetSeesaw();
      } else {
        const f = B.forces.find(x => x.id === drag.id), g = geo;

        } else {

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* ---------------- readouts, words and working ---------------- */

    }

    const dirWord = M => (M > 0 ? 'clockwise' : M < 0 ? 'anti-clockwise' : 'no turning effect');
    // d as the notes work it out: r if F is at right angles, r sin θ if not
    function dWork(f, xp) {

      if (currentTab === 1) {

        cards([['rF', 'Force <i>F</i>', `${f3(f.F)} N`], ['rR', 'Distance from the pivot along the beam', lenTxt(r, B.unit)], ['rTh', 'Angle between <i>F</i> and the beam', `${plain(th)}°`],
          ['rD', 'Perpendicular distance <i>d</i>', st >= 3 ? `${f3(d)} m` : '?'], ['rM', 'Moment <i>M</i> = <i>F</i> × <i>d</i>', st >= 4 ? `${f3(M)} N m` : '?']]);

          3: 'The perpendicular distance <i>d</i>: the shortest distance from the pivot to the line of action (green).',
          4: 'The moment: <i>M</i> = <i>F</i> × <i>d</i> (notes p. 4-3).' })[st];
        if (st >= 3) {
          const dw = dWork(f, xp), L = [];
          if (r < 1e-9) L.push({ h: '<i>F</i> acts at the pivot: <i>d</i> = 0', lit: st === 3 });
          else if (d < 1e-9) L.push({ h: `<i>d</i> = ${plain(r)} sin ${plain(th)}° = 0 m: <i>F</i> acts along the beam`, lit: st === 3 });
          else if (Math.abs(th - 90) < 1e-6) L.push({ h: `<i>d</i> = ${f3(d)} m: <i>F</i> is at right angles to the beam`, lit: st === 3 });
          else L.push({ h: `<i>d</i> = ${dw.s} = ${f3(d)} m`, lit: st === 3 });
          if (st >= 4) L.push({ h: `<i>M</i> = <i>F</i> × <i>d</i> = ${f3(f.F)} × ${f3(d)} = <span class="nw">${f3(M)} N m</span>`, lit: true });
          work.innerHTML = eq(L);
        }
        words.innerHTML = st < 3 ? 'Drag the dot where <i>F</i> acts along the beam, or drag the free end of the arrow to turn the force.'

          : `The perpendicular distance (${f3(d)} m) is ${Math.abs(d - r) < 1e-9 ? 'the same as' : 'shorter than'} the distance along the beam (${lenTxt(r, B.unit)}).`;

      }

        const name = (f, i) => B.forces.length === 1 ? `the ${f3(f.F)} N force` : f.weight ? 'the weight' : `the ${f3(f.F)} N force`;
        const list = B.forces.map((f, i) => [`rM${i + 1}`, `Moment of ${name(f, i)}`, st >= 3 ? `${sgn(Ms[i])} N m` : st >= 2 ? dirWord(Ms[i]) : '?']);
        list.push(['rNet', 'Net moment Σ<i>M</i>', st >= 4 ? `${sgn(net)} N m` : '?'], ['rTurn', 'The rod turns', st >= 4 ? (net > 0 ? 'clockwise' : net < 0 ? 'anti-clockwise' : 'not at all') : '?']);

          4: 'The net moment: Σ<i>M</i> = sum of clockwise moments + sum of anti-clockwise moments (p. 4-11).' })[st];
        if (st >= 3) {

            return { h: `${f.weight ? '<i>W</i>' : f3(f.F) + ' N'}: &nbsp;<i>M</i> = ${M < 0 ? '−' : ''}${f3(f.F)} × ${dw.s} = <span class="nw">${sgn(M)} N m</span>${M ? ` (${dirWord(M)})` : ''}`, lit: st === 3 };
          });
          if (st >= 4 && B.forces.length > 1) {

            if (net) L.push({ h: `or <span class="nw">${f3(Math.abs(net))} N m</span> ${dirWord(net)}`, lit: true });

          : `Clockwise moments are positive, anti-clockwise moments negative.${st >= 4 ? (net ? ` Net moment ${sgn(net)} N m: the rod turns ${dirWord(net)}.` : ' The moments cancel: the rod does not turn.') : ''}`;

    function work4(s, st) {

    // the options are written with the right one first; turn each part's list round by a fixed amount so the right
    // answer is not always in the same place (positions 4, 1, 2, 3, 4, 1, ... down the quiz)
    { let pc = 0; QUIZ.forEach(Q => Q.parts.forEach(P => { const n = P.opts.length, r = (pc++ * 3 + 1) % n;
      P.opts = P.opts.slice(r).concat(P.opts.slice(0, r)); P.ans = (P.ans - r + n) % n; })); }
    const QUIZ_MARKS = QUIZ.reduce((n, Q) => n + Q.parts.length, 0);
    const partLabel = (Q, k) => Q.parts[k].lab ? Q.parts[k].lab + ' ' : Q.parts.length > 1 && Q.parts[k].lab === undefined ? `(${'abcdefgh'[k]}) ` : '';
    let quiz = { i: 0, score: 0, picks: [], done: false, missed: [] };
    function resetQuiz() { quiz = { i: 0, score: 0, picks: [], done: false, missed: [] }; renderQuiz(); }
    function renderQuiz() {
      const el = $('quiz'), N = QUIZ.length;
      if (quiz.i >= N) {
        const list = quiz.missed.length
          ? `<p>Go back over these:</p><ul>${quiz.missed.map(([n, k]) => { const Q = QUIZ[n];
              return `<li>Question ${n + 1}${partLabel(Q, k).trim()} (${Q.src}): ${(Q.stem ? Q.stem + ' ' : '') + Q.parts[k].q}</li>`; }).join('')}</ul>`
          : '<p>Every answer right. Well done.</p>';
        el.innerHTML = `<div class="quiz-top"><span>Summary</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div><div class="quiz-bar"><i style="width:100%"></i></div>
          <div class="quiz-sum"><div class="quiz-q">You scored ${quiz.score} out of ${QUIZ_MARKS}.</div>${list}</div>
          <div class="row-btns"><button type="button" id="qAgain">Try the quiz again</button></div>`;
        $('qAgain').addEventListener('click', resetQuiz);
        return;
      }
      const Q = QUIZ[quiz.i], many = Q.parts.length > 1;
      quiz.picks = Q.parts.map(() => null);
      el.innerHTML = `<div class="quiz-top"><span>Question ${quiz.i + 1} of ${N}</span><span>Score: ${quiz.score} of ${QUIZ_MARKS}</span></div>
        <div class="quiz-bar"><i style="width:${(quiz.i / N) * 100}%"></i></div>
        ${Q.stem ? `<div class="quiz-q" id="qStem">${Q.stem}</div>` : ''}<div class="quiz-src">${Q.src}${many ? ` · ${Q.parts.length} parts, answer them all` : ''}</div>
        ${Q.parts.map((P, k) => `<div class="qpart" data-k="${k}">
          <div class="${Q.stem ? 'qpart-q' : 'quiz-q'}">${partLabel(Q, k)}${P.q}</div>
          <div class="opts">${P.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
          <div class="feedback"></div></div>`).join('')}
        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;
          quiz.picks[k] = +b.dataset.j; part.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b));
        }));
      });
      $('qReset').addEventListener('click', resetQuiz);
      $('qSubmit').addEventListener('click', () => {
        const fb = $('qFb');
        if (quiz.done) { quiz.i++; quiz.done = false; renderQuiz(); return; }
        const left = quiz.picks.map((p, k) => p === null ? partLabel(Q, k).trim() || `part ${k + 1}` : null).filter(x => x !== null);
        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }
        quiz.done = true; fb.innerHTML = '';
        el.querySelectorAll('.qpart').forEach(part => {
          const k = +part.dataset.k, P = Q.parts[k], ok = quiz.picks[k] === P.ans;
          if (ok) quiz.score++; else quiz.missed.push([quiz.i, k]);
          part.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === P.ans) x.classList.add('right'); else if (j === quiz.picks[k]) x.classList.add('wrong'); });
          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${P.why}</span>`;
        });
        el.querySelector('.quiz-top span:last-child').textContent = `Score: ${quiz.score} of ${QUIZ_MARKS}`;
        $('qSubmit').textContent = quiz.i + 1 < N ? 'Next question' : 'See the summary';
      });
    }

    /* ---------------- Teacher mode ---------------- */
    // Only the teacher link (this page's address + ?teacher) shows the button; students and the
    // Brightspace embed use the plain address. Not a lock: the panel only changes this screen.
    const teacher = $('teacher');
    if (new URLSearchParams(location.search).has('teacher')) $('teacherBtn').hidden = false;
    $('teacherBtn').addEventListener('click', () => { teacher.hidden = !teacher.hidden; });
    $('tClose').addEventListener('click', () => { teacher.hidden = true; });
    $('tExplain').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-explain');
      e.target.textContent = on ? 'Show explanations' : 'Hide explanations'; e.target.classList.toggle('on', on);
    });
    $('tAnswers').addEventListener('click', e => {
      const on = document.body.classList.toggle('no-answers');
      e.target.textContent = on ? 'Show answer labels' : 'Hide answer labels'; e.target.classList.toggle('on', on);
    });
    // free exploration: every step shown at once, no Predict first
    $('tFree').addEventListener('click', e => {
      freeMode = !freeMode; document.body.classList.toggle('free-mode', freeMode);
      e.target.textContent = freeMode ? 'Back to the guided steps' : 'Switch to free exploration'; e.target.classList.toggle('on', freeMode);
      showTab(currentTab);
    });
    const fullBtn = $('tFull');
    if (!document.fullscreenEnabled) fullBtn.hidden = true;
    fullBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
    $('tReset').addEventListener('click', () => { resetQuiz(); showTab(1); });

    window.addEventListener('resize', () => { if (currentTab <= 4) update(); });
    showTab(1);
  </script>
  <script>
    // Embedded (Brightspace): tell the page around the frame how tall this page is, so a resize script in the
    // embed code can fit the frame to it (no blank space, no inner scrollbar). Measured from the content, not
    // scrollHeight, which never drops below the frame's own height and so could never shrink it.
    (function () {
      if (window.parent === window) return;
      let last = 0;
      function height() {
        const c = document.querySelector('.container'), cs = getComputedStyle(document.body);
        return Math.ceil(c.getBoundingClientRect().bottom + window.scrollY + parseFloat(cs.paddingBottom) + parseFloat(cs.marginBottom) + 4);
      }
      function send(force) {
        const h = height();
        if (!force && Math.abs(h - last) < 2) return;
        last = h;
        window.parent.postMessage({ type: 'pim-height', page: location.pathname.split('/').pop(), height: h }, '*');
      }
      new ResizeObserver(() => send(false)).observe(document.querySelector('.container'));
      window.addEventListener('load', () => send(true));
      // the embed's script asks once it is listening, in case this page loaded first
      window.addEventListener('message', e => { if (e.data && e.data.type === 'pim-height?') send(true); });
      send(true);
    })();
  </script>
  <script>
    // Phones: a swipe that starts on an empty part of a drawing scrolls the page (touch-action: pan-y),
    // and a touch the page grabbed for a drag (its own setPointerCapture call) keeps the page still.
    // (hasPointerCapture can't tell: a touch is always captured implicitly.)
    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
      let grabbed = false;
      const capture = c.setPointerCapture;
      c.setPointerCapture = function (id) { grabbed = true; return capture.call(this, id); };
      for (const t of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) c.addEventListener(t, () => { grabbed = false; });
      c.addEventListener('touchmove', e => { if (grabbed && e.cancelable) e.preventDefault(); }, { passive: false });
    });
  </script>
