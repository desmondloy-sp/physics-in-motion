  <script>
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), graphCv = $('graph'), presetEl = $('preset');
    let currentTab = 1, freeMode = false;

    /* ---------------- numbers and symbols ---------------- */
    const G = 10; // g = 10 m s^-2, as the notes and Tutorial 5 take it
    const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
    const clean = v => (Math.abs(v) < 1e-9 ? 0 : v);
    // 3 significant figures, as the lecturer's copy gives them (173 J, 64.3 J, 12.9 N); exact whole numbers stay
    // whole (200 J, 0 J); a 1e-12 nudge so a binary half rounds up; a true minus sign

    // an angle mark at (x, y) between two canvas directions a0 and a1 (radians), with its label

    function angleMark(ctx, x, y, a0, a1, r, text, color, nudge = 1) {

      ctx.font = 'bold 11px Arial'; const w = richText(ctx, text, 0, 0, true) + 6, h = 11 * 1.6;
      // push the card's centre out until its box clears the circle of radius r + 6 in the direction of the mid-line
      const reach = r + 6 + Math.abs(c) * w / 2 + Math.abs(s) * h / 2;

    // a "nice" gridline step: 1, 2, 2.5 or 5 times a power of ten, giving at most `max` steps
    function niceStep(range, max) {

      for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= raw - 1e-12) return k * p;

    function pane(r, name) { PANE = name; __pim.panes.push(Object.assign({ name }, r)); return r; }

    /* ---------------- drawing: the scene ---------------- */
    let dragging = null, k3 = null, fitHold = null;
    function draw() {
      __pim = window.__pim = { labels: [], arrows: [], panes: [], handles: [] };
      const c = setup(canvas); if (!c) return;
      const { ctx, W, H } = c;
      CW = W; CH = H;
      if (currentTab <= 2) drawFD(ctx, W, H);
      else if (currentTab === 3) drawRun(ctx, W, H);
      else drawLift(ctx, W, H);
      drawGraph();
    }

    /* tabs 1 and 2: the object, the force, the distance, the angle and the part of the force along the motion */
    function fitFD(W, H) {
      const P = P12, narrow = W < 560, bs = narrow ? 50 : 66;
      const floorY = Math.round(H * (P.weight ? 0.5 : 0.62));
      const cy0 = floorY - bs / 2, up = cy0 - bs / 2 - 50, down = H - floorY - 22;
      const Lmax = Math.max(40, Math.min(narrow ? 100 : 170, up));
      // room on the left for any arrow that can point backwards: a push, and on tab 2 a pull turned past 90°
      const leftRoom = P.push || currentTab === 2 || P.th > 90 ? Math.round(Lmax + bs / 2 + 30) : 24;
      const cx = leftRoom + bs / 2, cy = cy0, front = leftRoom + bs;
      let kF = Lmax / P.Frange;
      if (P.weight) kF = Math.min(kF, (down - 8) / (P.m * G));
      const kd = (W - 30 - front) / P.drange;
      return { narrow, bs, floorY, leftRoom, cx, cy, front, kF, kd, Lmax };
    }
    function forceGeom(g) {
      const P = P12, ang = rad(P.th) * (P.below ? -1 : 1), ux = Math.cos(ang), uy = -Math.sin(ang), L = P.F * g.kF;
      if (P.push) { const x2 = g.leftRoom - 2, y2 = g.cy; return { ux, uy, x1: x2 - ux * L, y1: y2 - uy * L, x2, y2, free: 'tail' }; }
      // a pull starts where the line from the object's centre leaves the object
      const r = (g.bs / 2) / Math.max(Math.abs(ux), Math.abs(uy)), x1 = g.cx + ux * r, y1 = g.cy + uy * r;
      return { ux, uy, x1, y1, x2: x1 + ux * L, y2: y1 + uy * L, free: 'tip', r };
    }
    let fdFit = null;
    function drawFD(ctx, W, H) {
      const P = P12, st = S.step, s = fd();
      pane({ x: 0, y: 0, w: W, h: H }, 'scene');
      if (!fdFit || !dragging) fdFit = fitFD(W, H);
      const g = fdFit, { bs, floorY, leftRoom, cx, cy, front, kF, kd } = g;
      floorLine(ctx, 8, W - 8, floorY);
      // where the object ends up (step 2), dashed

      if (st >= 2) { ctx.setLineDash([5, 4]); ctx.strokeStyle = '#15803d'; ctx.lineWidth = 1.5; ctx.strokeRect(xEnd - bs, floorY - bs, bs, bs); ctx.setLineDash([]); }
      // the object: light green with a black label, so the force arrows stand out against it
      roundRect(ctx, leftRoom, floorY - bs, bs, bs, 5, '#bbf7d0', '#15803d');

      __pim.labels.push({ pane: PANE, text: '', x: leftRoom, y: floorY - bs, w: bs, h: bs, obstacle: true });
      ctx.fillStyle = '#0f172a'; ctx.font = `bold ${g.narrow ? 11 : 12}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(P.m ? `${plain(P.m)} kg` : P.obj, cx, cy); ctx.textBaseline = 'alphabetic';
      const cap = 'It moves to the right.';
      ctx.fillStyle = '#334155'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
      richText(ctx, cap, 10, 18);
      __pim.labels.push({ pane: PANE, text: cap, x: 8, y: 8, w: ctx.measureText(cap).width + 4, h: 18, title: true });

      // the force F (step 1)
      const f = forceGeom(g);
      if (P.F > 1e-9) {
        arrow(ctx, f.x1, f.y1, f.x2, f.y2, COL.F, 3.5, 12);
        const lab = `${P.who ? 'the man: ' : ''}<i>F</i> = ${gv(P, 'F')} N`;
        // a push's label goes beside its tail: to the left when there is room, else above it
        // (above the tail when the push points down, below it when the push points up: away from the shaft)
        if (f.free === 'tail') { if (f.x1 > 120) label(ctx, lab, f.x1 - 8, f.y1, COL.F, 'right', 12, -1); else if (f.y1 > f.y2 + 0.5) label(ctx, lab, f.x1 - 4, f.y1 + 16, COL.F, 'left', 12, 1); else label(ctx, lab, f.x1 - 4, f.y1 - 16, COL.F, 'left', 12, -1); }
        else if (f.ux > 0.25) label(ctx, lab, f.x2 + 6, f.y2 - 12, COL.F, 'left', 12, -1);
        else if (f.ux < -0.25) label(ctx, lab, f.x2 - 6, f.y2 - 12, COL.F, 'right', 12, -1);

      const fx = f.free === 'tail' ? f.x1 : f.x2, fy = f.free === 'tail' ? f.y1 : f.y2;

      if (P.vert && !S.custom && P.F > 1e-9) {

      }

      if (P.weight) {
        const L = s.mg * kF;
        arrow(ctx, cx, floorY, cx, floorY + L, COL.W, 3.5, 12);
        label(ctx, `weight <i>mg</i> = ${f3(s.mg)} N`, cx - 8, floorY + L * 0.7, COL.W, 'right', 12, 1);
        if (st >= 3) label(ctx, '90° to the motion', cx + 10, floorY + L - 6, COL.W, 'left', 11, 1);
      }
      // the distance moved d (step 2)
      const dy = floorY + 24;
      if (st >= 2) {
        ctx.strokeStyle = COL.d; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(front, dy - 8); ctx.lineTo(front, dy + 8); ctx.moveTo(xEnd, dy - 8); ctx.lineTo(xEnd, dy + 8); ctx.stroke();
        arrow(ctx, front, dy, xEnd, dy, COL.d, 2.5, 10);
        label(ctx, `<i>d</i> = ${gv(P, 'd')} m`, (front + xEnd) / 2, dy + 18, COL.d, 'center', 12, 1);
        __pim.handles.push({ id: 'd', x: xEnd, y: dy, r: 16 });
      }
      // the angle θ between F and the direction of motion (step 3)
      // (labels along a horizontal arrow sit above it, stacked upwards; the floor is just below)
      const midX = (f.x1 + f.x2) / 2, topY = Math.min(f.y1, f.y2);
      const flat = P.th < 0.5 || P.th > 150;

        if (P.th < 0.5) label(ctx, '<i>θ</i> = 0°: along the motion', midX, topY - 34, '#334155', 'center', 11, -1);
        else if (P.th > 150) label(ctx, `<i>θ</i> = ${gv(P, 'th')}°: against the motion`, midX, topY - 34, '#334155', 'center', 11, -1);
        else if (f.free === 'tail') {
          dashLine(ctx, f.x2, f.y2, f.x2 - 60, f.y2, '#475569');
          let aS = Math.atan2(f.y1 - f.y2, f.x1 - f.x2); if (aS < 0) aS += 2 * Math.PI;

          // since the wedge beside a push is too narrow for it

          label(ctx, `<i>θ</i> = ${gv(P, 'th')}°`, f.x2 - 40, f.y2 + (f.y1 < f.y2 ? 16 : -16), '#334155', 'center', 11, f.y1 < f.y2 ? 1 : -1);
        } else if (P.th < 40) {
          // a small angle: the wedge is too narrow for the label, so it goes just under the dashed line

          ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(f.x1, f.y1, 28, Math.atan2(f.uy, f.ux), 0); ctx.stroke();
          label(ctx, `<i>θ</i> = ${gv(P, 'th')}°`, f.x1 + 40, f.y1 + 16, '#334155', 'center', 11, 1);
        } else {

          ctx.font = 'bold 11px Arial'; const wC = richText(ctx, txt, 0, 0, true) + 6;

    /* tab 3: the block on a level floor; the camera follows the block */
    const FLOOR3 = 84; // the floor's distance from the canvas bottom: one constant, shared by the drawing and the drag
    function drawRun(ctx, W, H) {
      const P = P3, st = motion3(sim.t), narrow = W < 560;
      pane({ x: 0, y: 0, w: W, h: H }, 'scene');
      const floorY = H - FLOOR3, bs = P.car ? 64 : 54, top = floorY - bs;
      const ppm = P.D > 20 ? Math.min(7, (W * 0.5) / (P.stopIn || P.D)) : (narrow ? 44 : 64), bx = W * 0.42;
      const X = m => bx + (m - st.x) * ppm;
      ctx.fillStyle = P.f > 0 ? '#ede4d3' : '#eef2f7'; ctx.fillRect(0, floorY, W, H - floorY);
      if (P.f > 0) { ctx.fillStyle = 'rgba(120,90,50,0.35)'; for (let x = 4; x < W; x += 9) ctx.fillRect(x, floorY + 3 + (x * 7) % 5, 3, 2); }
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
      // the distance marks scroll past
      const every = P.D > 20 ? 10 : 1;
      ctx.fillStyle = '#475569'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
      for (let m = 0; m <= P.D + 1e-9; m += every) {
        const x = X(m); if (x < -30 || x > W + 30) continue;
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, floorY); ctx.lineTo(x, floorY + 8); ctx.stroke();
        const lw = ctx.measureText(`${m} m`).width / 2;
        // (no number where the weight arrow and its label hang below the block)
        if (x - lw >= 0 && x + lw <= W && (x + lw < bx - 6 || x - lw > bx + 96)) ctx.fillText(`${m} m`, x, floorY + 20);
      }
      // the distance moved so far, from the start line to the block's front
      const xs = X(0) + bs / 2, xb = bx + bs / 2;
      if (st.x > 1e-6) {
        const y = floorY + 52, a = Math.max(2, xs);
        if (xs >= 0) { ctx.strokeStyle = COL.d; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(xs, y - 7); ctx.lineTo(xs, y + 7); ctx.stroke(); }
        if (xb - a > 2) arrow(ctx, a, y, xb, y, COL.d, 2.5, 9);
        label(ctx, `<i>d</i> = ${f3(st.x)} m`, (a + xb) / 2, y + 16, COL.d, 'center', 11, 1);
      }
      // the block
      roundRect(ctx, bx - bs / 2, top, bs, bs, 6, '#bbf7d0', '#15803d');
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(P.car ? 'car' : `${plain(P.m)} kg`, bx, top + bs / 2 - (P.car ? 8 : 0));
      if (P.car) ctx.fillText(`${plain(P.m)} kg`, bx, top + bs / 2 + 8);

      // force scale (newtons to pixels), held while a finger drags; the weight and normal force to their own scale
      if (!dragging || !k3) k3 = Math.min(W * 0.2, 120) / Math.max(P.F, P.f, 1);
      const kv = 46 / st.mg, cy = top + bs / 2;
      const forceOn = !(st.stopped && P.F > 1e-9), moving = !st.done && !st.never && !st.lifts && (st.v > 1e-9 || sim.t === 0);
      // the weight hangs below the block, clear of its label
      arrow(ctx, bx, floorY - 6, bx, floorY - 6 + st.mg * kv, COL.W, 3, 10);
      label(ctx, `<i>mg</i> = ${N_(st.mg)}`, bx + 6, floorY + 30, COL.W, 'left', 11, 1);
      // friction along the floor, against the motion, only while the block slides
      if (P.f > 1e-9 && (moving || (st.done && !st.stopped))) {
        const L = Math.min(P.f * k3, W * 0.35);

      }

      }
      ctx.fillStyle = '#334155'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
      const head = `<i>t</i> = ${tx(sim.t)} s     <i>v</i> = ${f3(st.v)} ${MS1}`;
      richText(ctx, head, 10, 18);

      const status = st.lifts ? ['It would leave the floor.', COL.R] : st.never ? ['It does not move: no work.', COL.R] : st.stopped ? [P.car ? 'The car has stopped.' : 'Stopped.', '#334155'] : null;
      if (status) label(ctx, status[0], W - 8, 18, status[1], 'right', 11);
    }

    /* tab 4: lifting at constant speed */
    function drawLift(ctx, W, H) {
      const P = P4, st = state4(sim.t), F = force4(), mg = P.m * G;
      pane({ x: 0, y: 0, w: W, h: H }, 'scene');
      const floorY = H - (P.kind === 'ramp' ? 64 : 34); // the ramp's box starts on the floor: room for its weight arrow
      ctx.fillStyle = '#eef2f7'; ctx.fillRect(0, floorY, W, H - floorY);
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
      const kf = 52 / mg; // force arrows: the weight is 52 px, the others to the same scale
      if (P.kind === 'lift') {
        const mx = W * 0.45, my = 58, bw = 70, bh = 44, bx = P.motor ? mx - 30 : mx;
        // the scale leaves room above the lifted mass for its force arrow (and below the motor)
        const k = (floorY - (P.motor ? my + 30 : 0) - bh - 52 * 1.0 - 34) / P.h, yb = floorY - st.y * k;
        // the target height, dashed
        dashLine(ctx, bx - bw / 2 - 30, floorY - P.h * k, bx + bw / 2 + 100, floorY - P.h * k, '#cbd5e1');
        ctx.setLineDash([5, 4]); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.strokeRect(bx - bw / 2, floorY - bh, bw, bh); ctx.setLineDash([]);
        if (P.motor) {

          label(ctx, 'Motor', mx + 36, my, '#334155', 'left', 12);
          ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, my); ctx.lineTo(bx, yb - bh); ctx.stroke();
        }
        roundRect(ctx, bx - bw / 2, yb - bh, bw, bh, 4, '#fdba74', '#9a3412');
        ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`${plain(P.m)} kg`, bx, yb - bh / 2); ctx.textBaseline = 'alphabetic';
        // the lifting force up (along the rope), the weight down: equal, so the speed is constant
        arrow(ctx, bx + 18, yb - bh, bx + 18, yb - bh - F * kf, COL.F, 3.5, 11);
        label(ctx, `<i>F</i> = ${f3(F)} N${P.motor ? ' (motor)' : ' (the man)'}`, bx + 26, yb - bh - F * kf + 8, COL.F, 'left', 12, -1);
        arrow(ctx, bx - 18, yb - bh / 2, bx - 18, yb - bh / 2 + mg * kf, COL.W, 3.5, 11);
        label(ctx, `<i>mg</i> = ${f3(mg)} N`, bx - 26, yb - bh / 2 + mg * kf - 8, COL.W, 'right', 12, 1);

          zero: () => { want('a1d'); S.step = 5; hl = { rW: true }; },

          equal: () => { want('rough'); sim.t = runEnd(); hl = { rTot: true, rKE: true }; },

          against: () => { want('against'); sim.t = runEnd(); hl = { rWF: true, rX: true }; },

    function featNote(id) {
      switch (id) {
        case 'joule': return 'A 1 N force that moves an object 1 m in the direction of the force does 1 joule of work: 1 N × 1 m = 1 N m = 1 J (notes p. 5-3).';
        case 'double': return `<i>W</i> = 50.0 × 8.00 = ${J(fd().W)}: twice the 200 J of Example 1(a). Twice the distance, twice the work, since <i>W</i> = <i>F</i> × <i>d</i>.`;
        case 'perp': return 'The force of gravity (100 N) acts downward and perpendicular to the direction of motion of the box. Therefore, work done on the box by gravity is zero (Example 2, p. 5-5).';
        case 'line': return 'The graph of <i>W</i> against <i>d</i> is a straight line through the origin: the work done grows in step with the distance. Its gradient is the force along the motion, 20 N.';
        case 'cos0': return `At <i>θ</i> = 0°, cos 0° = 1, so <i>W</i> = <i>F</i> × <i>d</i> = 50.0 × 4.00 = ${J(fd().W)}. At 30.0° the same force does only 173 J.`;
        case 'part': return 'Only the part of <i>F</i> along the motion does work: <i>F</i> cos <i>θ</i> = 20 cos 60° = 10 N, so <i>W</i> = 10 × 5 = 50 J. The rest of the force is at 90° to the motion.';
        case 'zero': return 'A force at 90° to the motion has no part along it: <i>W</i> = 20 cos 90° × 5 = 0 J (Tutorial 5, A1(d)).';
        case 'neg': return 'At <i>θ</i> = 180°, cos 180° = −1: <i>W</i> = 20 × (−1) × 5 = −100 J. A force against the motion does negative work: it takes energy away from the object.';
        case 'equal': { const w = work3(motion3(sim.t)); return `Work done by <i>F</i> (${J(w.wF)}) + work done by friction (${J(w.wf)}) = ${J(w.tot)}, the same as the change in KE. The weight and the normal force do no work.`; }
        case 'friction': return 'Friction acts against the motion: <i>W</i> = −<i>f</i> × <i>d</i> = −4 × 5 = −20 J. These 20 J of kinetic energy become heat energy.';
        case 'against': return 'The 6 N push does negative work, −6 × 2.67 = −16 J, which removes all 16 J of the block’s kinetic energy (½ × 2 × 4<sup>2</sup>). The block stops after 2.67 m.';
        case 'perp3': return 'The 10 N pull is at 90° to the motion, so it does no work. No work is done on the block at all, so its kinetic energy and its speed (2 m s<sup>−1</sup>) do not change.';
        case 'same': return 'Example 4: the motor’s force (500 N) moves the mass 2.0 m: 500 × 2.0 = 1000 J. The gain in GPE is <i>mgh</i> = 50 × 10 × 2.0 = 1000 J. The work done becomes GPE.';
        case 'flat': return 'Along a 30 cm part the boy moves across, not up: <i>h</i> stays at 0.15 m, and so does the work done. Only the upward distance counts against his weight.';
        case 'ramp': return 'Straight up to the same 3.21 m: <i>F</i> = <i>mg</i> = 20 N over 3.21 m, so 64.3 J. Up the ramp: 12.9 N over 5.00 m, also 64.3 J. The ramp needs a smaller force over a longer distance: the same work.';
        case 'constant': return 'Constant velocity, so the net force is zero (Tutorial 5, C1(a)): along the ramp, <i>F</i> balances the part of the weight down the ramp, <i>mg</i> sin 40° = 12.9 N.';
      }
      return '';
    }

    function renderPredict(tab) {

      box.hidden = false; box.classList.remove('done');
      $('predictQ').innerHTML = P.q;

      const opts = $('predictOpts');
      opts.innerHTML = '';
      P.opts.forEach((o, i) => {

        b.addEventListener('click', () => {
          if (opts.dataset.done) return;
          predictPick = i; opts.querySelectorAll('.opt').forEach((x, j) => x.classList.toggle('picked', j === i));

        opts.appendChild(b);

      delete opts.dataset.done;
      $('predictCheck').textContent = 'Check my answer';

      if (predictPick === null) { fb.innerHTML = '<span class="verdict no">Pick an answer first.</span>'; return; }
      opts.dataset.done = '1';
      const ok = predictPick === P.ans;
      opts.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === P.ans) x.classList.add('right'); else if (j === predictPick) x.classList.add('wrong'); });

    function resetQuiz() { quiz = { i: 0, score: 0, picks: [], done: false, missed: [] }; renderQuiz(); }

      const el = $('quiz'), N = QUIZ.length;

          ? `<p>Go back over these:</p><ul>${quiz.missed.map(([n, k]) => { const Q = QUIZ[n];
              return `<li>Question ${n + 1}${partLabel(Q, k).trim()} (${Q.src}): ${(Q.stem ? Q.stem + ' ' : '') + Q.parts[k].q}</li>`; }).join('')}</ul>`

          <div class="feedback"></div></div>`).join('')}
        <div class="row-btns"><button type="button" id="qSubmit">${many ? 'Submit answers' : 'Submit answer'}</button><button type="button" class="secondary" id="qReset">Reset quiz</button></div>
        <div class="feedback" id="qFb"></div>`;
      el.querySelectorAll('.qpart').forEach(part => {
        const k = +part.dataset.k;
        part.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          if (quiz.done) return;
          quiz.picks[k] = +b.dataset.j; part.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b));

        if (left.length) { fb.innerHTML = `<span class="verdict no">${many ? `Pick an answer for every part first (still to do: ${left.join(', ')}).` : 'Pick an answer first.'}</span>`; return; }
        quiz.done = true; fb.innerHTML = '';
        el.querySelectorAll('.qpart').forEach(part => {
          const k = +part.dataset.k, P = Q.parts[k], ok = quiz.picks[k] === P.ans;
          if (ok) quiz.score++; else quiz.missed.push([quiz.i, k]);
          part.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('picked'); if (j === P.ans) x.classList.add('right'); else if (j === quiz.picks[k]) x.classList.add('wrong'); });
          part.querySelector('.feedback').innerHTML = `<span class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite.'}</span> <span class="why">${P.why}</span>`;
        });

        $('qSubmit').textContent = quiz.i + 1 < N ? 'Next question' : 'See the summary';

    document.querySelectorAll('canvas:not(.graph-canvas)').forEach(c => {
